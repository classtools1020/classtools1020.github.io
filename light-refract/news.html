  @keyframes bub{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}

  depth(g,on){el('line',{x1:330,y1:330,x2:330,y2:520,stroke:'#FFE14D','stroke-width':14,'stroke-linecap':'round'},g);text(g,330,285,'看起來',44,'#FFE14D');
    if(on){const r=el('line',{x1:470,y1:330,x2:470,y2:330,stroke:'#FF3F6E','stroke-width':16,'stroke-linecap':'round'},g);r.innerHTML='<animate attributeName="y2" from="330" to="760" dur="1.2s" fill="freeze"/>';text(g,470,285,'真的',44,'#FF8FA8');}}
};
let i=0,rev=0;const votes={};
const kk=Koko.mount($('kwrap'));
const sfx=n=>{try{window.FX&&FX.sound&&FX.sound[n]&&FX.sound[n]();}catch(e){}};
$('chs').innerHTML=CH.map((c,k)=>`<button data-k="${k}">${c}</button>`).join('');
[...$('chs').children].forEach(b=>b.onclick=()=>{go(S.findIndex(s=>s.ch===+b.dataset.k));});
$('dots').innerHTML=S.map(()=>'<i></i>').join('');[...$('dots').children].forEach((d,k)=>d.onclick=()=>go(k));
function maxRev(s){return s.steps?s.steps.length:(s.a||s.chant?1:0);}
function render(){
  const s=S[i];
  $('scene3d').classList.toggle('hide',!s.scene);$('bg').classList.toggle('hide',!!s.scene);if(s.scene){if(window.NEWS3D)NEWS3D.set(s.scene);else window.__news3dWant=s.scene;}
  $('bg').src=IMG(s.bg);$('bg').style.transform='scale(1.06)';requestAnimationFrame(()=>$('bg').style.transform='scale(1)');
  $('stage').classList.toggle('split',!!s.bg2);$('bg2').classList.toggle('hide',!s.bg2);if(s.bg2)$('bg2').src=IMG(s.bg2);
  $('dim').style.opacity=s.dim||0;
  $('tag').textContent=s.tag||'';$('badge').textContent=s.badge||(s.scene?'🧊 3D 模擬（示意）':BADGE);$('src').innerHTML=s.src||'';$('tag').classList.toggle('hide',!s.tag);
  $('title').textContent=s.title||'';
  $('q').textContent=s.q||'';$('q').style.top=s.big?'calc(var(--u)*560)':'';
  $('big').textContent=s.big||'';$('big').className='big'+(s.bigS?' s':'');$('big').style.top=s.bigTop?'calc(var(--u)*230)':'';
  $('steps').innerHTML=(s.steps||[]).map((t,k)=>`<div class="${k<rev?'on':''}">${t}</div>`).join('');
  $('vote').innerHTML=(s.vote||[]).map((t,k)=>`<button data-k="${k}">${t}<b>${(votes[i]||[])[k]||0}</b></button>`).join('');
  [...$('vote').children].forEach(b=>b.onclick=e=>{e.stopPropagation();votes[i]=votes[i]||[0,0];votes[i][+b.dataset.k]++;b.querySelector('b').textContent=votes[i][+b.dataset.k];sfx('blip');});
  $('ans').textContent=s.a||'';$('ans').classList.toggle('top',s.at===1);$('ans').classList.toggle('top2',s.at===2);$('ans').classList.toggle('on',!!s.a&&rev>0&&!s.steps);
  if(s.vote&&s.a){$('vote').style.top=rev>0?'calc(var(--u)*300)':'';}
  $('stars').textContent=s.chant&&rev>0?'⭐'.repeat(Math.min(3,rev)):'';
  const a=$('act');if(s.link){a.href=s.link[0];a.textContent=s.link[1];a.classList.remove('hide');a.style.bottom='';}
  else if(s.cd){a.removeAttribute('href');a.textContent='⏱ 3、2、1 倒水！';a.classList.remove('hide');a.onclick=countdown;}else a.classList.add('hide');
  if(!s.cd)a.onclick=null;
  const ov=$('ov');ov.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#FF3FB0"/></marker></defs>';
  if(s.draw){const [n,arg]=s.draw.split(':');DRAW[n](el('g',{},ov),rev>0,arg);}
  const showA=rev>0&&s.sayA;kk.say(s.steps&&rev>0?'':(showA?s.sayA:s.say),showA?s.moodA:(s.steps&&rev>0?'happy':s.mood));
  const mr=maxRev(s);$('rv').classList.toggle('hide',!mr);$('rv').textContent=s.chant?'✨ 念一次':s.steps?`✨ 下一條（${Math.min(rev,mr)}/${mr}）`:'✨ 揭曉';
  $('rv').disabled=!s.chant&&rev>=mr;$('rv').style.opacity=$('rv').disabled?.4:1;
  $('pg').textContent=(i+1)+' / '+S.length;
  [...$('chs').children].forEach((b,k)=>b.classList.toggle('on',k===s.ch));
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
function go(k){i=Math.max(0,Math.min(S.length-1,k));rev=0;sfx('jump');render();}
function reveal(){const s=S[i];const mr=maxRev(s);if(!s.chant&&rev>=mr)return;rev++;sfx(s.steps?'blip':'oneup');
  if(rev===1&&s.a&&window.FX&&FX.confetti)try{FX.confetti(40);}catch(e){}render();}
function countdown(){let n=3;const c=$('cd');const tick=()=>{c.textContent=n>0?n:'倒！';c.classList.remove('on');void c.offsetWidth;c.classList.add('on');sfx('blip');if(n-->0)setTimeout(tick,900);};tick();}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('rv').onclick=reveal;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(i+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal();}});
let tx=null;$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(i+(dx<0?1:-1));tx=null;});
const h=location.hash.slice(1);const hc=CHID.indexOf(h);
if(hc>=0)i=S.findIndex(s=>s.ch===hc);else if(+h>0)i=Math.min(S.length-1,+h-1);
render();
})();
</script>
