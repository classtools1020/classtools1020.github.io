<style>

  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%,rgba(255,201,60,.10),transparent 55%),#05101F;color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}

  .chs button{flex:none;font-family:inherit;font-weight:900;font-size:15px;border-radius:999px;padding:7px 14px;cursor:pointer;border:2px solid rgba(120,170,210,.35);background:#0F2841;color:var(--dim)}
  .chs button.on{border-color:var(--amber);background:#3A2F10;color:var(--amber)}
  .stage{position:relative;width:min(100vw,calc((100vh - 118px)*1.7917));aspect-ratio:1600/893;overflow:hidden;border-radius:14px;background:#000;--u:calc(min(100vw,calc((100vh - 118px)*1.7917))/1600)}
  .bg,.bg2{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s,transform 6s ease-out}
  .split .bg{clip-path:inset(0 50% 0 0)}.split .bg2{clip-path:inset(0 0 0 50%)}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,16,.72) 0%,rgba(2,8,16,.15) 38%,rgba(2,8,16,.15) 62%,rgba(2,8,16,.7) 100%);pointer-events:none}
  .dimall{position:absolute;inset:0;background:#020810;pointer-events:none;transition:opacity .4s}
  svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .badge{position:absolute;right:calc(var(--u)*22);top:calc(var(--u)*20);background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);border-radius:999px;padding:calc(var(--u)*6) calc(var(--u)*18);font-size:calc(var(--u)*26);font-weight:900}
  .src{position:absolute;right:calc(var(--u)*20);bottom:calc(var(--u)*14);background:rgba(0,0,0,.6);color:#CFE8FF;border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*12);font-size:calc(var(--u)*22);font-weight:700}
  .src:empty{display:none}.src a{color:#FFE27A}
  .tag{position:absolute;left:calc(var(--u)*24);top:calc(var(--u)*20);background:var(--pink);color:#fff;border-radius:999px;padding:calc(var(--u)*6) calc(var(--u)*20);font-size:calc(var(--u)*28);font-weight:900;letter-spacing:.06em;box-shadow:0 4px 0 #A01070}
  .title{position:absolute;left:0;right:0;top:calc(var(--u)*70);text-align:center;font-weight:900;font-size:calc(var(--u)*92);color:#fff;-webkit-text-stroke:calc(var(--u)*3) #14B8E6;paint-order:stroke;text-shadow:0 0 calc(var(--u)*24) rgba(44,230,255,.6),0 calc(var(--u)*6) 0 rgba(0,0,0,.4);letter-spacing:.04em}
  .q{position:absolute;left:8%;right:8%;top:calc(var(--u)*196);text-align:center;font-weight:900;font-size:calc(var(--u)*54);color:#fff;text-shadow:0 calc(var(--u)*3) calc(var(--u)*10) rgba(0,0,0,.9),0 0 calc(var(--u)*3) #000}
  .big{position:absolute;left:0;right:0;top:calc(var(--u)*300);text-align:center;font-weight:900;font-size:calc(var(--u)*230);color:#fff;-webkit-text-stroke:calc(var(--u)*8) var(--pink);paint-order:stroke;text-shadow:0 0 calc(var(--u)*40) rgba(255,63,176,.7);line-height:1}
  .big.s{font-size:calc(var(--u)*96);-webkit-text-stroke:calc(var(--u)*4) var(--pink)}
  .ans{position:absolute;left:calc(50% + var(--u)*110);bottom:calc(var(--u)*48);transform:translateX(-50%) scale(.3);opacity:0;max-width:calc(100% - var(--u)*520);background:linear-gradient(180deg,#FFE27A,#FFB400);color:#2A1700;border:calc(var(--u)*6) solid #fff;border-radius:calc(var(--u)*30);padding:calc(var(--u)*18) calc(var(--u)*40);font-weight:900;font-size:calc(var(--u)*50);text-align:center;box-shadow:0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .2s}
  .ans.top{bottom:auto;top:calc(var(--u)*290);left:50%;max-width:80%}
  .ans.top2{bottom:auto;top:calc(var(--u)*470);left:50%;max-width:80%}
  .ans.on{transform:translateX(-50%) scale(1);opacity:1}
  .steps{position:absolute;left:calc(50% + var(--u)*120);transform:translateX(-50%);top:calc(var(--u)*200);display:grid;gap:calc(var(--u)*14);width:68%}
  .steps div{background:rgba(8,20,36,.86);border:calc(var(--u)*4) solid rgba(255,255,255,.75);border-radius:calc(var(--u)*24);padding:calc(var(--u)*14) calc(var(--u)*28);font-weight:900;font-size:calc(var(--u)*46);opacity:0;transform:translateX(calc(var(--u)*-60));transition:.4s cubic-bezier(.2,1.4,.4,1)}
  .steps div.on{opacity:1;transform:none}
  .vote{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*330);display:flex;gap:calc(var(--u)*50)}
  .vote button{font-family:inherit;font-weight:900;font-size:calc(var(--u)*56);border-radius:calc(var(--u)*32);padding:calc(var(--u)*24) calc(var(--u)*46);border:calc(var(--u)*6) solid #fff;cursor:pointer;color:#fff;box-shadow:0 calc(var(--u)*10) 0 rgba(0,0,0,.35);min-width:calc(var(--u)*380)}
  .vote button:nth-child(1){background:#1F8FD0}.vote button:nth-child(2){background:#D0306F}
  .vote button b{display:block;font-size:calc(var(--u)*90);font-family:'Bungee',sans-serif;line-height:1.1}
  .vote button:active{transform:translateY(calc(var(--u)*6))}
  .act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*56);font-family:inherit;font-weight:900;font-size:calc(var(--u)*44);border:calc(var(--u)*5) solid #fff;border-radius:999px;padding:calc(var(--u)*14) calc(var(--u)*44);cursor:pointer;background:linear-gradient(180deg,#42E0C8,#1FBFA8);color:#04302A;box-shadow:0 calc(var(--u)*8) 0 #14907F;text-decoration:none;white-space:nowrap}
  .stars{position:absolute;left:0;right:0;bottom:calc(var(--u)*150);text-align:center;font-size:calc(var(--u)*70);letter-spacing:.2em}
  .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bungee',sans-serif;font-size:calc(var(--u)*380);color:#fff;-webkit-text-stroke:calc(var(--u)*10) var(--pink);paint-order:stroke;pointer-events:none;opacity:0}
  .cd.on{animation:cd .9s ease-out}
  @keyframes cd{0%{opacity:0;transform:scale(2)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
  .kwrap{position:absolute;left:calc(var(--u)*6);bottom:calc(var(--u)*4);pointer-events:none}
  .koko{position:relative;display:flex;align-items:flex-end}
  .koko svg{width:calc(var(--u)*230);height:calc(var(--u)*230);filter:drop-shadow(0 calc(var(--u)*8) calc(var(--u)*10) rgba(0,0,0,.5))}
  .koko .kb{position:absolute;left:calc(var(--u)*30);bottom:calc(var(--u)*228);width:max-content;max-width:calc(var(--u)*560);background:#fff;color:#14233A;border:calc(var(--u)*5) solid #14233A;border-radius:calc(var(--u)*28);padding:calc(var(--u)*12) calc(var(--u)*24);font-weight:900;font-size:calc(var(--u)*34);line-height:1.35;box-shadow:0 calc(var(--u)*8) 0 rgba(0,0,0,.3)}
  .koko .kb::after{content:"";position:absolute;left:calc(var(--u)*70);bottom:calc(var(--u)*-30);border:calc(var(--u)*14) solid transparent;border-top:calc(var(--u)*18) solid #14233A}
  .koko.pop svg{animation:hop .5s cubic-bezier(.2,1.6,.4,1)}.koko.pop .kb{animation:bub .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(calc(var(--u)*-40))}100%{transform:none}}
  @keyframes bub{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
  .hide{display:none!important}
  .nav{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 10px;width:min(100vw,1100px)}
  .nav button{font-family:inherit;font-weight:900;font-size:17px;border-radius:14px;padding:10px 16px;cursor:pointer;border:2px solid rgba(120,170,210,.4);background:#0F2841;color:var(--ink)}
  .nav .rv{background:linear-gradient(180deg,#FFE27A,#FFB400);color:#2A1700;border-color:#fff;font-size:19px;padding:10px 26px}
  .nav .nx{background:linear-gradient(180deg,#42E0C8,#1FBFA8);color:#04302A;border-color:#fff}
  .nav .pg{color:var(--dim);font-weight:900;min-width:64px;text-align:center}
  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:520px}
  .dots i{width:11px;height:11px;border-radius:50%;background:#2A4A6E;cursor:pointer}.dots i.on{background:var(--amber)}
  @media (max-width:700px){.nav button{font-size:14px;padding:8px 10px}.nav .rv{font-size:15px;padding:8px 14px}.dots{display:none}}

  /* ===== 列印講義 ===== */
  body.pm{overflow:auto;display:block;background:#F6EBD3;color:#2A1A08}
  body.pm .chs,body.pm .stage,body.pm .nav{display:none!important}
  .pbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;padding:10px;background:#3A2410;color:#FFE9C7;font-weight:900;flex-wrap:wrap}
  .pbar button,.pbar a{font-family:inherit;font-weight:900;font-size:16px;border-radius:12px;padding:8px 16px;border:2px solid #FFE9C7;background:#FFB400;color:#2A1700;cursor:pointer;text-decoration:none}
  .pbar a.off{background:transparent;color:#FFE9C7}
  .pp{width:277mm;height:190mm;margin:10mm auto;background:#FFF8EA;border:3px solid #C99A5B;border-radius:6mm;padding:7mm 9mm;display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr auto;gap:5mm;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.15);page-break-after:always;break-after:page;overflow:hidden}
  .pp .ph{grid-column:1/3;display:flex;align-items:center;gap:4mm}
  .pp .pt{background:#FF3FB0;color:#fff;border-radius:99px;padding:1.5mm 5mm;font-weight:900;font-size:13pt}
  .pp h2{margin:0;font-size:32pt;font-weight:900;color:#2A1A08}
  .pp .pn{margin-left:auto;font-weight:900;color:#9A7A4A;font-size:12pt}
  .pp .im{border-radius:4mm;overflow:hidden;border:2mm solid #fff;box-shadow:0 2mm 4mm rgba(0,0,0,.18);background:#ddd}
  .pp .im img{width:100%;height:100%;object-fit:cover;display:block}
  .pp .tx{display:flex;flex-direction:column;gap:5mm;font-size:23pt;font-weight:700;line-height:1.45}
  .pp .qq{background:#FFE3EF;border:1mm solid #FF7AB8;border-radius:4mm;padding:3mm 4mm}
  .pp .qq b,.pp .aa b{display:block;font-size:15pt;color:#B0206E;margin-bottom:1mm}
  .pp .aa{background:#E3F7E8;border:1mm solid #4CB86A;border-radius:4mm;padding:3mm 4mm}.pp .aa b{color:#1E7A48}
  .pp .ln{border-bottom:.6mm dashed #9A7A4A;height:14mm}
  .pp ol{margin:0;padding-left:7mm}.pp li{margin:1mm 0}
  .pp .kk{display:flex;align-items:center;gap:3mm;font-size:17pt;color:#5A3A12}.pp .kk span{background:#fff;border:.6mm solid #5A3A12;border-radius:4mm;padding:1.5mm 3mm}
  .pp .kk img{width:24mm;height:24mm}
  .pp .ft{grid-column:1/3;background:#FFB400;color:#2A1700;border-radius:3mm;padding:3mm 5mm;font-weight:900;font-size:19pt}
  .pp .vt{display:flex;gap:4mm}.pp .vt span{flex:1;text-align:center;border:1mm solid #5A3A12;border-radius:4mm;padding:3mm;font-weight:900}
  @page{size:A4 landscape;margin:0}
  @media print{.pbar{display:none!important}body.pm{background:#fff}.pp{margin:0 auto;box-shadow:none;border-radius:0;border-width:0;width:297mm;height:209mm;padding:9mm 12mm}}
</style>
</head>

const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function text(p,x,y,s,size,fill,stroke){const t=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-family':'Noto Sans TC, sans-serif','font-weight':900,'font-size':size,fill:fill||'#fff',stroke:stroke||'#000','stroke-width':size*.14,'paint-order':'stroke'},p);t.textContent=s;return t;}
function beam(p,pts,color,w){return el('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:color||'#FFF27A','stroke-width':w||12,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1,style:'filter:drop-shadow(0 0 10px #FFF27A);transition:stroke-dashoffset 1.6s ease-in-out'},p);}
/* 光線疊圖：座標對準 1600×893 照片 */
const DRAW={
  strawRing(g,on){if(!on)return;const r=el('ellipse',{cx:1090,cy:345,rx:120,ry:80,fill:'none',stroke:'#FF3F6E','stroke-width':10,'stroke-dasharray':'20 12'},g);r.innerHTML='<animate attributeName="stroke-dashoffset" from="0" to="64" dur="1s" repeatCount="indefinite"/>';},
  surface(g,on){const l=el('line',{x1:790,y1:345,x2:1420,y2:345,stroke:'#2CE6FF','stroke-width':on?10:0,style:'filter:drop-shadow(0 0 10px #2CE6FF)'},g);
    if(on){text(g,1500,290,'空氣',48,'#fff');text(g,1500,410,'水',48,'#9FE3FF');DRAW.strawRing(g,true);}},
  kink(g,on){const b=beam(g,[[0,-2],[690,364],[1150,842]]);if(on){requestAnimationFrame(()=>requestAnimationFrame(()=>b.setAttribute('stroke-dashoffset',0)));
      setTimeout(()=>{const c=el('circle',{cx:690,cy:364,r:70,fill:'none',stroke:'#FF3FB0','stroke-width':9},g);c.innerHTML='<animate attributeName="r" values="60;85;60" dur="1s" repeatCount="indefinite"/>';el('circle',{cx:690,cy:364,r:16,fill:'#fff'},g);text(g,1000,470,'折一下！',64,'#fff','#FF3FB0');},900);}},
  splitLabel(g,on,arg){el('line',{x1:800,y1:0,x2:800,y2:893,stroke:'#fff','stroke-width':8},g);if(!on)return;const [a,b]=arg.split('|');text(g,400,560,a,60,'#fff','#0E5A8A');text(g,1200,560,b,60,'#fff','#A01070');},
  strawGhost(g,on){if(!on)return;el('line',{x1:1025,y1:345,x2:960,y2:700,stroke:'#FFF27A','stroke-width':16,'stroke-dasharray':'26 16','stroke-linecap':'round',opacity:.95},g);
    text(g,860,640,'真的位置',40,'#FFF27A');el('path',{d:'M1180 560 L1180 470',stroke:'#FF3FB0','stroke-width':10,'marker-end':'url(#ah)'},g);text(g,1290,520,'看起來被抬高',40,'#fff','#FF3FB0');},
  coinLift(g,on){if(!on)return;el('ellipse',{cx:930,cy:600,rx:95,ry:28,fill:'none',stroke:'#FFF27A','stroke-width':8,'stroke-dasharray':'18 12'},g);text(g,930,665,'真的位置',40,'#FFF27A');
    el('path',{d:'M1080 600 L1080 500',stroke:'#FF3FB0','stroke-width':12,'marker-end':'url(#ah)'},g);text(g,1210,520,'看起來的位置',40,'#fff','#FF3FB0');},
  depth(g,on){el('line',{x1:330,y1:330,x2:330,y2:520,stroke:'#FFE14D','stroke-width':14,'stroke-linecap':'round'},g);text(g,330,285,'看起來',44,'#FFE14D');
    if(on){const r=el('line',{x1:470,y1:330,x2:470,y2:330,stroke:'#FF3F6E','stroke-width':16,'stroke-linecap':'round'},g);r.innerHTML='<animate attributeName="y2" from="330" to="760" dur="1.2s" fill="freeze"/>';text(g,470,285,'真的',44,'#FF8FA8');}}
};
let i=0,rev=0;const votes={};
const kk=Koko.mount($('kwrap'));
const sfx=n=>{try{window.FX&&FX.sound&&FX.sound[n]&&FX.sound[n]();}catch(e){}};
$('chs').innerHTML=CH.map((c,k)=>`<button data-k="${k}">${c}</button>`).join('');
[...$('chs').children].forEach(b=>b.onclick=()=>{go(S.findIndex(s=>s.ch===+b.dataset.k));});
$('dots').innerHTML=S.map(()=>'<i></i>').join('');[...$('dots').children].forEach((d,k)=>d.onclick=()=>go(k));
function maxRev(s){return s.steps?s.steps.length:(s.a||s.chant?1:0);}
function render(){
  const s=S[i];
  $('bg').src=IMG(s.bg);$('bg').style.transform='scale(1.06)';requestAnimationFrame(()=>$('bg').style.transform='scale(1)');
  $('stage').classList.toggle('split',!!s.bg2);$('bg2').classList.toggle('hide',!s.bg2);if(s.bg2)$('bg2').src=IMG(s.bg2);
  $('dim').style.opacity=s.dim||0;
  $('tag').textContent=s.tag||'';$('badge').textContent=s.badge||BADGE;$('src').innerHTML=s.src||'';$('tag').classList.toggle('hide',!s.tag);
  $('title').textContent=s.title||'';
  $('q').textContent=s.q||'';$('q').style.top=s.big?'calc(var(--u)*560)':'';
  $('big').textContent=s.big||'';$('big').className='big'+(s.bigS?' s':'');$('big').style.top=s.bigTop?'calc(var(--u)*230)':'';
  $('steps').innerHTML=(s.steps||[]).map((t,k)=>`<div class="${k<rev?'on':''}">${t}</div>`).join('');
  $('vote').innerHTML=(s.vote||[]).map((t,k)=>`<button data-k="${k}">${t}<b>${(votes[i]||[])[k]||0}</b></button>`).join('');
  [...$('vote').children].forEach(b=>b.onclick=e=>{e.stopPropagation();votes[i]=votes[i]||[0,0];votes[i][+b.dataset.k]++;b.querySelector('b').textContent=votes[i][+b.dataset.k];sfx('blip');});
  $('ans').textContent=s.a||'';$('ans').classList.toggle('top',s.at===1);$('ans').classList.toggle('top2',s.at===2);$('ans').classList.toggle('on',!!s.a&&rev>0&&!s.steps);
  if(s.vote&&s.a){$('vote').style.top=rev>0?'calc(var(--u)*300)':'';}
  $('stars').textContent=s.chant&&rev>0?'⭐'.repeat(Math.min(3,rev)):'';
  const a=$('act');if(s.link){a.href=s.link[0];a.textContent=s.link[1];a.classList.remove('hide');a.style.bottom='';}
  else if(s.cd){a.removeAttribute('href');a.textContent='⏱ 3、2、1 倒水！';a.classList.remove('hide');a.onclick=countdown;}else a.classList.add('hide');
  if(!s.cd)a.onclick=null;
  const ov=$('ov');ov.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#FF3FB0"/></marker></defs>';
  if(s.draw){const [n,arg]=s.draw.split(':');DRAW[n](el('g',{},ov),rev>0,arg);}
  const showA=rev>0&&s.sayA;kk.say(s.steps&&rev>0?'':(showA?s.sayA:s.say),showA?s.moodA:(s.steps&&rev>0?'happy':s.mood));
  const mr=maxRev(s);$('rv').classList.toggle('hide',!mr);$('rv').textContent=s.chant?'✨ 念一次':s.steps?`✨ 下一條（${Math.min(rev,mr)}/${mr}）`:'✨ 揭曉';
  $('rv').disabled=!s.chant&&rev>=mr;$('rv').style.opacity=$('rv').disabled?.4:1;
  $('pg').textContent=(i+1)+' / '+S.length;
  [...$('chs').children].forEach((b,k)=>b.classList.toggle('on',k===s.ch));
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
function go(k){i=Math.max(0,Math.min(S.length-1,k));rev=0;sfx('jump');render();}
function reveal(){const s=S[i];const mr=maxRev(s);if(!s.chant&&rev>=mr)return;rev++;sfx(s.steps?'blip':'oneup');
  if(rev===1&&s.a&&window.FX&&FX.confetti)try{FX.confetti(40);}catch(e){}render();}
function countdown(){let n=3;const c=$('cd');const tick=()=>{c.textContent=n>0?n:'倒！';c.classList.remove('on');void c.offsetWidth;c.classList.add('on');sfx('blip');if(n-->0)setTimeout(tick,900);};tick();}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('rv').onclick=reveal;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(i+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal();}});
let tx=null;$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(i+(dx<0?1:-1));tx=null;});

function buildPrint(mode){
  document.body.classList.add('pm');const key=mode==='key';
  const bar=document.createElement('div');bar.className='pbar';
  bar.innerHTML=`🖨️ 列印講義　<a href="?print=student" class="${key?'off':''}">學生版（留空格）</a><a href="?print=key" class="${key?'':'off'}">解答版</a><button onclick="print()">🖨️ 列印</button><a href="${location.pathname}" class="off">⬅ 回上課模式</a>`;
  document.body.appendChild(bar);
  const kokoSrc='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -150 260 260"><polygon points="0,-112 23,-32 107,-35 37,15 66,91 0,46 -66,91 -37,15 -107,-35 -23,-32" fill="#FFE14D" stroke="#E58A00" stroke-width="6" stroke-linejoin="round"/><path d="M-78 -74 Q0 -98 78 -74 Q60 -62 0 -66 Q-60 -62 -78 -74Z" fill="#7A4A22"/><path d="M-52 -76 Q-50 -132 0 -136 Q50 -132 52 -76Z" fill="#A8743F"/><ellipse cx="-30" cy="-4" rx="15" ry="22" fill="#2B1B4A"/><ellipse cx="30" cy="-4" rx="15" ry="22" fill="#2B1B4A"/><circle cx="-35" cy="-12" r="6" fill="#fff"/><circle cx="25" cy="-12" r="6" fill="#fff"/><path d="M-14 28 Q0 46 14 28" fill="#B03050"/></svg>');
  S.forEach((s,k)=>{const p=document.createElement('div');p.className='pp';
    const esc=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    let tx='';
    if(s.big)tx+=`<div style="font-size:30pt;font-weight:900;color:#C0157A">${esc(s.big)}</div>`;
    if(s.q)tx+=`<div class="qq"><b>${s.a||s.vote?'🤔 先猜一猜':'📌 看一看'}</b>${esc(s.q)}</div>`;
    if(s.vote)tx+=`<div class="vt">${s.vote.map(v=>`<span>${key?'':'□ '}${esc(v)}</span>`).join('')}</div>`;
    if(s.steps)tx+=`<ol>${s.steps.map(t=>`<li>${esc(t.replace(/^[①②③④⑤]\s*/,''))}</li>`).join('')}</ol>`;
    if(s.a)tx+=key?`<div class="aa"><b>✅ 答案揭曉</b>${esc(s.a)}</div>`:`<div><b style="color:#1E7A48">✏️ 我的答案：</b><div class="ln"></div><div class="ln"></div></div>`;
    const say=s.sayA&&key?s.sayA:s.say;if(say)tx+=`<div class="kk"><img src="${kokoSrc}" alt=""><span>${esc(say)}</span></div>`;
    const ft=s.a&&key?s.a:(s.title?s.title+(s.q?'：'+s.q:''):'');
    p.innerHTML=`<div class="ph"><span class="pt">${esc(s.tag||'')}</span><h2>${esc(s.title||'')}</h2><span class="pn">${esc(CH[s.ch])}・${k+1}/${S.length}</span></div>
      <div class="im"><img src="${IMG(s.bg)}" alt=""></div><div class="tx">${tx}</div><div class="ft">⭐ 重點：${esc(ft)}</div>`;
    document.body.appendChild(p);});
}
const pmode=(location.search.match(/print=(\w+)/)||[])[1];
if(pmode){buildPrint(pmode);return;}
const h=location.hash.slice(1);const hc=CHID.indexOf(h);
if(hc>=0)i=S.findIndex(s=>s.ch===hc);else if(+h>0)i=Math.min(S.length-1,+h-1);
render();
})();
