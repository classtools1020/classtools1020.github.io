<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<title>反射魔法・照出倒影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --bg1:#05101f; --bg2:#0a2036; --bg3:#0e3350; --panel:#0f2841; --line:rgba(120,170,210,.28);
    --amber:#ffc93c; --teal:#42e0c8; --ink:#eaf6ff; --dim:#9db8cf;
    --disp:'Fredoka','Noto Sans TC',system-ui,sans-serif; --body:'Noto Sans TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%,rgba(255,201,60,.10),transparent 55%),
      linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
  .home{position:fixed;left:12px;top:12px;z-index:120;background:#0f2841;border:2px solid var(--amber);
    color:var(--amber);font-weight:900;font-size:16px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
  header{text-align:center;padding:6px 0 4px}
  .emblem{font-size:56px;filter:drop-shadow(0 8px 18px rgba(255,201,60,.35))}
  h1{font-family:var(--disp);font-size:32px;margin:2px 0 2px}
  .sub{color:var(--teal);font-weight:900;font-size:19px}
  .tip{color:var(--dim);font-weight:800;font-size:15px;margin-top:6px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;border:3px solid var(--line);
    background:#08131f;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-4px);border-color:var(--amber)}
  .card .ph{aspect-ratio:3/2;width:100%;background-size:cover;background-position:top;display:block}
  .card .go{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:900;font-size:13px;padding:5px 12px;border-radius:999px}
  .card .label{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-family:var(--disp);font-weight:700;font-size:22px;padding:6px 14px;border-radius:12px}

  footer{text-align:center;margin-top:30px;color:var(--dim);font-size:14px}

  /* ===== reflection stage overlay ===== */
  .over{position:fixed;inset:0;background:rgba(3,7,15,.96);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .over.show{display:flex}
  .over .x{position:absolute;top:14px;right:16px;font-size:26px;color:var(--dim);font-weight:900;cursor:pointer}
  .stageName{font-family:var(--disp);font-size:28px;font-weight:700;margin-bottom:2px}
  .stageName .en{color:var(--amber);font-size:17px}
  .frame{width:min(640px,94vw);border-radius:16px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6);border:1px solid var(--line);position:relative}
  .scene{height:min(34vh,240px);background-size:cover;background-position:top}
  .surface{height:4px;background:linear-gradient(90deg,transparent,rgba(180,220,255,.9),transparent);position:relative;z-index:3}
  .reflectbox{height:min(34vh,240px);position:relative;overflow:hidden;background:#03060d}
  .reflect{position:absolute;inset:0;background-size:cover;background-position:top;transform:scaleY(-1);
    filter:brightness(.62) saturate(.9);clip-path:inset(0 0 100% 0);transition:clip-path 2.2s linear}
  .reflect.on{clip-path:inset(0 0 0 0)}
  .ripple{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(0deg,rgba(120,180,255,.05) 0 3px,transparent 3px 7px)}
  .reflectbox.on .ripple{opacity:1;animation:rip 2.5s linear infinite}
  @keyframes rip{to{background-position:0 14px}}
  .scan{position:absolute;left:0;right:0;height:26px;top:0;z-index:4;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(255,255,255,.85),transparent);filter:blur(2px)}
  .scan.run{opacity:1;animation:scan 2.2s linear forwards}
  @keyframes scan{0%{top:-26px}100%{top:100%}}

  .magic{margin-top:18px;font-family:var(--disp);font-weight:700;font-size:22px;border:none;border-radius:16px;
    padding:15px 30px;cursor:pointer;color:#3a2a00;background:linear-gradient(180deg,#ffe08a,var(--amber));box-shadow:0 6px 0 #c99a10}
  .magic:active{transform:translateY(3px);box-shadow:0 3px 0 #c99a10}
  .magic:disabled{opacity:.5;box-shadow:none;cursor:default}
  .cap{margin-top:14px;min-height:56px;text-align:center;max-width:600px;opacity:0;transition:opacity .4s}
  .cap.on{opacity:1}
  .cap .ty{display:inline-block;background:var(--teal);color:#062a24;font-weight:900;font-size:15px;border-radius:999px;padding:3px 14px}
  .cap .d{font-size:19px;font-weight:900;margin-top:8px;line-height:1.4}
  .nav{display:flex;align-items:center;gap:18px;margin-top:16px}
  .nav button{background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:22px;font-weight:900;
    border-radius:12px;padding:8px 18px;cursor:pointer}
  .nav button:hover{border-color:var(--amber)}
  .nav .count{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--dim)}
  canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;background:transparent;pointer-events:none;z-index:210}
</style>
</head>
<body>
<a href="/light/" class="mainmenu-btn" style="position:fixed;right:12px;top:12px;z-index:99999;background:#0f2841;border:2px solid #42e0c8;color:#42e0c8;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45);font-family:Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif">🗂️ 主選單</a>
<a class="home" href="./">🏠 回到首頁</a>
<canvas class="confetti" id="cf"></canvas>
<div class="wrap">
  <header>
    <div class="emblem">✨</div>
    <h1>反射魔法・照出倒影</h1>
    <div class="sub">點一張照片，施展反射魔法！</div>
    <div class="tip">👆 點進去 → 按魔法按鈕 → 看光把倒影一條一條照出來</div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>✨ 反射魔法・照出倒影　｜　竹東國中自然科</footer>
</div>

<!-- reflection stage -->
<div class="over" id="over">
  <span class="x" id="closeBtn">✕</span>
  <div class="stageName" id="sName">湖面倒影 <span class="en" id="sEn">Lake reflection</span></div>
  <div class="frame">
    <div class="scene" id="scene"></div>
    <div class="surface"></div>
    <div class="reflectbox" id="rbox">
      <div class="reflect" id="reflect"></div>
      <div class="ripple"></div>
      <div class="scan" id="scan"></div>
    </div>
  </div>
  <button class="magic" id="magicBtn">✨ 施展反射魔法</button>
  <div class="cap" id="cap"><span class="ty" id="capTy"></span><div class="d" id="capD"></div></div>
  <div class="nav">
    <button id="prev">◀</button>
    <span class="count" id="count">1 / 5</span>
    <button id="next">▶</button>
  </div>
</div>

<script>
const PHOTOS=[
  {img:"img/lake.png",zh:"湖面倒影",en:"Lake reflection",ty:"鏡面反射",d:"平靜的水面像鏡子，把山和天空整齊反射出來"},
  {img:"img/mirror.png",zh:"鏡子",en:"Mirror",ty:"鏡面反射",d:"光滑的鏡子把光整齊反射，所以看得到房間和自己"},
  {img:"img/carmirror.png",zh:"後照鏡",en:"Rear-view mirror",ty:"反射的應用",d:"開車用反射，看到後面的車子"},
  {img:"img/puddle.png",zh:"水坑倒影",en:"Puddle reflection",ty:"鏡面反射",d:"下雨後的水坑像鏡子，反射天空和大樓"},
  {img:"img/spoon.png",zh:"湯匙反射",en:"Spoon reflection",ty:"曲面反射",d:"彎彎的湯匙也會反射，影像會變形、上下顛倒"},
];
const $=id=>document.getElementById(id);
let AC,cur=0,busy=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC;}
function tone(f,t,d,ty="triangle",v=.18){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);}
function shimmer(){const a=ac();if(!a)return;const t=a.currentTime;for(let i=0;i<10;i++)tone(700+i*90,t+i*.18,.5,"sine",.09);}
function ding(){const a=ac();if(!a)return;const t=a.currentTime;[784,1047,1319].forEach((f,i)=>tone(f,t+i*.08,.18));}
function speak(zh){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(zh);u.lang="zh-TW";u.rate=.86;speechSynthesis.speak(u);}catch(e){}}

/* confetti */
const cv=$("cf"),cx=cv.getContext("2d");let parts=[];
function csize(){cv.width=innerWidth;cv.height=innerHeight;}csize();addEventListener("resize",csize);
const COL=["#ff4d4d","#3aa0ff","#ffc93c","#28c76f","#ff8a5b","#c77dff"];
function confetti(n=90){for(let i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:innerHeight*.45,vx:(Math.random()-.5)*9,vy:Math.random()*-8-2,
  g:.28,s:6+Math.random()*8,c:COL[Math.floor(Math.random()*COL.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});crun();}
let craf=null;function crun(){if(!craf)craf=requestAnimationFrame(cl);}
function cl(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30&&p.life<240);if(parts.length)craf=requestAnimationFrame(cl);else{craf=null;cx.clearRect(0,0,cv.width,cv.height);}}

/* build grid */
const grid=$("grid");
PHOTOS.forEach((p,i)=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="ph" style="background-image:url('+p.img+')"></div>'+
    '<span class="go">👆 照倒影</span><div class="label">'+p.zh+'</div>';
  c.onclick=()=>open(i);grid.appendChild(c);
});

/* stage */
function open(i){
  cur=(i+PHOTOS.length)%PHOTOS.length;const p=PHOTOS[cur];
  $("sName").firstChild.textContent=p.zh+" ";$("sEn").textContent=p.en;
  $("scene").style.backgroundImage="url("+p.img+")";
  $("reflect").style.backgroundImage="url("+p.img+")";
  reset();
  $("count").textContent=(cur+1)+" / "+PHOTOS.length;
  $("over").classList.add("show");
}
function reset(){
  busy=false;
  $("reflect").classList.remove("on");
  $("rbox").classList.remove("on");
  $("scan").classList.remove("run");
  $("cap").classList.remove("on");
  $("magicBtn").disabled=false;$("magicBtn").textContent="✨ 施展反射魔法";
}
$("magicBtn").onclick=()=>{
  if(busy)return;busy=true;const p=PHOTOS[cur];
  $("magicBtn").disabled=true;$("magicBtn").textContent="✨ 光正在照…";
  $("scan").classList.remove("run");void $("scan").offsetWidth;$("scan").classList.add("run");
  $("reflect").classList.add("on");$("rbox").classList.add("on");
  shimmer();
  setTimeout(()=>{
    $("capTy").textContent=p.ty;$("capD").textContent="💡 光碰到水面／鏡面反射，倒影就照出來了！"+p.d;
    $("cap").classList.add("on");ding();confetti(90);speak(p.zh+"，"+p.ty);
    $("magicBtn").disabled=false;$("magicBtn").textContent="✨ 再照一次";busy=false;
  },2300);
};
$("prev").onclick=()=>open(cur-1);
$("next").onclick=()=>open(cur+1);
$("closeBtn").onclick=()=>$("over").classList.remove("show");
$("over").onclick=e=>{if(e.target===$("over"))$("over").classList.remove("show");};
document.addEventListener("keydown",e=>{if(!$("over").classList.contains("show"))return;
  if(e.key==="ArrowRight")open(cur+1);if(e.key==="ArrowLeft")open(cur-1);if(e.key==="Escape")$("over").classList.remove("show");});
</script>
</body>
</html>
