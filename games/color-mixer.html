<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>混色大挑戰 · 光的三原色</title>
<style>
  :root{--bg1:#080a1e;--bg2:#141235;--ink:#f3f6ff;--ink2:#aab4e6;
    --gold:#ffd34d;--gold2:#ffb01f;--edge:#3a3a86;--card:#14163c}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg1);color:var(--ink)}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #sky{position:absolute;inset:0;overflow:hidden;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 16s ease-in-out infinite}
  .b1{width:44vmax;height:44vmax;background:#b02a5b;left:-8vw;top:-12vh}
  .b2{width:40vmax;height:40vmax;background:#2a5fd0;right:-10vw;top:8vh;animation-delay:-5s}
  .b3{width:38vmax;height:38vmax;background:#2aa15b;left:24vw;bottom:-18vh;animation-delay:-9s}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vw,4vh) scale(1.15)}}

  .screen{position:relative;z-index:2;width:min(96vw,860px);height:min(94vh,650px);
    background:linear-gradient(160deg,rgba(20,22,60,.92),rgba(10,10,30,.96));
    border:2px solid var(--edge);border-radius:26px;box-shadow:0 30px 80px -20px #000;
    display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .screen.on{display:flex;animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

  #hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
    align-items:center;padding:14px 18px;pointer-events:none}
  .coinbox{display:flex;align-items:center;gap:8px;background:rgba(8,6,26,.6);padding:6px 15px 6px 9px;
    border-radius:999px;border:1px solid var(--gold2);pointer-events:auto}
  .coinbox .c{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold2));
    border:2px solid #b8860b;display:flex;align-items:center;justify-content:center;font-weight:900;color:#8a5a00;font-size:14px;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotateY(360deg)}}
  #coinN{font-weight:900;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
  .tools{display:flex;gap:8px;pointer-events:auto}
  .tbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--edge);background:rgba(8,6,26,.6);color:var(--ink);font-size:18px;cursor:pointer}
  .tbtn:active{transform:scale(.9)}

  .pad{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:64px 5vw 24px;gap:16px;min-height:100%}
  h1{font-size:clamp(2rem,6.5vw,3.6rem);font-weight:900;line-height:1.1;text-wrap:balance}
  h2{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900}
  .big{font-size:clamp(1.1rem,3vw,1.6rem);color:var(--ink2);line-height:1.5;max-width:26ch}
  .gold{color:var(--gold)}
  .btn{font-size:clamp(1.2rem,3.2vw,1.7rem);font-weight:900;color:#2a1c00;cursor:pointer;padding:.6em 1.5em;
    border:none;border-radius:999px;background:linear-gradient(180deg,#ffe27a,var(--gold2));
    box-shadow:0 7px 0 #b8790a;transition:.08s}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b8790a}
  .btn.ghost{background:linear-gradient(180deg,#39408f,#262c66);color:#fff;box-shadow:0 7px 0 #171b42}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

  .train{width:clamp(110px,24vw,170px);height:auto;animation:bob 2.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
  .train .wheel{transform-origin:center;animation:wspin 1.2s linear infinite}
  @keyframes wspin{to{transform:rotate(360deg)}}

  /* mixing stage */
  .stage{position:relative;width:min(72vw,340px);height:min(30vh,240px);border-radius:22px;
    background:#05050d;border:3px solid var(--edge);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .stage .spot{position:absolute;width:52%;height:66%;border-radius:50%;mix-blend-mode:screen;filter:blur(10px);opacity:0;transition:opacity .2s,transform .2s}
  .spot.r{background:#ff0000;transform:translate(-24%,-14%)}
  .spot.g{background:#00ff00;transform:translate(24%,-14%)}
  .spot.b{background:#0000ff;transform:translate(0,24%)}
  .spot.on{opacity:1}
  .mixname{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-weight:900;color:#fff;
    font-size:clamp(1.1rem,3vw,1.6rem);text-shadow:0 2px 6px #000;z-index:3}

  .target{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);
    border:1px solid var(--edge);border-radius:16px;padding:10px 18px}
  .tsw{width:clamp(44px,9vw,64px);height:clamp(44px,9vw,64px);border-radius:12px;border:3px solid #fff}
  .tlabel{font-size:clamp(1.1rem,3vw,1.5rem);font-weight:900}

  .lamps{display:flex;gap:clamp(12px,3vw,22px)}
  .lamp{width:clamp(74px,15vw,110px);height:clamp(74px,15vw,110px);border-radius:24px;border:none;cursor:pointer;
    font-weight:900;font-size:clamp(1rem,2.4vw,1.35rem);color:#1a1200;box-shadow:0 8px 0 rgba(0,0,0,.45);
    transition:.08s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .lamp:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.45)}
  .lamp.r{background:linear-gradient(180deg,#ff8a8a,#ff2d2d)}
  .lamp.g{background:linear-gradient(180deg,#7ff0b0,#12d34f)}
  .lamp.b{background:linear-gradient(180deg,#9dc0ff,#2d6bff)}
  .lamp.on{outline:5px solid #fff;outline-offset:3px;transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.45)}
  .lamp .st{font-size:.7rem;opacity:.85}

  .verdict{font-size:clamp(1.3rem,3.6vw,2rem);font-weight:900;min-height:1.3em}
  .progress{display:flex;gap:6px}
  .pdot{width:12px;height:12px;border-radius:50%;background:var(--edge)}
  .pdot.on{background:var(--gold)}
  .pdot.now{background:var(--gold);box-shadow:0 0 10px var(--gold)}

  #zoomer{position:fixed;left:-30vw;top:50%;z-index:65;font-size:clamp(3rem,9vw,6rem);pointer-events:none;opacity:0;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  #zoomer.run{animation:zoom 1.1s cubic-bezier(.5,0,.4,1)}
  @keyframes zoom{0%{opacity:0;left:-30vw;transform:translateY(-50%) scale(.7)}12%{opacity:1}
    50%{transform:translateY(-54%) scale(1.15)}100%{opacity:1;left:115vw;transform:translateY(-50%) scale(.9)}}
  #banner{position:fixed;inset:0;z-index:64;display:none;align-items:center;justify-content:center;pointer-events:none}
  #banner.show{display:flex;animation:bpop .5s cubic-bezier(.2,1.5,.3,1)}
  #banner span{font-size:clamp(2.2rem,8vw,5rem);font-weight:900;color:#fff;text-shadow:0 3px 0 #d98a00,0 6px 18px rgba(0,0,0,.5)}
  @keyframes bpop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  canvas#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
  .badge{font-size:clamp(3rem,10vw,6rem);animation:tada 1s}
  @keyframes tada{0%{transform:scale(.5) rotate(-8deg)}60%{transform:scale(1.2) rotate(4deg)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a href="/light/" class="mainmenu-btn" style="position:fixed;right:12px;top:12px;z-index:99999;background:#0f2841;border:2px solid #42e0c8;color:#42e0c8;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45);font-family:\x27Noto Sans TC\x27,\x27Microsoft JhengHei\x27,system-ui,sans-serif">🗂️ 主選單</a>
<div id="app">
  <div id="sky"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div id="hud">
    <div class="coinbox"><div class="c">$</div><span id="coinN">0</span></div>
    <div class="tools"><button class="tbtn" id="home">🏠</button><button class="tbtn" id="sound">🔊</button><button class="tbtn" id="full">⛶</button></div>
  </div>

  <!-- TITLE -->
  <section class="screen on" id="s-title">
    <div class="pad">
      <svg class="train" viewBox="0 0 200 130">
        <defs><linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff9d1f"/></linearGradient></defs>
        <ellipse cx="100" cy="120" rx="70" ry="8" fill="#000" opacity=".3"/>
        <rect x="30" y="45" width="110" height="55" rx="14" fill="url(#bd)" stroke="#c2740c" stroke-width="3"/>
        <rect x="120" y="20" width="46" height="80" rx="12" fill="#ff7a3d" stroke="#c2740c" stroke-width="3"/>
        <circle cx="143" cy="44" r="13" fill="#bff0ff" stroke="#fff" stroke-width="3"/>
        <circle class="wheel" cx="58" cy="102" r="15" fill="#3a2a10" stroke="#ffd34d" stroke-width="4"/>
        <circle class="wheel" cx="104" cy="102" r="15" fill="#3a2a10" stroke="#ffd34d" stroke-width="4"/>
        <circle cx="70" cy="66" r="8" fill="#fff"/><circle cx="72" cy="67" r="4" fill="#20264d"/>
        <circle cx="98" cy="66" r="8" fill="#fff"/><circle cx="100" cy="67" r="4" fill="#20264d"/>
        <path d="M74 82 Q88 92 102 82" stroke="#8a3b00" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <h1>混色<span class="gold">大挑戰</span></h1>
      <div class="big">用光的三個顏色，調出指定的顏色！<br>光越混會越亮喔 ✨</div>
      <div class="row">
        <button class="btn" onclick="startChallenge()">🏆 開始闖關</button>
        <button class="btn ghost" onclick="freePlay()">🎨 自由玩</button>
      </div>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="s-play">
    <div class="pad">
      <div class="progress" id="prog"></div>
      <div class="target" id="targetBox">
        <div class="tsw" id="tsw"></div>
        <div><div style="font-size:.9rem;color:var(--ink2);font-weight:700">調出這個顏色</div>
          <div class="tlabel" id="tlabel">黃色</div></div>
      </div>
      <div class="stage">
        <div class="spot r" id="spR"></div><div class="spot g" id="spG"></div><div class="spot b" id="spB"></div>
        <div class="mixname" id="mixName">黑黑的（沒開燈）</div>
      </div>
      <div class="lamps">
        <button class="lamp r" data-c="r">紅光<span class="st">關</span></button>
        <button class="lamp g" data-c="g">綠光<span class="st">關</span></button>
        <button class="lamp b" data-c="b">藍光<span class="st">關</span></button>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  </section>

  <!-- FREE -->
  <section class="screen" id="s-free">
    <div class="pad">
      <h2>🎨 自由玩</h2>
      <div class="stage"><div class="spot r" id="fR"></div><div class="spot g" id="fG"></div><div class="spot b" id="fB"></div>
        <div class="mixname" id="fName">黑黑的（沒開燈）</div></div>
      <div class="lamps">
        <button class="lamp r" data-f="r">紅光<span class="st">關</span></button>
        <button class="lamp g" data-f="g">綠光<span class="st">關</span></button>
        <button class="lamp b" data-f="b">藍光<span class="st">關</span></button>
      </div>
      <div class="big" id="fHint">按按看：兩個一起開會變什麼？三個都開呢？</div>
      <button class="btn" onclick="go('title')">← 回首頁</button>
    </div>
  </section>

  <!-- WIN -->
  <section class="screen" id="s-win">
    <div class="pad">
      <div class="badge">🏆</div>
      <h1>全部<span class="gold">調對了！</span></h1>
      <div class="big">你學會了光的三原色：<br>🔴＋🟢＝黃　🟢＋🔵＝青　🔴＋🔵＝洋紅<br>🔴＋🟢＋🔵＝<span class="gold">白（越混越亮）</span></div>
      <div class="big gold" style="font-size:clamp(1.4rem,4vw,2rem)">🪙 金幣 × <span id="finalCoin">0</span></div>
      <button class="btn" onclick="startChallenge()">再挑戰一次 🚂</button>
    </div>
  </section>
</div>

<div id="zoomer">🚂💨</div>
<div id="banner"><span id="bannerTxt">調對了！</span></div>
<canvas id="fx"></canvas>

<script>
/* sound */
let soundOn=true,actx=null;
function tone(f,d,t='sine',v=.15){if(!soundOn)return;try{actx=actx||new(AudioContext||webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d);}catch(e){}}
const sTap=()=>tone(520,.05,'sine',.08),sWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle'),i*90)),
  sCoin=()=>{tone(880,.08);setTimeout(()=>tone(1320,.12),80);},sChoo=()=>{tone(180,.16,'square',.09);setTimeout(()=>tone(150,.2,'square',.09),150);};

/* confetti */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);
function burst(n=90){const cols=['#ffd34d','#ff5470','#3ce88a','#4d8dff','#ff9d1f','#fff'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:Math.random()*-15-4,
    g:.4+Math.random()*.3,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*30});}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  requestAnimationFrame(loop);}loop();
function celebrate(txt){const z=document.getElementById('zoomer');z.classList.remove('run');void z.offsetWidth;z.classList.add('run');
  const b=document.getElementById('banner'),bt=document.getElementById('bannerTxt');bt.textContent=txt;
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1200);sChoo();}

/* coins */
let coins=0;function addCoin(n){coins+=n;document.getElementById('coinN').textContent=coins;}
function flyCoins(n=5){const box=document.querySelector('.coinbox').getBoundingClientRect();
  for(let i=0;i<n;i++){const e=document.createElement('div');e.textContent='🪙';
    e.style.cssText='position:fixed;z-index:70;font-size:26px;left:'+(innerWidth/2)+'px;top:'+(innerHeight*.42)+'px;pointer-events:none;transition:all .7s cubic-bezier(.4,0,.2,1)';
    document.body.appendChild(e);requestAnimationFrame(()=>setTimeout(()=>{e.style.left=box.left+14+'px';e.style.top=box.top+10+'px';e.style.opacity='0';e.style.transform='scale(.4)';},i*70));
    setTimeout(()=>{e.remove();addCoin(2);sCoin();},700+i*70);}}

/* color math (additive) */
const NAMES={'':'黑黑的（沒開燈）',r:'紅色',g:'綠色',b:'藍色',rg:'黃色',rb:'洋紅色',gb:'青色',rgb:'白色（最亮！）'};
const SWATCH={r:'#ff2d2d',g:'#12d34f',b:'#2d6bff',rg:'#ffe100',rb:'#ff30d0',gb:'#00e5e5',rgb:'#ffffff','':'#05050d'};
function keyOf(st){return (st.r?'r':'')+(st.g?'g':'')+(st.b?'b':'');}

/* ---- challenge ---- */
const LEVELS=[
  {k:'rg',name:'黃色'},{k:'gb',name:'青色'},{k:'rb',name:'洋紅色'},{k:'rgb',name:'白色'}
];
let li=0,cstate={r:false,g:false,b:false},locked=false;
function renderProg(){const p=document.getElementById('prog');p.innerHTML='';
  LEVELS.forEach((_,i)=>{const d=document.createElement('div');d.className='pdot'+(i<li?' on':i===li?' now':'');p.appendChild(d);});}
function paintChallenge(){document.getElementById('spR').classList.toggle('on',cstate.r);
  document.getElementById('spG').classList.toggle('on',cstate.g);document.getElementById('spB').classList.toggle('on',cstate.b);
  document.getElementById('mixName').textContent=NAMES[keyOf(cstate)];
  document.querySelectorAll('#s-play .lamp').forEach(l=>{const c=l.dataset.c;l.classList.toggle('on',cstate[c]);
    l.querySelector('.st').textContent=cstate[c]?'開':'關';});}
function loadLevel(){const L=LEVELS[li];document.getElementById('tsw').style.background=SWATCH[L.k];
  document.getElementById('tlabel').textContent=L.name;cstate={r:false,g:false,b:false};locked=false;
  document.getElementById('verdict').textContent='';paintChallenge();renderProg();}
function checkChallenge(){if(locked)return;if(keyOf(cstate)===LEVELS[li].k){locked=true;
  document.getElementById('verdict').innerHTML='✅ 調對了！+3🪙';addCoin(3);burst(90);flyCoins(4);celebrate('調對了！🎉');
  li++;setTimeout(()=>{if(li<LEVELS.length)loadLevel();else{document.getElementById('finalCoin').textContent=coins;
    go('win');burst(160);setTimeout(()=>{burst(140);celebrate('全部調對！🏆');},400);}},1300);}}
document.querySelectorAll('#s-play .lamp').forEach(l=>l.addEventListener('click',()=>{const c=l.dataset.c;
  cstate[c]=!cstate[c];sTap();paintChallenge();checkChallenge();}));
function startChallenge(){coins=coins;li=0;sChoo();go('play');loadLevel();}

/* ---- free play ---- */
let fstate={r:false,g:false,b:false};
function paintFree(){document.getElementById('fR').classList.toggle('on',fstate.r);
  document.getElementById('fG').classList.toggle('on',fstate.g);document.getElementById('fB').classList.toggle('on',fstate.b);
  const k=keyOf(fstate);document.getElementById('fName').textContent=NAMES[k];
  document.querySelectorAll('#s-free .lamp').forEach(l=>{const c=l.dataset.f;l.classList.toggle('on',fstate[c]);
    l.querySelector('.st').textContent=fstate[c]?'開':'關';});
  if(k==='rgb'){tone(1047,.2,'triangle');document.getElementById('fHint').innerHTML='三個都開＝<b class="gold">白光</b>！光越混越亮 ✨';}}
document.querySelectorAll('#s-free .lamp').forEach(l=>l.addEventListener('click',()=>{const c=l.dataset.f;
  fstate[c]=!fstate[c];sTap();paintFree();}));
function freePlay(){fstate={r:false,g:false,b:false};sChoo();go('free');paintFree();}

/* nav + tools */
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById('s-'+id).classList.add('on');}
document.getElementById('home').onclick=()=>{sTap();go('title');};
document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊':'🔇';};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
</script>
</body>
</html>
