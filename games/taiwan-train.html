<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<title>光之環島列車・從台北出發</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{--panel:#0f2841;--line:rgba(120,170,210,.28);--amber:#ffc93c;--teal:#42e0c8;--aqua:#3ec2ff;--ink:#eaf6ff;--dim:#9db8cf;--disp:'Fredoka','Noto Sans TC',system-ui,sans-serif;--body:'Noto Sans TC',system-ui,sans-serif}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;background:radial-gradient(120% 80% at 50% -10%,rgba(62,194,255,.12),transparent 55%),linear-gradient(165deg,#05101f,#0a2036 55%,#0e3350)}
  .fixbtn{position:fixed;top:12px;z-index:99999;background:#0f2841;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
  .home{left:12px;border:2px solid var(--amber);color:var(--amber)} .menu{right:12px;border:2px solid var(--teal);color:var(--teal)}
  .wrap{max-width:1040px;margin:0 auto;padding:60px 12px 40px}
  h1{font-family:var(--disp);text-align:center;font-size:min(7vw,30px);margin:4px 0 2px}
  .sub{text-align:center;color:var(--aqua);font-weight:900;margin-bottom:8px;font-size:16px}
  .hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  .pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--disp);font-weight:700;font-size:18px}
  .pill b{color:var(--amber)}
  .pill.train{border-color:var(--amber);background:linear-gradient(180deg,#2a4a6e,#0f2841)}
  .pill.btn{cursor:pointer;border-color:var(--teal);color:var(--teal)}
  .board{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}
  @media(max-width:780px){.board{grid-template-columns:1fr}}
  /* 台灣地圖 */
  .map{position:relative;background:linear-gradient(180deg,#0b2a45,#0d3a5a);border:3px solid var(--line);border-radius:24px;overflow:hidden;aspect-ratio:3/4;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .city{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#1b3a5c;border:4px solid #5b7a9c;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .2s}
  .city .n{position:absolute;left:58px;top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:900;font-size:14px;color:#eaf6ff;text-shadow:0 2px 4px #000}
  .city.l .n{left:auto;right:58px}
  .city.done{background:#1f6b3a;border-color:#6be59a}.city.now{border-color:var(--amber);background:#5a3f0c;animation:pulse 1.2s infinite}.city.lock{opacity:.5;filter:grayscale(.7)}
  .city.sp{border-color:#ff9ad0;box-shadow:0 0 0 3px rgba(255,154,208,.35),0 6px 14px rgba(0,0,0,.5)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .train{position:absolute;font-size:38px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6));transform:translate(-50%,-50%);pointer-events:none;z-index:3;transition:none}
  .smoke{position:absolute;font-size:20px;pointer-events:none;animation:smoke 1.1s forwards;z-index:2}
  @keyframes smoke{from{opacity:.9;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(-26px,-60px) scale(1.5)}}
  /* 右側：明信片／說明 */
  .side{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .post{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#08111d;border:2px solid var(--line)}
  .post img{width:100%;height:100%;object-fit:cover;display:block}
  .post .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(0deg,rgba(4,10,20,.92),transparent);font-weight:900;font-size:min(4.5vw,20px)}
  .post .stamp{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);color:#b3261e;font-family:var(--disp);font-weight:700;font-size:16px;padding:4px 10px;border:3px double #b3261e;border-radius:6px;transform:rotate(8deg)}
  .fact{margin-top:10px;font-weight:800;line-height:1.6;font-size:16px}
  .term{display:inline-block;background:var(--teal);color:#063;border-radius:999px;padding:1px 12px;font-size:14px;font-weight:900;margin-left:6px}
  .say{text-align:center;font-weight:900;font-size:min(4.6vw,19px);color:#ffe08a;min-height:26px}
  .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:var(--disp);font-weight:700;font-size:min(5vw,20px);border:none;border-radius:16px;padding:12px 22px;cursor:pointer;color:#08131f}
  .btn.go{background:linear-gradient(180deg,var(--amber),#ff9f1c);box-shadow:0 6px 0 #c9860f}.btn.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c9860f}
  .btn.ghost{background:#13314f;border:2px solid var(--line);color:var(--ink)}
  .btn.big{font-size:min(7vw,28px);padding:16px 36px;border-radius:24px}
  .speed{display:flex;gap:6px;justify-content:center;margin-top:6px}
  .speed span{padding:4px 12px;border-radius:999px;background:#13314f;font-weight:900;font-size:14px;opacity:.5}
  .speed span.on{opacity:1;background:var(--amber);color:#08131f}
  /* 關卡覆蓋層 */
  .xp{position:fixed;inset:0;z-index:9300;background:#03081a;display:none;flex-direction:column;align-items:center;padding:12px;overflow:auto}
  .xp.show{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .xp .x{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:50%;border:2px solid var(--amber);background:#0f2841;color:var(--amber);font-weight:900;font-size:22px;cursor:pointer;z-index:2}
  .xp h3{font-family:var(--disp);font-size:min(6vw,26px);margin:6px 48px 4px;text-align:center}
  .xp .q{font-weight:900;color:var(--aqua);font-size:min(5vw,22px);text-align:center;margin-bottom:8px;max-width:900px}
  .scene{position:relative;width:min(96vw,900px);aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:3px solid var(--line);background:#08111d;touch-action:none}
  .scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scene img.bg.dim{filter:brightness(.3)}
  .scene .lbl{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--disp);font-weight:700;font-size:min(4.5vw,22px);padding:6px 14px;border-radius:12px;z-index:5}
  .objs{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:space-evenly;align-items:flex-end;z-index:3}
  .obj{width:18%;text-align:center;cursor:pointer;transition:transform .15s;position:relative}
  .obj img{width:100%;max-height:34vh;object-fit:contain;filter:url(#lightf) drop-shadow(0 12px 14px rgba(0,0,0,.6))}
  .obj .nm{font-weight:900;font-size:min(4vw,18px);background:rgba(0,0,0,.6);border-radius:10px;padding:2px 10px;display:inline-block;margin-top:4px}
  .obj.pick{transform:translateY(-10px) scale(1.08)}.obj.pick img{outline:4px solid var(--amber);outline-offset:6px;border-radius:12px}
  .obj.drag{z-index:9;pointer-events:none}
  .spot{position:absolute;top:0;bottom:0;width:22%;background:radial-gradient(ellipse at 50% 60%,rgba(255,255,220,.55),rgba(255,255,220,.15) 55%,transparent 75%);z-index:2;pointer-events:none;mix-blend-mode:screen}
  .wagons{position:absolute;left:0;right:0;top:6%;display:flex;justify-content:space-evenly;z-index:2}
  .wag{width:26%;height:32%;border-radius:14px;border:4px dashed rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:min(4vw,18px);background:rgba(0,0,0,.35);transition:background .2s,border-color .2s}
  .wag.over{border-color:var(--amber);background:rgba(255,201,60,.2)}.wag.full{border-style:solid;border-color:#6be59a;background:rgba(40,160,90,.35)}
  .wag .big{font-size:min(9vw,44px)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(96vw,900px);margin-top:10px}
  @media(max-width:520px){.opts{grid-template-columns:1fr}}
  .opt{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:14px;font-weight:900;font-size:min(5vw,21px);cursor:pointer;display:flex;align-items:center;gap:10px}
  .opt .sw{width:30px;height:30px;border-radius:8px;border:2px solid #fff;flex:none}
  .opt.wrong{border-color:#ffb27a}.opt.right{border-color:#6be59a;background:#1f4d33}
  .lamps{display:flex;gap:14px;justify-content:center;margin-top:10px}
  .lamp{width:min(24vw,110px);aspect-ratio:1;border-radius:22px;border:4px solid rgba(255,255,255,.3);font-size:min(9vw,44px);cursor:pointer;background:#13314f;display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .lamp.on{border-color:#fff;transform:scale(1.06)}
  .mixc{width:min(40vw,180px);aspect-ratio:1;border-radius:50%;margin:12px auto 0;border:6px solid rgba(255,255,255,.4);transition:background .3s,box-shadow .3s}
  .balloons{position:absolute;inset:0;z-index:3}
  .bal{position:absolute;width:14%;aspect-ratio:1/1.25;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;cursor:pointer;box-shadow:inset -10px -14px 20px rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.4);animation:float 3s ease-in-out infinite;display:flex;align-items:flex-end;justify-content:center;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;padding-bottom:6px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .bal.pop{animation:balpop .4s forwards}
  @keyframes balpop{to{transform:scale(1.6);opacity:0}}
  .fb{margin-top:10px;font-weight:900;font-size:min(4.8vw,20px);color:#ffe08a;text-align:center;min-height:28px;max-width:900px}
  .pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);font-family:var(--disp);font-weight:700;font-size:min(10vw,58px);color:#ffd43b;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8);pointer-events:none;z-index:9400;animation:pop 1s ease-out forwards;white-space:nowrap}
  .pop.soft{color:#ffe0b3;font-size:min(7vw,40px)}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
  /* 到站明信片全螢幕 */
  .arrive{position:fixed;inset:0;z-index:9450;background:#03081a;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:10px}
  .arrive.show{display:flex;animation:fade .4s}
  .arrive .big{position:relative;width:min(96vw,900px);aspect-ratio:16/9;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .arrive .big img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 6s ease-out forwards}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
  .arrive .big .stamp{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.92);color:#b3261e;font-family:var(--disp);font-weight:700;font-size:min(5vw,22px);padding:6px 14px;border:3px double #b3261e;border-radius:6px;transform:rotate(8deg);animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes stampin{from{transform:rotate(8deg) scale(3);opacity:0}to{transform:rotate(8deg) scale(1);opacity:1}}
  .arrive h2{font-family:var(--disp);font-size:min(8vw,34px);margin:0;text-align:center}
  .arrive .fact{max-width:900px;text-align:center;font-size:min(4.8vw,20px)}
  /* 扭蛋／圖鑑 */
  .gacha{position:fixed;inset:0;z-index:9500;background:rgba(3,8,26,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .gacha.show{display:flex}
  .capsule{font-size:min(40vw,160px);animation:wob .6s infinite;cursor:pointer}
  @keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .capsule.open{animation:openc .6s forwards}
  @keyframes openc{to{transform:scale(1.6);opacity:0}}
  .prize{font-size:min(36vw,150px);animation:prize .8s cubic-bezier(.2,1.6,.4,1) forwards;transform:scale(0)}
  @keyframes prize{to{transform:scale(1)}}
  .ptitle{font-family:var(--disp);font-size:min(8vw,34px);color:var(--amber);text-align:center}
  .book{position:fixed;inset:0;z-index:9500;background:rgba(3,8,26,.97);display:none;flex-direction:column;align-items:center;padding:60px 14px 20px;overflow:auto}
  .book.show{display:flex}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(96vw,720px)}
  .cell{aspect-ratio:1;background:var(--panel);border:3px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(12vw,52px);gap:4px}
  .cell.miss{filter:grayscale(1);opacity:.35}.cell small{font-size:13px;font-weight:900;color:var(--dim)}
  .cell.got{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,201,60,.3)}
  footer{text-align:center;margin-top:20px;color:var(--dim);font-size:13px}
</style>
</head>

<script src="fx.js"></script>
<script>
const $=id=>document.getElementById(id);
const IMG="/light-color/img/",TW="/light-color/img/tw/";
const OBJ=[{n:"蘋果",img:IMG+"stage/apple.png",ref:"R",em:"🍎"},{n:"香蕉",img:IMG+"stage/banana.png",ref:"RG",em:"🍌"},{n:"植物",img:IMG+"stage/plant.png",ref:"G",em:"🪴"},{n:"白衣",img:IMG+"stage/shirt.png",ref:"RGB",em:"👕"}];
const LIGHT={white:[1,1,1],red:[1,0,0],green:[0,1,0],blue:[0,0,1],none:[0,0,0]},LN={white:"⚪ 白光",red:"🔴 紅光",green:"🟢 綠光",blue:"🔵 藍光",none:"🌑 沒有光"};
function setLight(k){if(!LIGHT[k])k="white";const [r,g,b]=LIGHT[k];$("lmtx").setAttribute("values",`${r} 0 0 0 0  0 ${g} 0 0 0  0 0 ${b} 0 0  0 0 0 1 0`);const l=document.querySelector("#xpBody .lbl");if(l)l.textContent=LN[k];}
function dark(ref,k){const need={red:"R",green:"G",blue:"B"}[k];return need&&!ref.includes(need);}
/* ===== 溫和音效（沒有爆炸、沒有震動） ===== */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,t0,vol,type){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
const S={tap:()=>tone(880,.08,0,.08),ok:()=>{tone(523,.25,0,.12);tone(659,.25,.1,.12);tone(784,.35,.2,.12);},no:()=>{tone(494,.18,0,.08);tone(392,.28,.15,.08);},coin:()=>{tone(1319,.12,0,.1);tone(1760,.25,.08,.1);},
  whistle:()=>{tone(660,.5,0,.07,"triangle");tone(880,.5,.15,.07,"triangle");},chug:n=>{for(let i=0;i<n;i++)tone(110,.06,i*.18,.05,"triangle");},arrive:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.4,i*.12,.1));},up:()=>{[659,784,988,1319].forEach((f,i)=>tone(f,.3,i*.08,.1));}};
/* ===== 環島路線：11 站（台北→…→台北） ===== */

  $("cap").onclick=()=>{$("cap").className="capsule open";S.tap();later(()=>{$("cap").style.display="none";$("prize").style.display="block";$("prize").textContent=GIFTS[pick][0];$("pName").textContent="✨ "+GIFTS[pick][1];$("gT").textContent="🎉 收到了！";S.coin();FX.confetti(90);$("gOk").style.display="inline-block";},600);};
  $("gOk").onclick=()=>{gifts.push(pick);localStorage.setItem("twGifts",JSON.stringify(gifts));coins+=20;hud();$("gacha").classList.remove("show");S.coin();};}
$("bookBtn").onclick=()=>{$("grid").innerHTML=POSTS.map((p,i)=>`<div class="cell ${posts.includes(i)?"got":"miss"}">${p[0]}<small>${posts.includes(i)?p[1]:"？？？"}</small></div>`).join("")+GIFTS.map((g,i)=>`<div class="cell ${gifts.includes(i)?"got":"miss"}">${g[0]}<small>${gifts.includes(i)?g[1]:"禮物"}</small></div>`).join("");$("book").classList.add("show");S.tap();};
hud();drawMap();showPost(0);if(cur===0)$("postCap").textContent="🚉 台北車站・準備出發";
</script>
