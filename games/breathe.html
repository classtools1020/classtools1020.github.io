<style>
  :root{--amber:#ffc93c;--teal:#42e0c8;--aqua:#3ec2ff;--ink:#eaf6ff;--dim:#9db8cf;--card:#0f2841;--line:rgba(120,170,210,.28)}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);min-height:100vh;user-select:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(120% 80% at 50% -10%,rgba(62,194,255,.12),transparent 55%),linear-gradient(165deg,#05101f,#0a2036 55%,#0e3350);padding-bottom:100px}
  .fixbtn{position:fixed;top:12px;z-index:9000;background:#0f2841;font-weight:900;font-size:16px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45);border:2px solid var(--teal);color:var(--teal)}

  .phl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;will-change:transform,filter}

  body.gl #cv{display:none}body:not(.gl) #gl{display:none}
  .buddy{position:absolute;left:14px;bottom:10px;display:flex;align-items:flex-end;gap:6px;pointer-events:none;z-index:3}
  .buddy img{width:min(18vw,150px);height:min(18vw,150px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.55));transition:transform .6s}
  .buddy .say{background:rgba(255,255,255,.92);color:#10233a;font-weight:900;font-size:min(3.6vw,26px);padding:8px 14px;border-radius:18px 18px 18px 4px;margin-bottom:min(12vw,96px);white-space:nowrap}
  .mode .ic img,.zone img{display:block;margin:0 auto}
  .mode .ic img{width:84px;height:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
  .zone img{width:64px;height:64px;margin-bottom:2px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
  .credit{text-align:center;color:#6f87a0;font-size:12px;font-weight:700;margin-top:14px}
  .cue{font-size:min(9vw,54px);font-weight:900;margin:12px 0 4px;min-height:70px;text-align:center}
  .cnt{font-size:22px;color:var(--amber);font-weight:900;min-height:30px}
  .ctrl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .btn{font:inherit;font-weight:900;font-size:22px;border:none;border-radius:16px;padding:12px 20px;cursor:pointer;color:#08131f;background:var(--amber);box-shadow:0 5px 0 #b8860b}
  .btn.ghost{background:#1a2f4f;color:var(--ink);box-shadow:0 5px 0 #0a1626;border:2px solid var(--line)}.btn.teal{background:var(--teal);box-shadow:0 5px 0 #14907f}
  .btn:active{transform:translateY(3px)}
  .speed{display:flex;gap:8px;align-items:center;font-weight:900;font-size:18px;justify-content:center;margin-top:12px}
  .speed button{font:inherit;font-weight:900;border-radius:12px;border:2px solid var(--line);background:#0f2841;color:var(--ink);padding:6px 12px;cursor:pointer}.speed button.on{background:var(--teal);color:#08131f}
  .tip{max-width:1040px;margin-top:14px;background:#0b1d31;border-left:6px solid var(--teal);border-radius:12px;padding:10px 14px;font-size:17px;font-weight:800;color:#cfe4f5;line-height:1.55}
  @media(max-width:700px){.zones{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}}
</style>

<script type="module" src="breathe3d.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$("cv"),g=cv.getContext("2d"),W=1280,H=720,CX=640,CY=360;
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
if(/from=checkin/.test(location.search)){$("backBtn").href="checkin.html";}
/* ---------- 聲音：輕柔滑音 ---------- */
let AC=null;const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;};
/* ---------- 真實質感音效（豎琴、頌缽、海浪；檔案在 sfx/breath/） ---------- */
const SB={};const SFXN=["inhale","exhale","hold","round","done","tap","tapL","tapR","bowl","shake","waves"];
function loadSfx(){const a=ac();if(!a||SB._l)return;SB._l=1;SFXN.forEach(n=>fetch("sfx/breath/"+n+".mp3").then(r=>r.arrayBuffer()).then(b=>a.decodeAudioData(b)).then(buf=>{SB[n]=buf;if(n==="waves"&&wavesOn)startWaves();}).catch(()=>{}));}
function play(n,vol,rate){const a=ac();if(!a||!SB[n])return false;const s=a.createBufferSource(),g=a.createGain();s.buffer=SB[n];if(rate)s.playbackRate.value=rate;g.gain.value=vol==null?.9:vol;s.connect(g);g.connect(a.destination);s.start();return true;}
let wavesOn=false,wavesSrc=null,wavesGain=null;
try{wavesOn=localStorage.getItem("breathWaves")==="1";}catch(e){}
function startWaves(){const a=ac();if(!a||!SB.waves||wavesSrc)return;wavesSrc=a.createBufferSource();wavesSrc.buffer=SB.waves;wavesSrc.loop=true;wavesGain=a.createGain();wavesGain.gain.value=0;wavesSrc.connect(wavesGain);wavesGain.connect(a.destination);wavesSrc.start();wavesGain.gain.linearRampToValueAtTime(.35,a.currentTime+2);}
function stopWaves(){if(!wavesSrc)return;const a=ac();wavesGain.gain.linearRampToValueAtTime(0,a.currentTime+1);const s=wavesSrc;setTimeout(()=>{try{s.stop();}catch(e){}},1100);wavesSrc=null;}
function toggleWaves(){wavesOn=!wavesOn;try{localStorage.setItem("breathWaves",wavesOn?"1":"0");}catch(e){}loadSfx();if(wavesOn)startWaves();else stopWaves();const b=document.getElementById("wavesBtn");if(b)b.classList.toggle("on",wavesOn);}
document.addEventListener("pointerdown",()=>loadSfx(),{once:true});
setTimeout(()=>{const b=document.getElementById("wavesBtn");if(b){b.classList.toggle("on",wavesOn);b.onclick=e=>{e.stopPropagation();toggleWaves();};}},0);
function glide(f1,f2,d,v){const a=ac();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),t=a.currentTime;o.type="sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v||.06,t+.3);gn.gain.linearRampToValueAtTime(0,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.05);}
function tick(f){const a=ac();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),t=a.currentTime;o.type="sine";o.frequency.value=f||660;gn.gain.setValueAtTime(.12,t);gn.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+.3);}
function bell(){const a=ac();if(!a)return;const t=a.currentTime;[[528,1,.28],[1060,.5,.12],[1580,.3,.06],[2640,.2,.03]].forEach(([f,d,v])=>{const o=a.createOscillator(),gn=a.createGain();o.type="sine";o.frequency.value=f;
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+14*d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+14*d+.1);});}
/* ---------- 模式 ---------- */
const STD=[["in",4,"吸氣……"],["hold",2,"停一下……"],["out",6,"慢慢吐氣……"]];
const MODES=[
 {id:"bubble",ic:"🫧",nm:"光之泡泡",ds:"泡泡變大吸、變小吐",rounds:3,ph:STD,tip:"每堂固定的開場。泡泡變大就吸氣，變小就慢慢吐。吐氣比吸氣長，身體會比較放鬆。"},
 {id:"glow",ic:"💡",nm:"光之呼吸燈",ds:"畫面變亮吸、變暗吐",rounds:3,ph:STD,tip:"關掉教室的燈效果最好。畫面像一盞燈，吸氣時慢慢亮起來，吐氣時慢慢暗下去。"},
 {id:"ball",ic:"🌐",nm:"呼吸球",ds:"球撐開吸、收起來吐",rounds:3,ph:STD,tip:"模仿國外特教班常用的伸縮呼吸球（Hoberman 球）。教室有實體呼吸球的話，老師拿著真的球一起開合更有感。"},
 {id:"finger",ic:"✋",nm:"五指呼吸",ds:"手指往上吸、往下吐",rounds:5,ph:[["in",3,"往上，吸氣……"],["out",4,"往下，吐氣……"]],tip:"請學生伸出一隻手，用另一隻手的食指沿著手指描：往上吸、往下吐。五根手指描完就是五次呼吸，有觸覺提示，最好懂。"},
 {id:"box",ic:"🟦",nm:"方塊呼吸",ds:"畫正方形：吸、停、吐、停",rounds:3,ph:[["in",3,"吸氣……"],["hold",3,"停一下……"],["out",3,"吐氣……"],["hold2",3,"停一下……"]],tip:"方塊呼吸（box breathing），連美國海豹部隊都在用。學生可以伸出手指，在空中跟著畫正方形。"},
 {id:"rainbow",ic:"🌈",nm:"彩虹呼吸",ds:"手臂畫彩虹往上吸、往下吐",rounds:3,ph:STD,tip:"接任務三：兩隻手從身體旁邊往上畫一道彩虹（吸氣），再慢慢放下來（吐氣）。每一輪換一個顏色。"},
 {id:"jar",ic:"✨",nm:"平靜瓶",ds:"搖一搖，看亮粉慢慢沉下來",rounds:1,ph:null,tip:"數位版平靜瓶（calm-down jar）。真的平靜瓶做法：透明瓶加水、甘油、亮粉，用手電筒從後面照，亮粉會發光。看著亮粉沉到底，心也跟著靜下來。"},
 {id:"bell",ic:"🔔",nm:"聽鐘聲",ds:"聽到聲音完全消失才舉手",rounds:1,ph:null,tip:"MindUP 正念課程的核心練習：眼睛輕輕閉上，專心聽鐘聲慢慢變小，完全聽不到了再舉手。專注力會一次比一次長。"},
 {id:"butterfly",ic:"🦋",nm:"蝴蝶擁抱",ds:"雙手交叉，左右輪流輕拍",rounds:1,ph:null,tip:"蝴蝶擁抱源自 1998 年墨西哥災後輔導：雙手交叉放在胸前，像蝴蝶拍翅膀一樣左右輪流輕拍。觸覺敏感的學生可以改拍膝蓋。"}
];
const SUG={blue:["butterfly","glow","rainbow"],green:["bubble","box","bell"],yellow:["box","finger","ball"],red:["jar","finger","bubble"]};
const ZT={blue:"🔵 藍色：身體有點累、心情低低的。試試蝴蝶擁抱或呼吸燈，讓身體慢慢醒過來。",green:"🟢 綠色：很棒，已經準備好了！做一輪呼吸，把專心帶進今天的任務。",yellow:"🟡 黃色：心跳有點快。方塊呼吸或五指呼吸能讓身體慢下來。",red:"🔴 紅色：生氣很正常，先不要說話。看平靜瓶的亮粉沉下來，或用五指呼吸，等到變回黃色、綠色再說。"};
const NE=c=>`img/noto/${c}.webp`;const ICO={"bubble": "1fae7", "glow": "1f4a1", "ball": "1f30f", "finger": "1f590_fe0f", "box": "1f60e", "rainbow": "1f308", "jar": "2728", "bell": "1f514", "butterfly": "1f98b"};
$("grid").innerHTML=MODES.map(m=>`<div class="mode" data-id="${m.id}"><div class="ic"><img src="${NE(ICO[m.id])}" alt="" loading="lazy"></div><div class="nm">${m.nm}</div><div class="ds">${m.ds}</div></div>`).join("");
document.querySelectorAll(".mode").forEach(el=>el.onclick=()=>start(el.dataset.id));
document.querySelectorAll(".zone").forEach(z=>z.onclick=()=>{if(!play("tap",.8))tick(560);const s=SUG[z.dataset.z];document.querySelectorAll(".mode").forEach(m=>m.classList.toggle("sug",s.includes(m.dataset.id)));$("zoneTip").textContent=ZT[z.dataset.z]+"（亮框的是推薦）";});
let speed=1;document.querySelectorAll("#speed button[data-s]").forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll("#speed button[data-s]").forEach(x=>x.classList.toggle("on",x===b));});
/* ---------- 呼吸小夥伴（會動的真實表情） ---------- */
const FACE={idle:"263a_fe0f",in:"1f60c",hold:"1f60a",hold2:"1f60a",out:"1f62e_200d_1f4a8",done:"1f973",hug:"1f917",listen:"1f60c"};
let curFace="";function face(k,say){const c=FACE[k]||k;if(c!==curFace){curFace=c;$("buddy").src=NE(c);}if(say!=null)$("bsay").textContent=say;}
const use3D=()=>window.B3D&&B3D.ok&&M&&B3D.has(M.id);
function applyView(){document.body.classList.toggle("gl",!!use3D());if(use3D())B3D.setMode(M.id);}
document.addEventListener("b3d-ready",()=>{if(M)applyView();});
/* ---------- 播放引擎 ---------- */
let M=null,raf=0,t0=0,running=false,st={};
function start(id){M=MODES.find(m=>m.id===id);document.body.classList.add("play");$("tip").textContent="💡 "+M.tip;$("cue").textContent="準備好了嗎？";$("cnt").textContent="";
  st={phase:null,k:0,round:0,p:0,done:false,sparks:[],taps:0,side:0,bellT:0,shaken:false};applyView();setPhoto(M.id);face(M.id==="butterfly"?"hug":"idle","一起呼吸吧！");
  $("speed").style.display=M.ph?"flex":"none";
  setCtrl([["▶ 開始","go",begin],["↩ 換一種","ghost",back]]);running=false;cancelAnimationFrame(raf);loopIdle();window.scrollTo({top:0});}
function back(){running=false;cancelAnimationFrame(raf);document.body.classList.remove("play");setPhoto(null);}
function setCtrl(bs){$("ctrl").innerHTML="";bs.forEach(([t,c,f])=>{const b=document.createElement("button");b.className="btn "+(c==="go"?"":c);b.textContent=t;b.onclick=()=>{ac();f();};$("ctrl").appendChild(b);});}
function loopIdle(){draw(0);if(!running)raf=requestAnimationFrame(loopIdle);}
function begin(){running=true;cancelAnimationFrame(raf);st.round=0;st.k=0;t0=performance.now();setCtrl([["⏹ 停止","ghost",()=>{start(M.id);}]]);
  if(M.id==="jar"){jarShake();if(use3D())B3D.jarShake();face("in","慢慢看……");} if(M.id==="bell"){if(!play("bowl",.95))bell();st.bellT=performance.now();$("cue").textContent="閉上眼睛，聽……";face("listen","噓……聽");setCtrl([["✋ 我聽不到了","teal",finish]]);}
  if(M.id==="butterfly"){st.taps=0;st.t0=t0;st.speed=speed;face("hug","抱抱自己");}
  enterPhase();raf=requestAnimationFrame(loop);}
function enterPhase(){if(!M.ph)return;const [kind,dur,txt]=M.ph[st.k];st.phase=kind;st.dur=dur*speed*1000;st.ps=performance.now();$("cue").textContent=txt;
  $("cnt").textContent=`第 ${st.round+1} / ${M.rounds} 次`;face(kind,kind==="in"?"吸……":kind==="out"?"呼……":"停一下");if(kind==="in"){if(!play("inhale",.85))glide(220,440,dur*speed,.05);}else if(kind==="out"){if(!play("exhale",.9))glide(440,200,dur*speed,.05);}else{if(!play("hold",.7))tick(520);}}
function loop(now){if(!running)return;
  if(M.ph){st.p=Math.min(1,(now-st.ps)/st.dur);if(st.p>=1){st.k++;if(st.k>=M.ph.length){st.k=0;st.round++;if(st.round>=M.rounds){finish();return;}play("round",.6);}enterPhase();}}
  if(M.id==="butterfly"){const iv=900*speed,n=Math.floor((now-t0)/iv);if(n>st.taps){st.taps=n;st.side=n%2;if(!play(st.side?"tapR":"tapL",.9))tick(st.side?600:500);$("cue").textContent=st.side?"右 🦋":"左 🦋";$("cnt").textContent=`${Math.min(n,24)} / 24 下`;if(n>=24){finish();return;}}}

function finish(){running=false;cancelAnimationFrame(raf);face("done","你做到了！");$("cue").textContent="很好，你做到了 ✨";$("cnt").textContent="";try{FX.confetti(40);if(!play("done",.9))FX.sound.coin();}catch(e){}
  const bs=[["🔁 再一次","go",begin],["🫧 換一種","ghost",back]];if(/from=checkin/.test(location.search))bs.push(["➡ 回心情打卡","teal",()=>location.href="checkin.html"]);setCtrl(bs);loopIdle();}
/* ---------- 畫面 ---------- */
const ease=x=>.5-.5*Math.cos(Math.PI*x);
function breathLevel(){if(!running||!M.ph)return 0;const p=ease(st.p);return st.phase==="in"?p:st.phase==="out"?1-p:st.phase==="hold"?1:0;}
function bg(c1,c2){const gr=g.createRadialGradient(CX,CY,50,CX,CY,760);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,W,H);}

/* ---------- 真實照片模式 ---------- */
const PH={bubble:"img/breath/bubble.jpg",glow:"../moon/img/candle.jpg",ball:"img/breath/ball.jpg",finger:"img/breath/hand.jpg",bell:"img/breath/bowl.jpg",butterfly:"img/breath/butterfly.jpg",rainbow:"../light-color/img/tw/yilan.jpg"};

let phMode=null;
function setPhoto(id){phMode=PH[id]?id:null;document.body.classList.toggle("ph",!!phMode);if(!phMode)return;$("phImg").src=PH[id];$("phSvg").innerHTML=id==="finger"?'<defs><filter id="phg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path id="phDone" fill="none" stroke="#FFE14D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#phg)" opacity=".85"/><path id="phCur" fill="none" stroke="#FFF6B0" stroke-width="18" stroke-linecap="round" filter="url(#phg)"/><circle id="phDot" r="38" fill="#FFFBE0" filter="url(#phg)"/>':(id==="bell"?'<g id="phRings" fill="none" stroke="#FFE9A8" stroke-width="10"></g>':"");}
const lerp2=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function drawPhoto(now){const L=breathLevel(),im=$("phImg");let sc=1,br=1,rot=0,sat=1;
  if(phMode==="bubble"){sc=1+.16*L;br=.8+.35*L;}
  else if(phMode==="glow"){sc=1+.04*L;br=.4+.85*L;}
  else if(phMode==="ball"){sc=.94+.16*L;br=.85+.25*L;}
  else if(phMode==="rainbow"){sc=1+.06*L;br=.7+.45*L;sat=.6+.8*L;}
  else if(phMode==="finger"){sc=1+.03*L;br=.9+.15*L;drawHand();}
  else if(phMode==="butterfly"){const tap=running?Math.max(0,1-((now-t0)%(900*speed))/350):0;rot=(st.side?1:-1)*2.2*tap;sc=1+.03*tap;}
  else if(phMode==="bell"){const e=running&&st.bellT?(now-st.bellT)/1000:0;const a=running?Math.max(0,1-e/14):0;br=.85+.2*a;
    $("phRings").innerHTML=a>0?[0,1,2].map(k=>{const r=((e*90+k*160)%480);return `<circle cx="1693" cy="860" r="${200+r}" opacity="${(a*(1-r/480)*.8).toFixed(2)}"/>`;}).join(""):"";}
  im.style.transform=`scale(${sc.toFixed(4)}) rotate(${rot.toFixed(2)}deg)`;im.style.filter=`brightness(${br.toFixed(3)}) saturate(${sat.toFixed(2)})`;}
function drawHand(){const i=Math.min(4,st.round||0);const start=i===0?HAND.P0:HAND.V[i-1];const p=running?ease(st.p||0):0;
  let pos;if(!running)pos=HAND.P0;else if(st.phase==="in")pos=lerp2(start,HAND.T[i],p);else pos=lerp2(HAND.T[i],HAND.V[i],p);
  let d="M"+HAND.P0.join(" ");for(let k=0;k<i;k++)d+=" L"+HAND.T[k].join(" ")+" L"+HAND.V[k].join(" ");
  $("phDone").setAttribute("d",i?d:"");
  $("phCur").setAttribute("d",running?("M"+start.join(" ")+(st.phase==="in"?" L"+pos.join(" "):" L"+HAND.T[i].join(" ")+" L"+pos.join(" "))):"");
  $("phDot").setAttribute("cx",pos[0]);$("phDot").setAttribute("cy",pos[1]);}
function draw(now){if(M&&PH[M.id]){drawPhoto(now||performance.now());return;}if(use3D()){B3D.frame(breathLevel(),now||performance.now(),st,running);return;}g.clearRect(0,0,W,H);const L=breathLevel();({bubble:dBubble,glow:dGlow,ball:dBall,finger:dFinger,box:dBox,rainbow:dRainbow,jar:dJar,bell:dBell,butterfly:dButterfly})[M.id](L,now||0);}
function dBubble(L){bg("#0e3350","#05101f");const r=90+L*170;const gr=g.createRadialGradient(CX-r*.3,CY-r*.3,r*.1,CX,CY,r);gr.addColorStop(0,"rgba(255,255,255,.9)");gr.addColorStop(.4,"rgba(150,220,255,.55)");gr.addColorStop(1,"rgba(80,160,255,.15)");
  g.fillStyle=gr;g.beginPath();g.arc(CX,CY,r,0,7);g.fill();g.strokeStyle="rgba(255,255,255,.7)";g.lineWidth=4;g.stroke();g.strokeStyle="rgba(255,255,255,.25)";g.setLineDash([10,14]);g.beginPath();g.arc(CX,CY,260,0,7);g.stroke();g.setLineDash([]);}
function dGlow(L){const a=.08+L*.85;bg(`rgba(255,${200+L*40},${120+L*60},${a})`,"#03070f");const gr=g.createRadialGradient(CX,CY,10,CX,CY,120+L*260);gr.addColorStop(0,`rgba(255,250,210,${.3+L*.7})`);gr.addColorStop(1,"rgba(255,220,120,0)");g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle=`rgba(255,244,200,${.4+L*.6})`;g.beginPath();g.arc(CX,CY-20,60,Math.PI*.9,Math.PI*2.1);g.lineTo(CX+30,CY+60);g.lineTo(CX-30,CY+60);g.closePath();g.fill();g.fillStyle="#9aa6b5";g.fillRect(CX-32,CY+62,64,34);}
function dBall(L,now){bg("#12294a","#05101f");const R=100+L*170,n=12,rot=(now||0)/4000;const cols=["#ff6b6b","#ffd43b","#51cf66","#339af0","#cc5de8","#ff922b"];
  for(let i=0;i<n;i++){const a=rot+i/n*Math.PI*2;g.strokeStyle=cols[i%6];g.lineWidth=7;g.beginPath();g.ellipse(CX,CY,Math.abs(Math.cos(a))*R+4,R,0,0,7);g.stroke();}
  for(let j=1;j<4;j++){const y=R*(j/4*2-1);const rr=Math.sqrt(R*R-y*y);g.strokeStyle=cols[(j+2)%6];g.lineWidth=6;g.beginPath();g.ellipse(CX,CY+y,rr,rr*.18,0,0,7);g.stroke();}}
function dFinger(L){bg("#1b2d44","#07111e");
  const fx=[430,540,640,740,850],top=[250,150,120,150,300],base=[470,440,430,440,500];
  g.fillStyle="#f2c9a0";fx.forEach((x,i)=>{g.beginPath();g.moveTo(x-38,base[i]);g.lineTo(x-38,top[i]);g.arc(x,top[i],38,Math.PI,0);g.lineTo(x+38,base[i]);g.fill();});
  g.beginPath();g.ellipse(CX,560,250,160,0,0,7);g.fill();
  if(!running&&!st.done)return;const i=Math.min(4,st.round);const x=fx[i];let y;
  if(st.phase==="in")y=base[i]-(base[i]-top[i]+30)*ease(st.p);else y=top[i]-30+(base[i]-top[i]+30)*ease(st.p);
  const up=st.phase==="in";const gx=up?x-40:x+40;
  g.fillStyle="#ffe15a";g.shadowColor="#ffe15a";g.shadowBlur=30;g.beginPath();g.arc(gx,y,22,0,7);g.fill();g.shadowBlur=0;
  for(let k=0;k<i;k++){g.fillStyle="#5fe08a";g.beginPath();g.arc(fx[k],top[k]-60,16,0,7);g.fill();}}
function dBox(L){bg("#10304e","#05101f");const s=380,x0=CX-s/2,y0=CY-s/2;g.lineWidth=10;g.strokeStyle="rgba(255,255,255,.2)";g.strokeRect(x0,y0,s,s);
  const lbl=[["吸",CX,y0-24],["停",x0+s+46,CY+14],["吐",CX,y0+s+54],["停",x0-46,CY+14]];g.font=`900 36px ${FONT}`;g.textAlign="center";lbl.forEach(([t,x,y],k)=>{g.fillStyle=running&&st.k===k?"#ffd43b":"rgba(255,255,255,.5)";g.fillText(t,x,y);});
  if(!running)return;const pts=[[x0,y0],[x0+s,y0],[x0+s,y0+s],[x0,y0+s],[x0,y0]];const a=pts[st.k],b=pts[st.k+1],p=st.p;
  g.strokeStyle="#ffd43b";g.lineWidth=12;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<=st.k;k++)g.lineTo(pts[k][0],pts[k][1]);g.lineTo(a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p);g.stroke();
  g.fillStyle="#fff";g.shadowColor="#ffd43b";g.shadowBlur=30;g.beginPath();g.arc(a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p,20,0,7);g.fill();g.shadowBlur=0;}
function dRainbow(L){bg("#16345a","#05101f");const cols=["#ff5a5a","#ff9f40","#ffd43b","#5fe08a","#3ec2ff","#4b6bff","#b56bff"];const r=Math.min(2,st.round||0);
  g.fillStyle="#2f6b3a";g.fillRect(0,600,W,120);
  cols.forEach((c,k)=>{g.strokeStyle=k<=r*2+2?c:"rgba(255,255,255,.08)";g.lineWidth=22;g.beginPath();g.arc(CX,600,420-k*26,Math.PI,Math.PI+Math.PI*(running?Math.max(.02,L):.02));g.stroke();});
  if(running){const ang=Math.PI+Math.PI*Math.max(.02,L),rr=420;g.fillStyle="#fff";g.shadowColor="#fff";g.shadowBlur=24;g.beginPath();g.arc(CX+Math.cos(ang)*rr,600+Math.sin(ang)*rr,18,0,7);g.fill();g.shadowBlur=0;}}
function jarShake(){play("shake",.8);st.sparks=[];const cols=["#ffd43b","#ff8fd8","#7fdcff","#b98bff","#ffffff","#7dffb0"];for(let k=0;k<160;k++)st.sparks.push({x:CX+(Math.random()*2-1)*170,y:170+Math.random()*420,vx:(Math.random()*2-1)*4,vy:(Math.random()*2-1)*4,c:cols[k%6],r:3+Math.random()*4,rest:false});st.done=false;tick(700);}
function dJar(L,now){bg("#0b1e33","#03070f");const gr=g.createRadialGradient(CX,CY,20,CX,CY,300);gr.addColorStop(0,"rgba(255,245,200,.25)");gr.addColorStop(1,"rgba(255,245,200,0)");g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle="rgba(150,210,255,.12)";g.strokeStyle="rgba(200,235,255,.8)";g.lineWidth=6;g.beginPath();g.roundRect?g.roundRect(CX-200,140,400,480,50):g.rect(CX-200,140,400,480);g.fill();g.stroke();
  g.fillStyle="#8a93a3";g.fillRect(CX-150,105,300,40);
  st.sparks.forEach(s=>{if(running&&!s.rest){s.vx*=.985;s.vy=s.vy*.985+.018;s.x+=s.vx;s.y+=s.vy;if(s.x<CX-190||s.x>CX+190)s.vx*=-.6;s.x=Math.max(CX-190,Math.min(CX+190,s.x));if(s.y<155)s.vy=Math.abs(s.vy);if(s.y>=605-s.r){s.y=605-s.r;s.rest=true;}}

  if(!running&&!st.sparks.length)label("按「開始」搖一搖 ✨",CY,"#ffe08a",38);}
function dBell(L,now){bg("#132a45","#05101f");const e=running&&st.bellT?(now-st.bellT)/1000:0;const a=running?Math.max(0,1-e/14):1;
  for(let k=0;k<4;k++){const rr=((e*60+k*90)%360)+120;g.strokeStyle=`rgba(255,215,120,${running?a*(1-(rr-120)/360)*.8:0})`;g.lineWidth=6;g.beginPath();g.arc(CX,CY,rr,0,7);g.stroke();}
  g.fillStyle="#d9a441";g.beginPath();g.ellipse(CX,CY+40,150,60,0,0,7);g.fill();g.fillStyle="#b88428";g.beginPath();g.ellipse(CX,CY+20,120,40,0,0,7);g.fill();g.fillStyle="#3a2a12";g.beginPath();g.ellipse(CX,CY+18,96,26,0,0,7);g.fill();

function dButterfly(L,now){bg("#1d2d4a","#05101f");const side=st.side,tap=running?Math.max(0,1-((now-t0)%(900*speed))/350):0;

  hand(CX-90,440+(side===0?-tap*14:0),running&&side===0&&tap>0);hand(CX+90,440+(side===1?-tap*14:0),running&&side===1&&tap>0);
  g.font=`900 60px ${FONT}`;g.textAlign="center";g.fillText("🦋",CX,120);}
