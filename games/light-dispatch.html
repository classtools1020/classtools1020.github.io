<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<script src="/gate.js"></script>
<title>光線特勤隊出勤</title>
<style>
  :root{--ink:#1f2a37;--red:#d8352a;--blue:#2361b8;--gold:#ffcf2e;--paper:#fffaf0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fc3d8;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage canvas{display:block;touch-action:none}
  button{font-family:inherit;touch-action:manipulation;cursor:pointer}
  .hide{display:none!important}
  .hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;pointer-events:none;z-index:5}
  .hud>*{pointer-events:auto}
  .nb{font-weight:800;font-size:17px;padding:10px 14px;border-radius:12px;border:none;background:rgba(255,255,255,.94);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18);text-decoration:none;line-height:1}
  .unit{background:#fff;border-radius:14px;padding:6px 12px;font-weight:900;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px}
  .unit .bar{width:min(20vw,220px);height:12px;background:#e7e1d4;border-radius:8px;overflow:hidden}
  .unit .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb52e,#ffd84d);transition:width .6s}
  .team{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:#fff;font-weight:900;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .25s,box-shadow .25s}
  .team b{font-size:22px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
  .team .cards{font-size:15px;color:#5b6673}
  .team.r{color:var(--red)}.team.b{color:var(--blue)}
  .team.on{transform:scale(1.1);box-shadow:0 0 0 4px currentColor,0 4px 14px rgba(0,0,0,.2)}
  .team.bump b{animation:bump .4s}
  @keyframes bump{40%{transform:scale(1.5);color:#ff9f1a}}
  .sp{margin-left:auto}
  .mute{min-width:48px}
  /* 報案條 */
  .banner{position:fixed;left:50%;top:66px;transform:translateX(-50%);width:min(94vw,900px);background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:12px 20px 14px;text-align:center;border:4px solid var(--red);z-index:4}
  .banner .k{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:16px;border-radius:999px;padding:4px 14px;letter-spacing:.1em}
  .banner .t{font-size:clamp(24px,3.2vw,38px);font-weight:900;margin-top:6px;line-height:1.3}
  .banner .s{font-size:clamp(16px,1.8vw,21px);color:#5b6673;font-weight:700;margin-top:2px}
  .banner.q{border-color:#1f2a37}.banner.q .k{background:#1f2a37}
  .banner.pop{animation:pop .45s}
  @keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1);opacity:1}}
  .bot{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 12px;z-index:4}
  .big{font-weight:900;font-size:clamp(22px,2.6vw,30px);padding:18px 34px;border-radius:20px;border:none;box-shadow:0 6px 16px rgba(0,0,0,.25);line-height:1}
  .go{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
  .go.b{background:var(--blue)}
  @keyframes pulse{50%{transform:scale(1.06)}}
  /* 開車控制 */
  .steer{position:fixed;bottom:18px;width:min(22vw,170px);height:min(22vw,170px);border-radius:50%;border:none;background:rgba(255,255,255,.88);font-size:clamp(46px,7vw,74px);font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:4;color:var(--ink)}
  .steer:active,.steer.on{background:#ffcf2e;transform:scale(.94)}
  #stL{left:18px}#stR{right:18px}
  .combo{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-size:clamp(40px,7vw,86px);font-weight:900;color:#fff;-webkit-text-stroke:3px #1f2a37;paint-order:stroke;text-shadow:0 6px 0 #ff9f1a;pointer-events:none;z-index:4;opacity:0}
  .combo.show{animation:cmb .7s ease-out}
  @keyframes cmb{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
  .count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,18vw,220px);font-weight:900;color:#fff;-webkit-text-stroke:6px #1f2a37;paint-order:stroke;text-shadow:0 10px 0 #d8352a;pointer-events:none;z-index:6}
  .count.tick{animation:tick .8s ease-out}
  @keyframes tick{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
  .tip{position:fixed;left:50%;bottom:200px;transform:translateX(-50%);background:rgba(31,42,55,.85);color:#fff;font-weight:800;font-size:clamp(17px,2vw,22px);padding:10px 18px;border-radius:14px;z-index:4;pointer-events:none;white-space:nowrap}
  .flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:7}
  .flash.on{animation:fl .45s}
  @keyframes fl{0%{opacity:.85}100%{opacity:0}}
  .pts{position:fixed;font-size:44px;font-weight:900;color:#ffd84d;-webkit-text-stroke:2px #1f2a37;paint-order:stroke;pointer-events:none;z-index:7;animation:rise 1.2s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-20px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120px) scale(1)}}
  /* 解說 */
  .ex{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(96vw,980px);background:var(--paper);border-radius:22px;box-shadow:0 10px 34px rgba(0,0,0,.3);padding:14px 18px 16px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:center;z-index:5;animation:up .45s}
  @keyframes up{0%{transform:translate(-50%,40px);opacity:0}}
  .ex img{width:100%;height:min(32vh,280px);object-fit:cover;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .ex .ok{font-size:clamp(28px,3.4vw,42px);font-weight:900;color:#2f9a4c}
  .ex .tx{font-size:clamp(20px,2.3vw,27px);font-weight:800;line-height:1.45;margin:4px 0 8px}
  .ex .tx b{color:var(--red)}
  .ex .safe{font-size:clamp(16px,1.8vw,20px);font-weight:900;color:#fff;background:var(--red);border-radius:10px;padding:6px 12px;display:inline-block;margin-bottom:8px}
  .ex button{display:block;font-weight:900;font-size:24px;padding:14px 24px;border-radius:16px;border:none;background:linear-gradient(135deg,#ff9f1a,#ffcf2e);color:#1f2a37;box-shadow:0 5px 14px rgba(0,0,0,.25);animation:pulse 1.2s infinite}
  /* 抽卡 */
  .gacha{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(40,30,80,.75),rgba(10,12,30,.92));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;gap:18px}
  .gacha .h{color:#fff;font-weight:900;font-size:clamp(24px,3vw,36px);text-align:center}
  .rays{position:absolute;width:140vmin;height:140vmin;background:repeating-conic-gradient(rgba(255,230,140,.22) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite;opacity:0;transition:opacity .5s;pointer-events:none}
  .rays.on{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .box{font-size:clamp(120px,22vmin,200px);line-height:1;cursor:pointer;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:hop 1s infinite}
  .box.shake{animation:shk .12s infinite}
  @keyframes hop{50%{transform:translateY(-14px)}}
  @keyframes shk{25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
  .card3{width:min(62vw,300px);height:min(86vw,420px);perspective:1200px}
  .card3 .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1.2);transform:rotateY(180deg) scale(.6)}
  .card3.flip .in{transform:rotateY(0) scale(1)}
  .face,.back{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  .back{transform:rotateY(180deg);background:linear-gradient(135deg,#1f2a37,#3b5577);border:6px solid #ffcf2e;display:flex;align-items:center;justify-content:center;font-size:90px}
  .face{border:6px solid #fff;display:flex;flex-direction:column;align-items:center;padding:16px;color:#fff;text-align:center}
  .face .st{font-size:28px;letter-spacing:4px;color:#ffe680;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .face .em{font-size:clamp(90px,16vmin,130px);line-height:1.2;margin:8px 0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
  .face .nm{font-size:clamp(28px,4vmin,36px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .face .sk{margin-top:auto;background:rgba(255,255,255,.92);color:#1f2a37;border-radius:14px;padding:10px 12px;font-weight:800;font-size:18px;line-height:1.35;width:100%}
  .face.r3::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:foil 2.2s infinite}
  @keyframes foil{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
  .rare{color:#fff;font-weight:900;font-size:clamp(22px,3vw,32px);min-height:1.4em;text-shadow:0 3px 0 rgba(0,0,0,.4)}
  .gacha .nx{font-weight:900;font-size:24px;padding:14px 28px;border-radius:16px;border:none;background:#fff;color:#1f2a37}
  /* 開始、結案 */
  .cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(18,30,48,.35),rgba(18,30,48,.7));z-index:9}
  .card{background:var(--paper);border-radius:26px;padding:26px 30px;width:min(94vw,780px);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4);max-height:94vh;overflow:auto}
  .card h1{margin:0;font-size:clamp(38px,6vw,64px);font-weight:900;letter-spacing:.06em;color:var(--red);text-shadow:0 3px 0 #ffd84d}
  .card .sub{font-size:clamp(17px,2vw,22px);font-weight:800;color:#5b6673;margin:6px 0 16px}
  .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .rules div{background:#fff;border-radius:16px;padding:10px 6px;font-weight:900;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .rules span{display:block;font-size:40px}
  .packs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pack{border:none;border-radius:20px;padding:18px 12px;font-size:clamp(22px,2.8vw,30px);font-weight:900;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .pack small{display:block;font-size:16px;font-weight:800;opacity:.92;margin-top:6px}
  .pack.l{background:linear-gradient(135deg,#d8352a,#f07a2a)}.pack.r{background:linear-gradient(135deg,#1f6fb8,#1fa0a0)}
  .end h2{margin:0;font-size:clamp(34px,5vw,56px);color:var(--red)}
  .end .sc{display:flex;justify-content:center;gap:16px;margin:14px 0}
  .end .sc>div{flex:1;border-radius:18px;padding:12px;color:#fff;font-weight:900;font-size:22px;position:relative}
  .end .sc b{display:block;font-size:46px}
  .end .crown{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:48px;animation:hop 1s infinite}
  .mini{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
  .mini span{background:rgba(255,255,255,.95);color:#1f2a37;border-radius:10px;padding:4px 8px;font-size:15px;font-weight:800}
  canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:7}
  @media (max-width:760px){.unit .bar{display:none}.rules{grid-template-columns:1fr}.ex{grid-template-columns:1fr}.ex img{height:22vh}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="cf"></canvas>
<div class="flash" id="flash"></div>

<div class="hud">
  <button class="nb" id="back">← 返回</button>
  <a class="nb" id="home" href="/light/">🏠 主選單</a>
  <div class="unit">🚒 竹東分隊 <span class="bar"><i id="prog"></i></span> <span id="cnt">0/6</span></div>
  <div class="sp"></div>
  <div class="team r" id="tR">🔴 紅隊 <b id="sR">0</b><span class="cards" id="cR">🃏0</span></div>
  <div class="team b" id="tB">🔵 藍隊 <b id="sB">0</b><span class="cards" id="cB">🃏0</span></div>
  <button class="nb mute" id="mute" title="音效">🔊</button>
</div>

<div class="banner hide" id="ban"><span class="k" id="banK"></span><div class="t" id="banT"></div><div class="s" id="banS"></div></div>
<div class="bot hide" id="bot"><button class="big go" id="go">🚨 紅隊出動！</button></div>
<button class="steer hide" id="stL">◀</button><button class="steer hide" id="stR">▶</button>
<div class="tip hide" id="tip"></div>
<div class="combo" id="combo"></div>
<div class="count hide" id="count"></div>
<div class="ex hide" id="ex"></div>

<div class="gacha hide" id="gacha"><div class="rays" id="rays"></div>
  <div class="h" id="gH">🎁 抽一張夥伴卡！</div>
  <div class="box" id="box">🎁</div>
  <div class="card3 hide" id="card3"><div class="in"><div class="face" id="cardF"></div><div class="back">⭐</div></div></div>
  <div class="rare" id="rare"></div>
  <button class="nx hide" id="gNext">🚒 回分隊，下一個報案 →</button>
</div>

<div class="cover" id="cover">
  <div class="card">
    <h1>光線特勤隊・出勤！</h1>
    <div class="sub">竹東有人報案！紅隊、藍隊輪流開特勤車去幫忙</div>
    <div class="rules"><div><span>🚒</span>按 ◀ ▶ 換車道<br>撿 ✨ 光點、閃 🚧</div><div><span>🃏</span>到現場<br>轉一轉、點對的證據卡</div><div><span>🎁</span>答對了<br>抽一張夥伴卡</div></div>
    <div class="packs">
      <button class="pack l" data-p="lens">🔍 透鏡案件<small>放大鏡・眼鏡・貓眼・一滴水</small></button>
      <button class="pack r" data-p="refract">💧 折射案件<small>吸管・硬幣・泳池・抓魚</small></button>
    </div>
  </div>
</div>

<div class="cover hide" id="endC"><div class="card end" id="endCard"></div></div>

<script type="module">
import * as THREE from '../light-town/lib/three.module.min.js';
import { RoomEnvironment } from '../light-town/lib/RoomEnvironment.js';
import { buildWorld, updateWorld, koko, person, walkPose, M } from '../light-town/world.js';

const $ = id => document.getElementById(id);
const IMG = '../';   // 圖片根目錄（light-refract/mv、img/lesson）

// ---------- 案件 ----------
const LENS_SVG = thick => { const w0 = thick ? 34 : 10, w1 = thick ? 8 : 34; let L = [], R = [];
  for (let i = 0; i <= 20; i++) { const t = -1 + i / 10, w = w1 + (w0 - w1) * (1 - t * t); L.push(`${40 - w / 2},${40 + t * 34}`); R.unshift(`${40 + w / 2},${40 + t * 34}`); }
  return `<svg viewBox="0 0 80 80"><polygon points="${L.concat(R).join(' ')}" fill="#bfe6f5" stroke="#2a7fb8" stroke-width="3"/></svg>`; };
const THICK = { ic: LENS_SVG(true), t: '中間厚' }, THIN = { ic: LENS_SVG(false), t: '中間薄' };
const PACKS = {
  lens: [
    { at: 'glasses', place: '光光眼鏡行', call: '阿公看報紙，字太小，看不清楚！', q: '要給阿公哪一種鏡片？', opts: [THICK, THIN], a: 0,
      img: 'light-refract/mv/magnifier.jpg', ex: '<b>中間厚</b>的鏡片（凸透鏡），讓字<b>變大</b>！老花眼鏡就是中間厚。' },
    { at: 'apt', place: '光明公寓', call: '有人按門鈴，住戶想知道門外是誰！', q: '門上的貓眼，是哪一種鏡片？', opts: [THICK, THIN], a: 1,
      img: 'img/lesson/peephole.jpg', ex: '貓眼是<b>中間薄</b>的鏡片（凹透鏡）：東西變小，但看得到<b>整條走廊</b>。' },
    { at: 'school', place: '光線國中', call: '同學拿放大鏡，把窗外的景色投到白紙上！', q: '白紙上的景色是——', opts: [{ ic: '🌳', t: '正的' }, { ic: '<span style="display:inline-block;transform:rotate(180deg)">🌳</span>', t: '倒過來' }], a: 1,
      img: 'img/lesson/projection.jpg', ex: '光走過焦點會<b>交叉</b>，上面跑到下面——景色<b>倒過來</b>了！' },
    { at: 'stationery', place: '光華文具', call: '一滴水，滴在作業簿的字上面！', q: '水滴下面的字，看起來？', opts: [{ ic: '🔎', t: '變大' }, { ic: '🤏', t: '變小' }], a: 0,
      img: 'light-refract/mv/drop.jpg', ex: '一滴水圓圓鼓鼓，<b>中間厚</b>，就是一個小小的放大鏡，字<b>變大</b>！' },
    { at: 'park', place: '溪邊公園', call: '有人拿放大鏡，對著太陽照樹葉！', q: '樹葉會怎麼樣？', opts: [{ ic: '🔥', t: '冒煙、燒焦' }, { ic: '🍃', t: '沒事' }], a: 0,
      img: 'img/lesson/convex-laser.jpg', ex: '放大鏡把陽光<b>聚到焦點</b>，焦點<b>很燙</b>，樹葉會燒起來！', safe: '⚠ 放大鏡不能對著太陽、不能對著人' },
    { at: 'grocery', place: '福利雜貨', call: '店裡的圓魚缸，金魚好像變胖了！', q: '從旁邊看圓魚缸，金魚看起來？', opts: [{ ic: '🐡', t: '變大' }, { ic: '🐟', t: '變小' }], a: 0,
      img: 'light-refract/mv/aquarium.jpg', ex: '圓圓的魚缸裝滿水，<b>中間厚</b>，像放大鏡一樣，金魚<b>變大</b>了！' },
  ],
  refract: [
    { at: 'tea', place: '光光茶飲', call: '客人大叫：我的吸管斷掉了！', q: '吸管真的斷了嗎？', opts: [{ ic: '🥤', t: '沒有斷' }, { ic: '✂️', t: '真的斷了' }], a: 0,
      img: 'light-refract/mv/straw.jpg', ex: '吸管<b>沒有斷</b>！光從水裡出來，在<b>水面折一下</b>，眼睛被騙了。' },
    { at: 'temple', place: '土地公廟', call: '碗裡的硬幣看不見了，廟公要倒水！', q: '倒水以後，會怎樣？', opts: [{ ic: '🪙', t: '硬幣出現了' }, { ic: '🙈', t: '還是看不見' }], a: 0,
      img: 'light-refract/mv/coin.jpg', ex: '倒了水，光在<b>水面折一下</b>，跑進眼睛——硬幣<b>出現</b>了！' },
    { at: 'school', place: '光線國中游泳池', call: '游泳池看起來好淺，同學想跳水！', q: '真正的水，有多深？', opts: [{ ic: '🌊', t: '比看起來深' }, { ic: '💧', t: '跟看起來一樣淺' }], a: 0,
      img: 'light-refract/mv/pool.jpg', ex: '光在水面折一下，池底看起來<b>變淺</b>，其實水<b>比看起來深</b>！', safe: '⚠ 游泳池不可以跳水' },

  let r = Math.random(); let rar = r < .1 ? 3 : r < .4 ? 2 : 1; if (last && G.pity[t] === 0) rar = 3; if (rar === 3) G.pity[t]++;
  const pool = BUDDIES.filter(b => b.r === rar); const have = new Set(G.cards[t].map(b => b.n)); const fresh = pool.filter(b => !have.has(b.n));
  return (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length || pool.length))];
}
function gacha() {
  $('ex').classList.add('hide'); G.phase = 'gacha';
  const g = $('gacha'); g.classList.remove('hide'); $('box').classList.remove('hide', 'shake'); $('card3').classList.add('hide'); $('card3').classList.remove('flip'); $('rays').classList.remove('on'); $('rare').textContent = ''; $('gNext').classList.add('hide');
  $('gH').textContent = `${TEAM[G.team].e} ${TEAM[G.team].n}：點一下禮物盒！`;
  let opened = false;
  $('box').onclick = () => { if (opened) return; opened = true; const b = $('box'); b.classList.add('shake'); sfx.drum();
    setTimeout(() => { b.classList.add('hide'); const bd = rollBuddy(); G.cards[G.team].push(bd); hud();
      const f = $('cardF'); f.className = 'face' + (bd.r === 3 ? ' r3' : ''); f.style.background = `linear-gradient(160deg,${bd.c[0]},${bd.c[1]})`;
      f.innerHTML = `<div class="st">${'★'.repeat(bd.r)}</div><div class="em">${bd.e}</div><div class="nm">${bd.n}</div><div class="sk">${bd.s}</div>`;
      $('card3').classList.remove('hide'); void $('card3').offsetWidth; $('card3').classList.add('flip'); $('rays').classList.add('on'); sfx.sparkle(); flash();
      confetti(bd.r === 3 ? 260 : 120); if (bd.r === 3) setTimeout(sfx.fan, 400);
      $('rare').textContent = bd.r === 3 ? '🌟 超稀有閃卡！' : bd.r === 2 ? '✨ 稀有卡！' : '收集到新夥伴！';
      $('gH').textContent = `${TEAM[G.team].e} ${TEAM[G.team].n}得到：`;
      const last = G.i + 1 >= G.list.length; $('gNext').textContent = last ? '🏆 結案頒獎' : '🚒 回分隊，下一個報案 →'; setTimeout(() => $('gNext').classList.remove('hide'), 900);
    }, 900); };
  $('gNext').onclick = () => { g.classList.add('hide'); clearCards(); resident.g.visible = false; thanks.visible = false; G.i++; G.team = 1 - G.team; hud(); T.x = HQ.x; T.z = 2.2; T.yaw = 0; setCam(OVER, 1.6); setTimeout(nextCase, 1200); };
}
function finish() {
  G.phase = 'end'; bubble.visible = beacon.visible = false; $('ban').classList.add('hide'); $('bot').classList.add('hide'); setCam(OVER, 1.6);
  const [a, b] = G.score; const win = a === b ? -1 : a > b ? 0 : 1;
  const col = t => `<div style="background:var(--${t ? 'blue' : 'red'})">${win === t ? '<span class="crown">👑</span>' : ''}${TEAM[t].e} ${TEAM[t].n}<b>${G.score[t]}</b><div class="mini">${G.cards[t].map(c => `<span>${c.e} ${c.n} ${'★'.repeat(c.r)}</span>`).join('')}</div></div>`;
  $('endCard').innerHTML = `<h2>🏆 全部結案！</h2><div class="sub" style="font-size:22px;font-weight:800;margin-top:6px">竹東今天很安全，謝謝光線特勤隊！</div><div class="sc">${col(0)}${col(1)}</div>
    <div style="font-size:20px;font-weight:800;color:#5b6673;margin-bottom:14px">${win < 0 ? '兩隊一樣厲害！' : TEAM[win].e + ' ' + TEAM[win].n + ' 聲望最高！'}　每一位隊員都拿到 🎖️ 特勤勳章</div>
    <button class="big go" id="again" style="animation:none">↺ 再出勤一次</button>`;
  $('endC').classList.remove('hide'); sfx.fan();
  for (let k = 0; k < 6; k++) setTimeout(() => { confetti(120, innerWidth * (.15 + Math.random() * .7), innerHeight * (.3 + Math.random() * .3)); sfx.boom(); }, k * 550);
  $('again').onclick = () => { $('endC').classList.add('hide'); $('cover').classList.remove('hide'); };
}
document.querySelectorAll('.pack').forEach(b => b.onclick = () => start(b.dataset.p));
$('back').onclick = () => history.length > 1 ? history.back() : (location.href = $('home').href);

// ---------- 迴圈 ----------
function resize() { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(); let tAll = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05) * (window.__dtScale || 1); tAll += dt; const now = performance.now();
  if (window.__auto && G.phase === 'drive') { const nx = items.find(it => !it.done && it.type === 'coin' && T.dir * (it.x - T.x) > 0 && T.dir * (it.x - T.x) < 9); if (nx) T.lane = LANES.indexOf(nx.z) >= 0 ? LANES.indexOf(nx.z) : T.lane; }
  updDrive(dt, tAll); updCam(dt); updateWorld(tAll, dt); updBits(dt); updCards(dt, now);
  if (bubble.visible) { bubble.position.y += Math.sin(tAll * 4) * .01; bubble.material.rotation = Math.sin(tAll * 3) * .05; }
  if (beacon.visible) beacon.material.opacity = .12 + Math.sin(tAll * 5) * .06;
  if (resident.g.visible) { if (resident.cheer > 0) { resident.cheer -= dt; resident.g.position.y = .15 + Math.abs(Math.sin(tAll * 9)) * .45; resident.armL.rotation.x = resident.armR.rotation.x = -2.6; }
    else { resident.g.position.y = .15; resident.armR.rotation.x = -2.4 + Math.sin(tAll * 8) * .5; resident.armL.rotation.x = 0; } }
  truck.kk.g.position.y = Math.abs(Math.sin(tAll * 3)) * .1;
  for (let t = 0; t < 2; t++) { if (shownScore[t] !== G.score[t]) { shownScore[t] += Math.sign(G.score[t] - shownScore[t]) * Math.max(1, Math.round(Math.abs(G.score[t] - shownScore[t]) * .15)); (t ? $('sB') : $('sR')).textContent = shownScore[t]; } }
  R.render(S, cam);
  drawConfetti(dt);
}
loop();
window.__disp = { start, G, T, cards: () => cards, go: () => $('go').click(), steer,
  at(pack, i) { G.pack = pack; G.list = PACKS[pack]; G.i = i; $('cover').classList.add('hide'); const s = SITES[G.list[i].at]; G.site = s; T.dir = 1; T.x = s.x - 9; T.z = s.side * 3.1; T.yaw = 0; arrive(); },
  pick(j) { const cd = cards.find(c => c.j === j); cd && pickCard(cd); }, gacha: () => $('toG')?.click(), box: () => $('box').click(), next: () => $('gNext').click() };
</script>
