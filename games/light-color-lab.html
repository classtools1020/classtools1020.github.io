<title>光與顏色互動實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --bg1:#05101f; --bg2:#0a2036; --bg3:#0e3350;
    --panel:#0f2841; --panel2:#123152; --line:rgba(120,170,210,.28);
    --amber:#ffc93c; --teal:#42e0c8; --ink:#eaf6ff; --dim:#9db8cf;
    --disp:'Fredoka','Noto Sans TC',system-ui,sans-serif; --body:'Noto Sans TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%,rgba(255,201,60,.10),transparent 55%),
      linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
  header{text-align:center;padding:8px 0 6px}
  .emblem{font-size:60px;filter:drop-shadow(0 8px 18px rgba(255,201,60,.35))}
  h1{font-family:var(--disp);font-size:34px;margin:2px 0 2px}
  .sub{color:var(--teal);font-weight:900;font-size:19px}

  .tabs{display:flex;gap:10px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
  .tab{font-family:var(--disp);font-weight:700;font-size:20px;border:2px solid var(--line);
    background:var(--panel);color:var(--ink);border-radius:14px;padding:11px 20px;cursor:pointer}
  .tab.on{background:linear-gradient(160deg,#123152,#0c2742);border-color:var(--amber);color:var(--amber)}

  .stage{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;
    box-shadow:0 10px 26px rgba(0,0,0,.4)}
  canvas{width:100%;height:auto;display:block;border-radius:14px;background:#050a14;touch-action:none}

  /* additive mixing */
  .mixbox{position:relative;width:100%;max-width:520px;aspect-ratio:1/.82;margin:0 auto;
    background:#000;border-radius:16px;overflow:hidden}
  .lamp{position:absolute;width:64%;aspect-ratio:1/1;border-radius:50%;mix-blend-mode:screen;
    filter:blur(2px);transition:opacity .25s;opacity:1}
  .lamp.r{background:radial-gradient(circle,#ff2b2b 0%,#ff2b2b 55%,transparent 72%);left:18%;top:2%}
  .lamp.g{background:radial-gradient(circle,#22ff44 0%,#22ff44 55%,transparent 72%);left:0%;top:34%}
  .lamp.b{background:radial-gradient(circle,#2b6bff 0%,#2b6bff 55%,transparent 72%);left:36%;top:34%}
  .lamp.off{opacity:0}
  .mixnote{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff;font-weight:900;font-size:18px;
    text-shadow:0 1px 4px #000;pointer-events:none}
  .lampbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .lb{font-family:var(--disp);font-weight:700;font-size:20px;border:3px solid;border-radius:14px;
    padding:12px 20px;cursor:pointer;background:#0c1a2e;color:#fff}
  .lb.r{border-color:#ff5a5a} .lb.g{border-color:#3ee66a} .lb.b{border-color:#5a8bff}
  .lb.on.r{background:#ff3b3b;color:#2a0000} .lb.on.g{background:#28d24e;color:#052a10} .lb.on.b{background:#3a76ff;color:#001233}

  .toggle{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .tbtn{font-family:var(--disp);font-weight:700;font-size:20px;border:2px solid var(--line);
    background:var(--panel2);color:var(--ink);border-radius:14px;padding:12px 18px;cursor:pointer}
  .tbtn.on{background:linear-gradient(160deg,#14343f,#0c2742);border-color:var(--teal);color:var(--teal)}

  .terms{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--line);
    color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:900;font-size:19px;cursor:pointer}
  .chip:hover{border-color:var(--amber)}
  .chip .en{color:var(--dim);font-family:var(--disp);font-size:15px}

  .hintbar{text-align:center;margin-top:14px;font-size:19px;font-weight:900;color:var(--teal);min-height:26px}
  .say{font-size:14px;color:var(--dim);font-weight:800}
  footer{text-align:center;margin-top:26px;color:var(--dim);font-size:14px}
  .home{position:fixed;left:12px;top:12px;z-index:120;background:#0f2841;border:2px solid var(--amber);
    color:var(--amber);font-weight:900;font-size:16px;text-decoration:none;padding:8px 14px;border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.45)}
  .home:hover{background:#152f4d}
  .train{position:absolute;left:-120px;bottom:8px;font-size:46px;z-index:5;pointer-events:none;opacity:0}
  .train.go{animation:choo 2.2s cubic-bezier(.4,0,.3,1) forwards}
  @keyframes choo{0%{left:-120px;opacity:1}100%{left:110%;opacity:1}}
  canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:110}
</style>

<a class="home" href="../light-color/">🏠 回到首頁</a>
<canvas class="confetti" id="cf"></canvas>
<div class="wrap">
  <header>
    <div class="emblem">🌈</div>
    <h1>光與顏色・互動實驗室</h1>
    <div class="sub">混一混、拆一拆，顏色看得見！</div>
  </header>

  <div class="tabs">
    <button class="tab on" data-t="0">🔴 加色混合</button>
    <button class="tab" data-t="1">🌈 三稜鏡色散</button>
    <button class="tab" data-t="2">🍎 物體的顏色</button>
  </div>

  <!-- A: additive mixing -->
  <section id="s0">
    <div class="stage">
      <div class="mixbox">
        <div class="lamp r" id="lampR"></div>
        <div class="lamp g" id="lampG"></div>
        <div class="lamp b" id="lampB"></div>
        <div class="mixnote" id="mixNote">三種光全開 → 白光！</div>
        <div class="train" id="train">🚂💨</div>
      </div>
      <div class="lampbtns">
        <button class="lb r on" id="btnR">🔴 紅光</button>
        <button class="lb g on" id="btnG">🟢 綠光</button>
        <button class="lb b on" id="btnB">🔵 藍光</button>
      </div>
    </div>
    <div class="terms" id="terms0">
      <button class="chip" data-zh="光的三原色" data-en="Primary colors of light">🎨 光的三原色 <span class="en">RGB</span></button>
      <button class="chip" data-zh="加色混合" data-en="Additive color mixing">➕ 加色混合 <span class="en">Additive mixing</span></button>
      <button class="chip" data-zh="白光" data-en="White light">⚪ 白光 <span class="en">White light</span></button>
    </div>
    <div class="hintbar" id="hint0">🔴+🟢=黃　🟢+🔵=青　🔴+🔵=洋紅　三色全開=白光！關掉一個看看變什麼</div>
  </section>

  <!-- B: dispersion -->
  <section id="s1" hidden>
    <div class="stage">
      <canvas id="cvB" width="640" height="380"></canvas>
      <div class="toggle">
        <button class="tbtn on" id="fire">🔦 射出白光</button>
      </div>
    </div>
    <div class="terms" id="terms1">
      <button class="chip" data-zh="白光" data-en="White light">⚪ 白光 <span class="en">White light</span></button>
      <button class="chip" data-zh="三稜鏡" data-en="Prism">🔺 三稜鏡 <span class="en">Prism</span></button>
      <button class="chip" data-zh="色散" data-en="Dispersion">🌈 色散 <span class="en">Dispersion</span></button>
    </div>
    <div class="hintbar" id="hint1">白光其實是七彩組成！通過三稜鏡被拆開 → 這叫色散 🌈</div>
  </section>

  <!-- C: selective reflection -->
  <section id="s2" hidden>
    <div class="stage">
      <canvas id="cvC" width="640" height="380"></canvas>
      <div class="toggle">
        <button class="tbtn on" data-o="apple">🍎 紅蘋果</button>
        <button class="tbtn" data-o="leaf">🌿 綠葉</button>
        <button class="tbtn" data-o="blue">🫐 藍莓</button>
        <button class="tbtn" data-o="lemon">🍋 黃檸檬</button>
      </div>
    </div>
    <div class="terms" id="terms2">
      <button class="chip" data-zh="選擇性反射" data-en="Selective reflection">🎯 選擇性反射 <span class="en">Selective reflection</span></button>
      <button class="chip" data-zh="吸收" data-en="Absorption">🕳️ 吸收 <span class="en">Absorption</span></button>
    </div>
    <div class="hintbar" id="hint2">白光有全部顏色。蘋果只反射紅光、吸收其他 → 所以看起來是紅的！</div>
  </section>

  <div style="text-align:center;margin-top:16px">
    <span class="say">💡 點名詞會用中文＋英文念給你聽</span>
  </div>
  <footer>🌈 光與顏色・互動實驗室　｜　竹東國中自然科</footer>
</div>

<script>
const $=id=>document.getElementById(id);
/* audio */
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC;}
function tone(f,t,d,ty="sine",v=.22){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);}
function blip(f){const a=ac();if(!a)return;tone(f||660,a.currentTime,.09,"square",.16);}
function sparkle(){const a=ac();if(!a)return;const t=a.currentTime;[523,784,1047,1319].forEach((f,i)=>tone(f,t+i*.07,.14,"triangle",.2));}
function fanfare(){const a=ac();if(!a)return;const t=a.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.1,.26,"triangle",.28));}
function choo(){const a=ac();if(!a)return;const t=a.currentTime;tone(180,t,.18,"sawtooth",.2);tone(150,t+.2,.22,"sawtooth",.2);}
/* confetti */
const cv=$("cf"),cx=cv.getContext("2d");let parts=[];
function csize(){cv.width=innerWidth;cv.height=innerHeight;}csize();addEventListener("resize",csize);
const COL=["#ff4d4d","#3aa0ff","#ffc93c","#28c76f","#ff8a5b","#c77dff"];
function confetti(n=140){for(let i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:-20,
  vx:(Math.random()-.5)*8,vy:Math.random()*3+2,g:.25,s:6+Math.random()*8,
  c:COL[Math.floor(Math.random()*COL.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});crun();}
let craf=null;function crun(){if(!craf)craf=requestAnimationFrame(cloop);}
function cloop(){cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30&&p.life<260);
  if(parts.length)craf=requestAnimationFrame(cloop);else{craf=null;cx.clearRect(0,0,cv.width,cv.height);}}
function trainGo(){const t=$("train");t.classList.remove("go");void t.offsetWidth;t.classList.add("go");choo();}
function speak(zh,en){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(zh);u.lang="zh-TW";u.rate=.85;
  u.onend=()=>{if(en){const e=new SpeechSynthesisUtterance(en);e.lang="en-US";e.rate=.85;speechSynthesis.speak(e);}};
  speechSynthesis.speak(u);}catch(e){}}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>speak(c.dataset.zh,c.dataset.en));

/* tabs */
let tab=0;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=+b.dataset.t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  $("s0").hidden=tab!==0;$("s1").hidden=tab!==1;$("s2").hidden=tab!==2;
});

/* ---------- A: additive mixing ---------- */
const on={r:true,g:true,b:true};
function upMix(){
  $("lampR").classList.toggle("off",!on.r);
  $("lampG").classList.toggle("off",!on.g);
  $("lampB").classList.toggle("off",!on.b);
  ["R","G","B"].forEach(k=>$("btn"+k).classList.toggle("on",on[k.toLowerCase()]));
  const s=(on.r?"R":"")+(on.g?"G":"")+(on.b?"B":"");
  const map={RGB:"三種光全開 → 白光 ⚪",RG:"紅+綠 → 黃色 🟡",GB:"綠+藍 → 青色 🩵",
    RB:"紅+藍 → 洋紅 🩷",R:"只有紅光 🔴",G:"只有綠光 🟢",B:"只有藍光 🔵","":"全部關掉 → 黑（沒有光）⚫"};
  $("mixNote").textContent=map[s]||"";
  if(s==="RGB"&&!wasWhite){wasWhite=true;confetti(150);fanfare();trainGo();}
  if(s!=="RGB")wasWhite=false;
}
let wasWhite=true;
$("btnR").onclick=()=>{on.r=!on.r;blip(700);upMix();speak("紅光","Red light");};
$("btnG").onclick=()=>{on.g=!on.g;blip(620);upMix();speak("綠光","Green light");};
$("btnB").onclick=()=>{on.b=!on.b;blip(540);upMix();speak("藍光","Blue light");};
upMix();

/* ---------- B: dispersion ---------- */
const cB=$("cvB"),xB=cB.getContext("2d");const WB=640,HB=380;
let fireT=0,firing=false;
const SPEC=["#ff3b3b","#ff9f1c","#ffe23b","#37d05a","#33b6ff","#3a5bff","#a24bff"];
$("fire").onclick=()=>{firing=true;fireT=0;sparkle();setTimeout(()=>confetti(80),700);speak("色散","Dispersion");};
function drawB(){
  xB.clearRect(0,0,WB,HB);
  const P={x:300,y:200}; // prism center
  // prism triangle
  xB.beginPath();xB.moveTo(P.x,P.y-70);xB.lineTo(P.x-62,P.y+60);xB.lineTo(P.x+62,P.y+60);xB.closePath();
  xB.fillStyle="rgba(180,220,255,.15)";xB.fill();
  xB.strokeStyle="rgba(180,220,255,.8)";xB.lineWidth=2.5;xB.stroke();
  // incoming white beam
  const inx=Math.min(1,fireT/0.5);
  const sx=40,sy=150, hx=P.x-40, hy=P.y-10;
  xB.strokeStyle="#ffffff";xB.lineWidth=6;xB.lineCap="round";xB.shadowColor="#fff";xB.shadowBlur=10;
  xB.beginPath();xB.moveTo(sx,sy);xB.lineTo(sx+(hx-sx)*inx,sy+(hy-sy)*inx);xB.stroke();xB.shadowBlur=0;
  xB.font="bold 16px 'Noto Sans TC'";xB.fillStyle="#fff";xB.fillText("白光",70,135);
  // rainbow out (after beam reaches prism)
  if(fireT>0.5){
    const k=Math.min(1,(fireT-0.5)/0.6);
    const ox=P.x+40, oy=P.y+10;
    SPEC.forEach((c,i)=>{
      const spread=(i-3)*7; // degrees
      const ang=(12+spread)*Math.PI/180;
      const len=260*k;
      xB.strokeStyle=c;xB.lineWidth=5;xB.shadowColor=c;xB.shadowBlur=8;
      xB.beginPath();xB.moveTo(ox,oy);xB.lineTo(ox+len*Math.cos(ang),oy+len*Math.sin(ang));xB.stroke();
    });
    xB.shadowBlur=0;
    if(k>0.6){xB.fillStyle="#fff";xB.font="bold 16px 'Noto Sans TC'";xB.fillText("色散：七彩！",470,120);}
  }
  xB.fillStyle="#cfe4f5";xB.font="bold 15px 'Noto Sans TC'";xB.fillText("三稜鏡",P.x-30,P.y+78);
  if(firing){fireT+=0.012;if(fireT>1.3)firing=false;}
}

/* ---------- C: selective reflection ---------- */
const cC=$("cvC"),xC=cC.getContext("2d");const WC=640,HC=380;
let obj="apple",tC=0;
const OBJ={
  apple:{emo:"🍎",reflect:["#ff3b3b"],absorb:["#37d05a","#33b6ff"],name:"紅蘋果",say:"紅光"},
  leaf:{emo:"🌿",reflect:["#37d05a"],absorb:["#ff3b3b","#33b6ff"],name:"綠葉",say:"綠光"},
  blue:{emo:"🫐",reflect:["#33b6ff"],absorb:["#ff3b3b","#37d05a"],name:"藍莓",say:"藍光"},
  lemon:{emo:"🍋",reflect:["#ff3b3b","#ffe23b","#37d05a"],absorb:["#33b6ff"],name:"黃檸檬",say:"黃光"},
};
document.querySelectorAll('#s2 .tbtn').forEach(b=>b.onclick=()=>{
  obj=b.dataset.o;document.querySelectorAll('#s2 .tbtn').forEach(x=>x.classList.toggle("on",x===b));
  const o=OBJ[obj];$("hint2").textContent="白光有全部顏色。"+o.name+"只反射"+o.say+"、吸收其他 → 所以看起來是這個顏色！";
  blip(680);confetti(60);speak(o.name+"只反射"+o.say,"");
});
function drawC(){
  xC.clearRect(0,0,WC,HC);
  const O={x:330,y:200}; // object center
  // white source
  xC.font="34px serif";xC.textAlign="center";xC.textBaseline="middle";
  xC.fillText("🔆",70,90);
  xC.fillText("👁️",590,90);
  xC.textAlign="left";xC.textBaseline="alphabetic";
  xC.fillStyle="#fff";xC.font="bold 15px 'Noto Sans TC'";xC.fillText("白光（所有顏色）",95,80);
  // incoming three rays (white = R,G,B)
  const cols=["#ff3b3b","#37d05a","#33b6ff"];
  cols.forEach((c,i)=>{
    const sy=88+i*3;
    xC.strokeStyle=c;xC.lineWidth=4;xC.lineCap="round";
    xC.beginPath();xC.moveTo(95,sy);xC.lineTo(O.x-40,O.y-30+i*8);xC.stroke();
  });
  // object emoji
  xC.font="90px serif";xC.textAlign="center";xC.textBaseline="middle";
  xC.fillText(OBJ[obj].emo,O.x,O.y);xC.textAlign="left";xC.textBaseline="alphabetic";
  const o=OBJ[obj];
  // reflected rays -> eye
  o.reflect.forEach((c,i)=>{
    xC.strokeStyle=c;xC.lineWidth=5;xC.shadowColor=c;xC.shadowBlur=8;
    xC.beginPath();xC.moveTo(O.x+40,O.y-20+i*10);xC.lineTo(560,95);xC.stroke();
  });
  xC.shadowBlur=0;
  // absorbed rays -> stop at object, fade
  o.absorb.forEach((c,i)=>{
    xC.strokeStyle=c;xC.globalAlpha=.35;xC.lineWidth=4;xC.setLineDash([6,6]);
    xC.beginPath();xC.moveTo(O.x-40,O.y+20+i*12);xC.lineTo(O.x,O.y+20+i*12);xC.stroke();
    xC.setLineDash([]);xC.globalAlpha=1;
    xC.fillStyle=c;xC.font="bold 13px 'Noto Sans TC'";xC.globalAlpha=.6;
    xC.fillText("吸收",O.x-70,O.y+24+i*12);xC.globalAlpha=1;
  });
  xC.fillStyle="#ffe23b";xC.font="bold 16px 'Noto Sans TC'";
  xC.fillText("只反射"+o.say+"→看起來"+o.name.slice(0,1)+"色",O.x-30,O.y+120);
}

/* loop */
function loop(){tC+=0.02;
  if(tab===1)drawB();else if(tab===2)drawC();
  requestAnimationFrame(loop);}
drawB();drawC();loop();
</script>
