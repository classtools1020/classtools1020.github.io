function popEl(el,k,base){base=base||'';el.style.opacity=clamp(k*1.6);el.style.transform=`${base} scale(${Math.max(.001,back(k))})`;}
function chT(sg,i){const c=sg.ch;return c[Math.min(i,c.length-1)][1];}
function findT(sg,str){const c=sg.ch;let acc='';for(let i=0;i<c.length;i++){if(c[i][0].startsWith(str[0])&&c.slice(i).map(x=>x[0]).join('').startsWith(str))return c[i][1];}return sg.s;}
const RX=v=>160+(v-35)/4*1280; /* 溫度尺 35～39 */
function rulerHTML(top){return `<div class="ruler" style="top:${top}px"><div class="gz" style="width:${(37.5-35)/4*100}%">✅ 正常</div><div class="rz" style="flex:1">🙋 告訴老師</div></div>
  <div class="ticks" style="top:${top+132}px">${[35,36,37,38,39].map(v=>`<b style="left:${RX(v)-160}px">${v}</b>`).join('')}<b style="left:${RX(37.5)-160}px;color:var(--y)">37.5</b></div>
  <div class="arrow" id="arw" style="top:${top-78}px;left:${RX(36.8)}px"></div><div class="reading" id="rd" style="top:${top-170}px;left:${RX(36.8)}px">36.8</div>`;}
function confetti(n){let h='';let s=7;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const x=s/233280*1600;s=(s*9301+49297)%233280;const d=s/233280;
  h+=`<div class="conf" data-x="${x.toFixed(0)}" data-d="${d.toFixed(3)}" style="background:${['#36e27a','#ffd94a','#3fd8ff','#ff4a5c','#fff'][i%5]}"></div>`;}return h;}
function drawConf(root,lt){root.querySelectorAll('.conf').forEach(c=>{const d=+c.dataset.d,x=+c.dataset.x;const y=-60+(lt*(260+d*240)+d*400)%1000;c.style.transform=`translate(${x+Math.sin(lt*3+d*9)*40}px,${y}px) rotate(${lt*200*(d-.5)}deg)`;});}

/* ---------- 動態背景：霓虹地板、等化器（真實音樂）、粒子、節拍鏡頭、轉場、吉祥物跳舞 ---------- */
$('eq').innerHTML='<i></i>'.repeat(EQ.n);$('dancer').innerHTML=MASCOT;
let pts='';for(let i=0;i<34;i++)pts+='<div class="pt"></div>';$('pts').innerHTML=pts;
function eqAt(t){const f=t*EQ.fps,i=Math.max(0,Math.min(Math.floor(f),EQ.d.length/EQ.n-2)),r=clamp(f-i);const o=[];
  for(let b=0;b<EQ.n;b++){const a=+EQ.d[i*EQ.n+b],c=+EQ.d[(i+1)*EQ.n+b];o.push((a+(c-a)*r)/9);}return o;}
function drawFX(sg,t){
  const B=(t-B0)/BEAT,bk=beatK(t),hot=/副歌|快問快答/.test(sg.sec||'');
  $('floor').style.backgroundPosition=`0 ${(B*60)%120}px`;
  const e=eqAt(t);$('eq').querySelectorAll('i').forEach((el,i)=>{const v=e[i];el.style.height=(6+v*160)+'px';});
  const avg=e.reduce((a,b)=>a+b,0)/e.length;$('sun').style.opacity=.14+.22*avg;$('sun').style.transform=`scale(${1+.08*bk})`;
  $('pts').querySelectorAll('.pt').forEach((p,i)=>{const sp=40+(i*37)%70,x=(i*173)%1600,y=900-((t*sp+i*97)%1000);p.style.transform=`translate(${x+Math.sin(t+i)*30}px,${y}px) scale(${.5+((i*7)%10)/10})`;p.style.opacity=.25+.5*avg;});
  // 節拍鏡頭：每拍輕推、副歌加一點晃動
  const sh=hot?Math.sin(B*7.3)*5*bk:0;$('scene').style.transform=`translate(${sh}px,${hot?Math.cos(B*5.1)*3*bk:0}px) scale(${1+(hot?.022:.01)*bk})`;
  // 轉場：彩色斜切掃過
  const w=seg(t,sg.s-.32,sg.s+.08);const wp=$('wipe');if(w>0&&w<1&&sg.kind!=='intro'){wp.style.opacity=1;wp.style.left=lerp(-1500,1900,eo(w))+'px';}else wp.style.opacity=0;
  // 吉祥物跳舞（副歌、快問快答）
  const dn=sg.vis==='BEEP'||sg.vis==='READ';const d=$('dancer');d.style.opacity=dn?1:0;
  if(dn)d.style.transform=`translateY(${-46*bk}px) rotate(${Math.sin(B*Math.PI)*12}deg) scale(${1+.1*bk},${1-.06*bk})`;
}

/* ---------- 主繪製 ---------- */
let curSeg=-1;
function render(t){
  const k=segAt(t),sg=SEGS[k];
  if(k!==curSeg){curSeg=k;const sc=SC[sg.vis]||SC.INTER;$('scene').innerHTML=sc.html(sg);$('sec').textContent=sg.sec;$('flash').style.opacity=0;karaKey=null;
    if(sg.kind==='line'){const sk=secKey(sg);document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('now',b.dataset.k===sk));}}
  (SC[sg.vis]||SC.INTER).draw(sg,t,$('scene'));
  drawKara(sg,t);drawFX(sg,t);
}
window.__mv={render,SEGS,END};

/* ---------- 控制 ---------- */
const au=$('audio');
const SECS=[];let lastSec=null;
LINES.forEach(ln=>{if(ln.sec!==lastSec){SECS.push({sec:ln.sec,s:ln.s});lastSec=ln.sec;}});
function secKey(sg){let k='';SECS.forEach((x,i)=>{if(sg.s>=x.s-.01)k=String(i);});return k;}
$('chips').innerHTML=SECS.map((x,i)=>`<button data-k="${i}" data-s="${x.s}">${x.sec}</button>`).join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;au.currentTime=Math.max(0,+b.dataset.s-1.2);start();});
let vmode=false;
function videoMode(on){vmode=on;const v=$('vbox');v.style.display=on?'block':'none';$('vid').textContent=on?'🎵 回網頁版':'🎬 影片版';
  if(on){au.pause();$('ov').hidden=true;v.play().catch(()=>{});}else v.pause();}
function start(){if(vmode){$('vbox').play().catch(()=>{});return;}$('ov').hidden=true;
  const pr=au.play();if(pr&&pr.catch)pr.catch(()=>{videoMode(true);});}
au.addEventListener('error',()=>{if(!$('ov').hidden)return;videoMode(true);});
$('go').onclick=start;
$('play').onclick=()=>{if(vmode){const v=$('vbox');v.paused?v.play():v.pause();return;}if(au.paused)start();else au.pause();};
$('vid').onclick=()=>videoMode(!vmode);
$('restart').onclick=()=>{if(vmode){$('vbox').currentTime=0;$('vbox').play();return;}au.currentTime=0;start();};
$('slow').onclick=()=>{const s=au.playbackRate===1;au.playbackRate=s?.85:1;au.preservesPitch=true;$('slow').classList.toggle('on',s);$('slow').textContent=s?'🐇 正常速度':'🐢 慢一點';};
$('fs').onclick=()=>{const w=$('wrap');if(document.fullscreenElement)document.exitFullscreen();else(w.requestFullscreen||w.webkitRequestFullscreen).call(w);};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,60));
au.addEventListener('play',()=>$('play').textContent='⏸ 暫停');
au.addEventListener('pause',()=>$('play').textContent='▶ 播放');
au.addEventListener('ended',()=>{$('play').textContent='▶ 再播一次';try{FX.confetti(80);}catch(e){}});
$('wrap').addEventListener('click',e=>{if(e.target.closest('.overlay')||vmode)return;if(au.paused)start();else au.pause();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
/* 完整歌詞 */
let h='',ls=null;LINES.forEach(ln=>{if(ln.sec!==ls){h+=`<b>${ln.sec}</b>`;ls=ln.sec;}h+=ln.ly+'<br>';});$('lyr').innerHTML=h;

if(!REC){render(0);(function loop(){render(au.currentTime);requestAnimationFrame(loop);})();}
else{$('ov').hidden=true;render(0);}
})();
</script>
</body>
</html>
