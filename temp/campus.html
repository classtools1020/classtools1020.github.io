<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><script src="/gate.js"></script>
<title>溫度探險校園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 竹東國中俯視手繪地圖（鏡頭跟隨）+ 頂部課表與溫度計進度 + 底部任務列；暖夜藍木框面板 */
:root{
  --ink:#1b2a33; --panel:#26383f; --line:#4b6168; --paper:#fbf7ee; --mute:#a9bcb8;
  --cold:#3d9be0; --comfy:#58b85c; --hot:#ef6536; --gold:#f5c94b; --wood:#8b5e3c; --red:#c8372d;
  --display:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{background:linear-gradient(#2c4148,var(--panel));padding:8px 16px;display:flex;flex-direction:column;gap:7px;border-bottom:4px solid var(--wood)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{font-size:13px;font-weight:900;color:var(--paper);text-decoration:none;border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.day{font-size:13px;color:var(--mute);letter-spacing:.05em}
.clock{font-family:var(--display);font-size:32px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.wx{font-family:var(--display);font-size:17px;padding:5px 10px;border-radius:12px;color:#fff;white-space:nowrap}
.pill{font-family:var(--display);font-size:15px;padding:5px 9px;border-radius:12px;background:#132026;border:1.5px solid var(--line);color:var(--paper);white-space:nowrap}
.hud-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.toggles{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tg{background:transparent;border:1.5px solid var(--line);color:var(--paper);border-radius:10px;padding:5px 8px;font-size:13px;font-weight:700}
.tg[aria-pressed="false"]{color:var(--mute);border-style:dashed}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute);font-weight:700}
.chip.on{background:var(--gold);color:#2a2105;border-color:var(--gold)}
.chip.done{color:var(--paper);border-color:var(--comfy)}
.merc{display:flex;align-items:center;gap:8px}
.merc .lbl{font-size:12px;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.tube{position:relative;flex:1;height:14px;background:#0f1a1e;border-radius:99px;border:2px solid #5d7479}
.tube .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--cold),var(--comfy),var(--hot));transition:width .8s ease}
.bulb{width:22px;height:22px;border-radius:50%;background:var(--hot);border:2px solid #5d7479;flex:none;margin-right:-12px;z-index:1}
.stars{font-family:var(--display);font-size:18px;color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
#mapwrap{flex:1;min-height:0;position:relative;background:#6e9a57;overflow:hidden}
canvas#map{display:block;width:100%;height:100%;touch-action:none}
footer{background:linear-gradient(var(--panel),#22333a);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--wood);display:flex;align-items:center;gap:10px}
.goal-ic{font-size:32px;width:52px;height:52px;display:grid;place-items:center;background:#132026;border-radius:14px;border:2px solid var(--gold);flex:none}
.goal-tx{flex:1;min-width:0}
.goal-tx small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-tx b{font-family:var(--display);font-size:21px;font-weight:400;color:var(--gold)}
.btn{border:none;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:900;background:var(--gold);color:#2a2105;box-shadow:0 4px 0 #a9862a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a9862a}
.btn.ghost{background:#132026;color:var(--paper);box-shadow:0 4px 0 #08111a;border:2px solid var(--line)}
.ic-btn{width:48px;height:48px;border-radius:14px;font-size:22px;padding:0;flex:none}
#sheet{position:fixed;inset:0;background:rgba(8,14,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.card{background:var(--paper);color:var(--ink);width:100%;max-width:780px;border-radius:22px 22px 0 0;border-top:6px solid var(--wood);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:94%;overflow-y:auto;animation:up .3s ease;display:flex;flex-direction:column;gap:12px;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.who{display:flex;align-items:center;gap:10px}
.who .av{font-size:30px;width:48px;height:48px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.who b{display:block;font-size:15px}
.who span{font-size:13px;color:#6b7d78;font-weight:700}
.prompt{display:flex;gap:10px;align-items:flex-start}
.prompt p{flex:1;margin:0;font-size:22px;font-weight:900;line-height:1.45;text-wrap:balance}
.speak{background:var(--ink);color:#fff;border:none;border-radius:12px;width:46px;height:46px;font-size:20px;flex:none}
.visual{display:flex;justify-content:center;align-items:center;gap:18px;padding:2px 0;flex-wrap:wrap}
.ph{width:min(300px,44vw);aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:4px solid #fff;box-shadow:0 6px 16px rgba(40,30,20,.25);transform:rotate(-1.5deg)}
.ph.sq{width:min(220px,40vw)}
.big-emo{font-size:64px;line-height:1}
.thsvg{height:min(250px,32vh);width:auto}
.thsvg.sm{height:min(210px,28vh)}
.thtag{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:26px}
.lcd{background:#eef3f0;border:5px solid #9aa9b2;border-radius:28px;padding:16px 24px;box-shadow:0 10px 22px rgba(0,0,0,.18)}
.lcd .scr{background:#b9f0a6;border:4px solid #7d8b84;border-radius:12px;padding:4px 18px;font-family:"Consolas","Courier New",monospace;font-weight:900;font-size:72px;color:#111;display:flex;align-items:baseline}
.lcd .dec{opacity:.35}.lcd .u{font-size:26px;margin-left:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{background:#fff;border:3px solid #d6d0c2;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);min-width:0}
.opt .e{font-size:44px;line-height:1.1;font-family:var(--display)}
.opt .oi{width:100%;max-width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.opt .l{font-size:19px;font-weight:900}
.opt .s{font-size:13px;color:#6b7d78;font-weight:700}
.opt.ok{border-color:var(--comfy);background:#e4f6e4}
.opt.no{border-color:var(--hot);background:#fde8e0;opacity:.6}
.opt.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:flex;align-items:center;gap:10px;min-height:56px;margin:0}
.fb svg{width:44px;height:58px;flex:none}
.fb span{font-size:18px;font-weight:900;line-height:1.4}
.fb.good span{color:#2f8a34}.fb.bad span{color:#c4471d}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}
/* 巡邏記錄卡 */
.rec{background:#fffdf6;border:3px solid #d6c7a6;border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background-image:repeating-linear-gradient(#fffdf6 0 31px,#efe6d2 31px 32px)}
.rec .it{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.rec img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.rec b{font-size:16px}.rec .v{font-family:var(--display);font-size:34px;line-height:1;color:var(--red)}
.rec .v.q{color:#b9ad95}
.rec .bar{width:70%;height:10px;border-radius:99px;background:#eadfc8;overflow:hidden}.rec .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cold),var(--hot))}
.cover{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% -10%,#5c8a6a,#2a4246 55%,var(--ink));display:flex;justify-content:center;padding:24px 16px;overflow-y:auto}
.cover-in{max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;margin:auto 0}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.hero svg.m{width:96px;height:125px}
.cover h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;color:var(--gold);text-shadow:0 3px 0 #3b2a14;text-wrap:balance}
.cover p{margin:0;font-size:17px;line-height:1.6}
.grp{display:flex;flex-direction:column;gap:8px;text-align:left}
.grp>span{font-size:14px;color:var(--mute);font-weight:700}
.seg{display:grid;gap:8px}
.seg.c2{grid-template-columns:1fr 1fr}.seg.c4{grid-template-columns:repeat(4,1fr)}
.pick{background:rgba(19,32,38,.7);border:2px solid var(--line);color:var(--paper);border-radius:14px;padding:10px 4px;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick .e{font-size:28px}
.pick small{font-size:12px;color:var(--mute);font-weight:700}
.pick[aria-pressed="true"]{border-color:var(--gold);background:#35504f;box-shadow:0 0 0 2px var(--gold) inset}
.spr{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.spr canvas{width:64px;height:64px;background:rgba(255,255,255,.08);border-radius:16px}
.cert{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px 16px;border:6px double var(--gold);display:flex;flex-direction:column;gap:10px;align-items:center}
.cert h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.cert .st{font-size:20px;letter-spacing:1px;line-height:1.4;word-break:break-all}
.cert .rec{width:100%}
details.tlog{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;text-align:left;font-size:14px}
details.tlog summary{font-weight:900;cursor:pointer}
.tlog table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
.tlog td,.tlog th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:900;font-size:17px;padding:10px 16px;border-radius:14px;border:3px solid var(--wood);box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx i{position:absolute;width:10px;height:14px;border-radius:2px}
@media (max-width:520px){.clock{font-size:26px}.prompt p{font-size:19px}.lcd .scr{font-size:54px}}
@media (prefers-reduced-motion:reduce){.card,.opt.shake{animation:none}.tube .fill{transition:none}}
</style>

<div id="app">
  <header>
    <div class="row">
      <div style="display:flex;gap:10px;align-items:center;min-width:0">
        <div><div class="day">竹東國中 · <span id="period">到校</span></div><div class="clock" id="clock">07:40</div></div>
      </div>
      <div class="hud-r">
        <a class="nav site" href="./">⬅ 返回</a><a class="nav site" href="/light/">🗂️ 主選單</a>
        <div class="wx" id="wx">🌡️</div>
        <button class="pill" id="recBtn">📋 記錄卡</button>
        <div class="pill" id="pets">🐾 0/6</div>
      </div>
    </div>
    <div class="row">
      <div class="chips" id="chips" style="flex:1;min-width:0"></div>
      <div class="toggles">
        <button class="tg" id="tgHint" aria-pressed="true">提示 開</button>
        <button class="tg" id="tgVoice" aria-pressed="true">配音 開</button>
      </div>
    </div>
    <div class="merc"><span class="lbl" id="cnt">0 / 11 站</span><span class="bulb"></span><div class="tube"><div class="fill" id="fill" style="width:4%"></div></div><span class="stars" id="stars">⭐ 0</span></div>
  </header>
  <div id="mapwrap"><canvas id="map" aria-label="竹東國中校園地圖：點地點、人物或精靈就會走過去"></canvas><div id="toast" hidden></div></div>
  <footer>
    <div class="goal-ic" id="goalIc">👮</div>
    <div class="goal-tx"><small id="goalSub">目標：走到</small><b id="goalTx">警衛伯伯</b></div>
    <button class="btn ghost ic-btn" id="goalSay" aria-label="唸目標">🔊</button>
    <button class="btn" id="autoWalk">👣 帶我走</button>
  </footer>
</div>
<div id="sheet" hidden><div class="card" id="card"></div></div>
<div id="fx"></div>

<div class="cover" id="cover"><div class="cover-in" id="coverIn">
  <div class="hero" id="hero"></div>
  <h1>溫度探險校園</h1>
  <p>溫溫隊長帶你走遍竹東國中：讀溫度計、量額溫，<br>把三個地方的溫度寫進巡邏記錄卡！</p>
  <div class="spr" id="sprRow"></div>
  <button class="btn" id="resumeBtn" hidden style="font-size:19px;padding:14px;background:#7ccf7f;box-shadow:0 4px 0 #3f8a48"></button>
  <div class="grp"><span>今天的天氣</span>
    <div class="seg c4" id="dayPick">
      <button class="pick" data-v="rand" aria-pressed="true"><span class="e">🎲</span>隨機</button>
      <button class="pick" data-v="cold" aria-pressed="false"><span class="e">🧊</span>冷天</button>
      <button class="pick" data-v="comfy" aria-pressed="false"><span class="e">😊</span>舒服</button>
      <button class="pick" data-v="hot" aria-pressed="false"><span class="e">☀️</span>熱天</button>
    </div></div>
  <div class="grp"><span>怎麼玩</span>
    <div class="seg c2" id="modePick">
      <button class="pick" data-v="story" aria-pressed="true"><span class="e">🕗</span>跟著課表走<small>一站一站，照時間</small></button>
      <button class="pick" data-v="free" aria-pressed="false"><span class="e">🗺️</span>自由探險<small>發光的站都能去</small></button>
    </div></div>
  <button class="btn" id="startBtn" style="font-size:22px;padding:16px">開始探險 ➜</button>
</div></div>

<script>
const SITE=true;
const IMG={"classroom": "img/sm/classroom.jpg", "shade": "img/sm/shade.jpg", "sun": "img/sm/sun.jpg", "forehead": "img/sm/forehead.jpg", "outdoor": "img/sm/outdoor.jpg", "bath": "img/sm/bath.jpg", "three-cups": "img/sm/three-cups.jpg", "soup": "img/sm/soup.jpg", "fridge": "img/sm/fridge.jpg"};
const $=s=>document.querySelector(s);
if(!SITE)document.querySelectorAll('.site').forEach(e=>e.hidden=true);
const W=30,H=49,T=40,SAVE='ct_tempcampus_v1';
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const hash=(x,y)=>(((x*73856093)^(y*19349663))>>>0)%100003;
const MASCOT=`<svg class="m" viewBox="0 0 230 300"><ellipse cx="115" cy="290" rx="70" ry="9" fill="#000" opacity=".12"/><path d="M40 150 Q10 130 18 100" stroke="#1f2a37" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M190 150 Q222 120 206 88" stroke="#1f2a37" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="62" y="40" width="106" height="200" rx="53" fill="#fff" stroke="#1f2a37" stroke-width="7"/><rect x="102" y="120" width="26" height="120" rx="13" fill="#e2453a"/><circle cx="115" cy="238" r="42" fill="#e2453a" stroke="#1f2a37" stroke-width="7"/><circle cx="100" cy="226" r="9" fill="#ff9f94"/><g stroke="#1f2a37" stroke-width="4"><line x1="150" y1="80" x2="166" y2="80"/><line x1="150" y1="100" x2="160" y2="100"/><line x1="150" y1="120" x2="166" y2="120"/></g><circle cx="96" cy="88" r="8" fill="#1f2a37"/><circle cx="134" cy="88" r="8" fill="#1f2a37"/><circle cx="99" cy="85" r="2.5" fill="#fff"/><circle cx="137" cy="85" r="2.5" fill="#fff"/><path d="M100 106 Q115 118 130 106" stroke="#1f2a37" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="84" cy="104" rx="9" ry="5" fill="#f4a39a" opacity=".7"/><ellipse cx="146" cy="104" rx="9" ry="5" fill="#f4a39a" opacity=".7"/><path d="M58 46 Q115 2 172 46 L172 56 L58 56Z" fill="#c8372d" stroke="#1f2a37" stroke-width="6"/><rect x="48" y="52" width="134" height="14" rx="7" fill="#1f2a37"/><circle cx="115" cy="34" r="9" fill="#ffd77a" stroke="#1f2a37" stroke-width="4"/></svg>`;
const MODES=[
  {k:'cold',name:'冷',e:'🧊',range:'18 度以下',c:'#3d9be0'},
  {k:'comfy',name:'剛剛好',e:'😊',range:'18～28 度',c:'#45a04a'},
  {k:'hot',name:'熱',e:'☀️',range:'28 度以上',c:'#e45a2c'}];
const modeOf=t=>t<18?MODES[0]:t<=28?MODES[1]:MODES[2];

/* ================= 竹東國中地圖（依 115 防災地圖配置） ================= */

const BLD=[
 {id:'gym',name:'活動中心',r:[4,2,6,8],roof:'#7f9a62',doors:[{d:[7,9],s:[7,10]}]},
 {id:'stage',name:'司令台',r:[10,5,2,4],roof:'#a48b72',doors:[],small:1},
 {id:'qinxue',name:'勤學樓',r:[3,12,4,15],roof:'#5f87b5',doors:[{d:[6,19],s:[7,19],sign:'美術教室',fun:'這是勤學樓的美術教室，畫畫的地方 🎨'}]},
 {id:'tkd',name:'跆拳教室',r:[7,16,5,3],roof:'#b55f4f',doors:[{d:[9,18],s:[9,19],fun:'跆拳教室，嘿！哈！🥋'}]},
 {id:'wc',name:'洗手台',r:[13,16,2,2],roof:'#7a9fae',doors:[{d:[13,17],s:[13,18]}],small:1,sinks:1},
 {id:'yangcai',name:'揚才樓',r:[18,23,6,6],roof:'#4f8f7a',doors:[{d:[18,26],s:[17,26],sign:'自然教室'}]},
 {id:'qilin',name:'杞林樓',r:[8,31,15,4],roof:'#8a73b0',doors:[{d:[15,31],s:[15,30],sign:'圖書館',fun:'圖書館要安靜唷 🤫'},{d:[12,34],s:[12,35],sign:'學務處・總務處',fun:'這是杞林樓：1 樓學務處、總務處，2 樓教務處，3 樓校長室唷！'}]},
 {id:'guard',name:'警衛室',r:[3,31,3,2],roof:'#6d7f8f',doors:[{d:[4,32],s:[4,33]}],small:1},
 {id:'g9',name:'九年級教室',r:[3,38,4,9],roof:'#c79a4a',doors:[{d:[6,41],s:[7,41],fun:'九年級學長姐的教室唷 📖'}]},
 {id:'yingxi',name:'迎曦樓',r:[8,43,10,4],roof:'#c06f63',doors:[{d:[11,43],s:[11,42],sign:'健康中心'}]},

const TREES=[[3,1],[3,6],[10,1],[11,11],[9,12],[11,14],[25,24],[27,26],[26,29],[28,32],[27,38],[28,41],[27,46],[8,28],[16,23],[8,41],[17,37],[6,28],[28,19],[3,28],[13,21],[6,36],[11,27],[13,27]];
const isTree=(x,y)=>TREES.some(t=>t[0]===x&&t[1]===y);
const bAt=(x,y)=>BLD.find(b=>inR(x,y,b.r));
function walk(x,y){if(x<3||y<1||x>28||y>47)return false;if(bAt(x,y)||isTree(x,y))return false;if(SOLID.some(r=>inR(x,y,r)))return false;return true;}
function bfs(s,t,maxLen=999){
  const key=(x,y)=>y*W+x,prev=new Map([[key(...s),null]]),q=[s];let found=false,qi=0;
  while(qi<q.length){const [x,y]=q[qi++];if(x===t[0]&&y===t[1]){found=true;break;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(walk(nx,ny)&&!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny]);}}}
  if(!found)return null;const p=[];let c=t;while(c&&!(c[0]===s[0]&&c[1]===s[1])){p.unshift(c);c=prev.get(key(...c));}
  return p.length>maxLen?null:p;}

function thSVG(v,cls,tag){
  const y=d=>330-d*5,parts=[];
  for(let d=0;d<=60;d++){const L=d%10===0?24:d%5===0?16:9;parts.push(`<line x1="66" x2="${66+L}" y1="${y(d)}" y2="${y(d)}" stroke="#1f2a37" stroke-width="${d%10===0?4:2}"/>`);
    if(d%10===0)parts.push(`<text x="98" y="${y(d)+8}" font-size="22" font-weight="900" fill="#1f2a37" font-family="Noto Sans TC,sans-serif">${d}</text>`);}
  const s=`<svg class="thsvg ${cls||''}" viewBox="0 0 132 392" aria-label="溫度計"><text x="40" y="18" font-size="16" fill="#5b6673" font-weight="700">°C</text>
   <rect x="38" y="24" width="26" height="320" rx="13" fill="#f7fbff" stroke="#8fa3b3" stroke-width="4"/>${parts.join('')}
   <rect x="45" y="${y(v)}" width="12" height="${348-y(v)}" rx="6" fill="#d9392e"/>
   <circle cx="51" cy="360" r="25" fill="#d9392e" stroke="#8fa3b3" stroke-width="4"/><circle cx="43" cy="352" r="6" fill="#ff8f86"/></svg>`;
  return tag?`<div class="thtag">${s}<span>${tag}</span></div>`:s;}
const lcd=v=>{const [a,b]=String(v).split('.');return `<div class="lcd"><div class="scr"><span>${a}</span><span class="dec">${b?'.'+b:''}</span><span class="u">°C</span></div></div>`;};

function readQ(place,v,photo,rec){

  for(let i=0;i<n;i++){const e=document.createElement('i');e.style.background=pick(cols);e.style.left=(30+Math.random()*40)+'%';e.style.top='55%';fx.appendChild(e);
    const dx=(Math.random()-.5)*700,dy=-200-Math.random()*400;
    e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx*.6}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy+700}px) rotate(${Math.random()*1440}deg)`,opacity:0}],{duration:1600+Math.random()*600,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>e.remove();}}

function catchSprite(w){
  const d=Math.hypot(w.fx-S.p.fx,w.fy-S.p.fy);
  if(d>3.2){toast(`那是${w.name}！走近一點再點它唷 🐾`);goTo(w.x,w.y);return;}
  w.caught=true;S.pets.push(w);beep(true,1);hud();save();
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;sparks.push({x:w.fx*T+T/2,y:w.fy*T+T/2,vx:Math.cos(a),vy:Math.sin(a),t0:performance.now()});}
  toast(`${w.name}加入隊伍！「${w.line}」`);
}
function arrived(){
  const p=S.p,here=STA.filter(s=>s.spot[0]===p.x&&s.spot[1]===p.y);
  if(!here.length){let fun=null;BLD.forEach(b=>b.doors.forEach(d=>{if(d.s[0]===p.x&&d.s[1]===p.y&&d.fun)fun=d.fun;}));
    const near=WILD.find(w=>!w.caught&&Math.hypot(w.fx-p.fx,w.fy-p.fy)<1.6);if(fun)toast(fun);else if(near)toast(`${near.name}就在旁邊，點它一下！`);return;}
  const gs=goals(),st=here.find(s=>gs.includes(s));
  if(st){openStation(st);return;}
  const todo=here.find(s=>!S.done.has(s.id));
  if(todo&&!avail(todo)){toast('先去巡邏三個地方：教室、大樹下、操場太陽下！');return;}
  if(S.mode==='story'){const g=STA[S.stage];if(g)toast(`這裡是${here[0].place}。我們要去${g.place}找${g.staff}唷！`);return;}
  toast(`${here[0].place}已經完成囉 ✅`);
}

/* ================= 任務卡 ================= */
function showCard(h){$('#card').innerHTML=h;$('#sheet').hidden=false;$('#card').scrollTop=0;}
const whoHTML=(st,extra)=>`<div class="who"><div class="av">${st.sicon}</div><div><b>${st.staff}</b><span>${st.place} · ${st.period}${extra||''}</span></div></div>`;
const capSVG=MASCOT.replace('class="m"','');
function openStation(st){
  S.busy=true;setTime(st.period,st.time,STA.indexOf(st));const set=st.make(S.day);let k=0;
  S.log[st.id]=S.log[st.id]||{q:0,first:0,miss:0};
  const next=()=>{if(k<set.qs.length)ask(set.qs[k++],st,next);else choice();};
  const choice=()=>{showCard(`${whoHTML(st)}<div class="fb good">${capSVG}<span>這一站完成了！要再挑戰一題嗎？</span></div>
    ${st.patrol?recHTML():''}
    <div class="actions"><button class="btn" id="chBtn">⭐ 挑戰題</button><button class="btn ghost" id="nxBtn">下一站 ➜</button></div>`);
    say('這一站完成了！要再挑戰一題嗎？');$('#chBtn').onclick=()=>ask(set.ch,st,()=>done(st),true);$('#nxBtn').onclick=()=>done(st);};
  next();}
function ask(q,st,cb,challenge){
  let first=true;const L=S.log[st.id];L.q++;
  showCard(`${whoHTML(st,challenge?' · ⭐ 挑戰題':'')}
    <div class="prompt"><p>${q.say}</p><button class="speak" id="spk" aria-label="唸題目">🔊</button></div>
    <div class="visual">${q.v}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.img?`<img class="oi" src="${o.img}" alt="">`:`<span class="e">${o.e}</span>`}<span class="l">${o.l}</span>${o.s?`<span class="s">${o.s}</span>`:''}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`);
  say(q.say);$('#spk').onclick=()=>say(q.say);
  document.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    if(btn.disabled)return;const o=q.opts[+btn.dataset.k],fb=$('#fb');
    if(o.ok){btn.classList.add('ok');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
      if(first){S.stars++;L.first++;hud();}if(q.dress)S.outfit=S.day.k;
      let extra='';if(q.rec){S.rec[q.rec]=q.val;extra=' ✏️ 寫進巡邏記錄卡了！';}else if(q.dress)extra=' 換好衣服囉！';
      fb.className='fb good';fb.innerHTML=`${capSVG}<span>${first?'⭐ ':''}答對了！${q.why}${extra}</span>`;beep(true);confetti(first?46:20);say('答對了！'+q.why);save();setTimeout(cb,2100);}
    else{first=false;L.miss++;btn.classList.add('no','shake');btn.disabled=true;fb.className='fb bad';fb.innerHTML=`${capSVG}<span>沒關係，再看一次！${q.hint}</span>`;beep(false);say('沒關係，再看一次。'+q.hint);}
  });}
function done(st){
  $('#sheet').hidden=true;S.done.add(st.id);if(S.mode==='story')S.stage++;S.busy=false;hintKey='';hud();save();
  if(S.done.size>=STA.length){finish();return;}
  if(S.mode==='story'){const g=STA[S.stage];setTimeout(()=>say(`下一站，走到${g.place}，找${g.staff}！`),300);}
  else setTimeout(()=>say(`還有 ${STA.length-S.done.size} 站，繼續探險！`),300);}
$('#recBtn').onclick=()=>{if(S.busy||!S.day)return;S.busy=true;
  showCard(`<div class="who"><div class="av">📋</div><div><b>巡邏記錄卡</b><span>到三個地方讀溫度計，答對就會自動寫上去</span></div></div>${recHTML()}
  <div class="actions"><button class="btn" id="closeRec">好，繼續探險</button></div>`);say('巡邏記錄卡：教室、大樹下、操場太陽下。');
  $('#closeRec').onclick=()=>{$('#sheet').hidden=true;S.busy=false;};};
function finish(){
  setTime('放學','16:00',STA.length);clearSave();const max=STA.length*3;
  const rows=STA.map(s=>{const L=S.log[s.id]||{q:0,first:0,miss:0};return `<tr><td>${s.place}</td><td>${L.first} / ${L.q}</td><td>${L.miss}</td></tr>`;}).join('');
  $('#coverIn').innerHTML=`<div class="cert"><div class="hero">${MASCOT}</div><div style="font-size:14px;font-weight:900;color:#6b7d78">今天平安放學！${S.day.t} 度的一天</div>
    <h2>溫度特勤隊員</h2><div class="st">${'⭐'.repeat(S.stars)}</div><div style="font-weight:900">${S.stars} / ${max} 顆星 · 溫度精靈 ${S.pets.length} / ${SPRITES.length} 隻</div>${recHTML()}</div>
    <div class="spr" id="sprEnd"></div>
    <details class="tlog"><summary>👩‍🏫 老師看：這次的紀錄</summary><table><tr><th>站</th><th>一次答對</th><th>答錯次數</th></tr>${rows}</table></details>
    <button class="btn" id="again" style="font-size:20px;padding:14px">🔁 換個天氣再玩</button>`;
  $('#cover').hidden=false;S.pets.forEach((w,i)=>spriteCanvas($('#sprEnd'),w.k,i));confetti(80);
  say(`恭喜你平安放學！得到 ${S.stars} 顆星，還帶走 ${S.pets.length} 隻溫度精靈！`);beep(true,1);$('#again').onclick=()=>location.reload();}

/* ================= 開始／接續 ================= */
function seg(id,key){document.querySelectorAll(id+' .pick').forEach(b=>b.onclick=()=>{document.querySelectorAll(id+' .pick').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');S[key]=b.dataset.v;});}
seg('#dayPick','dayK');seg('#modePick','mode');
function tog(id,key,name){const b=$(id);b.onclick=()=>{S[key]=!S[key];b.setAttribute('aria-pressed',S[key]);b.textContent=name+(S[key]?' 開':' 關');if(key==='voice'&&!S.voice&&'speechSynthesis' in window)speechSynthesis.cancel();};}
tog('#tgHint','hint','提示');tog('#tgVoice','voice','配音');
$('#goalSay').onclick=()=>{const g=goals();if(!g.length)return;say(S.mode==='story'?`走到${g[0].place}，找${g[0].staff}`:`還有 ${g.length} 站，去找頭上發光的人`);};
$('#autoWalk').onclick=()=>{const g=goals();if(!g.length)return;let best=null,bl=1e9;g.forEach(s=>{const pth=bfs([S.p.x,S.p.y],s.spot);if(pth&&pth.length<bl){bl=pth.length;best=s;}});if(best)goTo(...best.spot);};
function temps(k,t){return k==='hot'?{room:t-4,shade:t-2,sun:t+4}:k==='cold'?{room:t+3,shade:t-1,sun:t+5}:{room:t,shade:t-1,sun:t+5};}
function begin(){const m=modeOf(S.day.t),wx=$('#wx');wx.textContent=`${m.e} ${S.day.t}°C`;wx.style.background=m.c;
  spawnNPCs();spawnSprites();$('#cover').hidden=true;hud();beep(true);}
$('#startBtn').onclick=()=>{
  const k=S.dayK==='rand'?pick(['cold','comfy','hot']):S.dayK,t=k==='cold'?pick([13,14,15,16]):k==='hot'?pick([30,31,32,33]):pick([21,22,23,24]);
  S.day={k,t,temps:temps(k,t)};clearSave();begin();
  say(S.mode==='story'?'溫度特勤隊出動！先找校門口的警衛伯伯！':'自由探險！去找頭上發光的人！');};
const SV=load();
if(SV&&SV.day&&SV.done&&SV.done.length<STA.length){const b=$('#resumeBtn');b.hidden=false;b.textContent=`▶ 繼續上次的探險（已完成 ${SV.done.length} / ${STA.length} 站）`;
  b.onclick=()=>{Object.assign(S,{mode:SV.mode,day:SV.day,stage:SV.stage,done:new Set(SV.done),stars:SV.stars,outfit:SV.outfit,rec:SV.rec||{},log:SV.log||{}});
    S.p.x=S.p.fx=SV.pos[0];S.p.y=S.p.fy=SV.pos[1];begin();
    (SV.pets||[]).forEach(i=>{const w=WILD[i];if(w){w.caught=true;S.pets.push(w);}});
    const last=STA.filter(s=>S.done.has(s.id)).pop();if(last)setTime(last.period,last.time,STA.indexOf(last));hud();say('歡迎回來！繼續探險！');};}
resize();hud();requestAnimationFrame(loop);
window.__camp={S,STA,openStation,goTo,finish};
</script>
