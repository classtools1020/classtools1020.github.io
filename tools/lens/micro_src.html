<!--HEAD-->
<title>微小世界探險隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 野外觀察包：深綠帆布頂列＋紙張手冊底列，中間是 16:9 手繪校園舞台；放大鏡把同一個位置用向量重畫放大 */
:root{
  --canvas:#33412f; --canvas2:#26311f; --paper:#f6efdf; --paper2:#e9dfc8; --ink:#3b2a1e; --ink2:#6e5a45;
  --amber:#e2a43b; --brass:#b48a3c; --leaf:#5e8b3f;
  --display:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--canvas2);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:4px solid var(--amber);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;position:relative}
header{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--canvas);color:var(--paper);border-bottom:3px solid #1c2518;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;white-space:nowrap;min-width:0;overflow:hidden}
.brand svg{width:34px;height:34px;flex:none}
.brand .short{display:none}
.lvs{display:flex;gap:6px;margin-left:auto;flex:none}
.lv{min-height:64px;min-width:76px;padding:4px 10px;border-radius:10px;border:2px solid #5b6b52;background:transparent;color:#d9e0cf;font-weight:900;font-size:15px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv small{font-size:12px;font-weight:700}
.lv[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tl{display:flex;gap:6px;flex:none}
.tb{min-width:64px;min-height:64px;padding:4px 8px;border-radius:12px;border:2px solid #5b6b52;background:#2a3626;color:var(--paper);font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none}
.tb svg{width:24px;height:24px}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}.dots i.on{background:var(--amber);border-color:var(--amber)}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
#stage{position:relative;background:#cfe4ea;border-radius:6px;box-shadow:0 0 0 3px #1c2518,0 10px 30px rgba(0,0,0,.35);overflow:hidden;touch-action:none;flex:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
footer{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:3px solid var(--ink);min-width:0;min-height:100px}
#face{width:84px;height:84px;flex:none;border-radius:50%;background:var(--paper2);border:3px solid var(--ink)}
.talk{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#line{font-size:18px;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.4em}
.instr{display:flex;align-items:center;gap:10px;min-width:0}
#instrIc{width:46px;height:46px;flex:none}
#instrIc svg{width:100%;height:100%}
#instr{font-family:var(--display);font-weight:400;font-size:29px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.sq{width:64px;height:64px;flex:none;border-radius:16px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0}
.sq svg{width:32px;height:32px}
.bookw{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.bookw>span{font-size:12px;font-weight:900;color:var(--ink2);letter-spacing:.1em}
#book{display:flex;gap:8px}
.slot{width:64px;height:64px;border-radius:50%;border:3px dashed #b9a785;background:var(--paper2);padding:0;overflow:hidden;position:relative}
.slot canvas{width:100%;height:100%;display:block}
.slot.on{border:3px solid var(--ink);background:#fff}
.slot.pulse{animation:pl 1s ease 3}
@keyframes pl{50%{transform:scale(1.12)}}
.prim{min-height:64px;min-width:150px;padding:8px 22px;border-radius:16px;border:3px solid var(--ink);background:var(--amber);color:var(--ink);font-weight:900;font-size:22px;box-shadow:0 5px 0 var(--ink);flex:none}
.prim:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.prim.teach{background:#fff}
/* 舞台內覆蓋層 */
.obs{position:absolute;top:3%;width:28%;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:1%;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 20px rgba(40,30,20,.3);z-index:3}
.obs.L{left:2%}.obs.R{right:2%}.obs.small{width:21%}
.obs .tag{font-weight:900;font-size:clamp(12px,1.2vw,15px);color:var(--ink2);letter-spacing:.06em}
.obs canvas{width:100%;aspect-ratio:1;border-radius:50%;border:6px solid var(--brass);display:block;background:#fff}
.obs p{margin:0;font-size:clamp(14px,1.55vw,20px);font-weight:700;line-height:1.4}
.obs .ok{position:absolute;top:16%;left:50%;transform:translateX(-50%) rotate(-8deg);background:#fff;border:4px solid var(--ink);border-radius:12px;padding:2px 12px;font-family:var(--display);font-size:clamp(17px,2vw,28px);white-space:nowrap}
.ov{position:absolute;inset:0;background:rgba(36,46,30,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5%;padding:2.5% 3%;z-index:4}
.gq{font-family:var(--display);font-size:clamp(20px,3vw,40px);color:#fff;text-shadow:0 2px 0 #1c2518;text-align:center}
.cards{display:flex;gap:5%;width:100%;justify-content:center;align-items:flex-start}
.gcard{flex:0 1 36%;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:1.2%;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.gcard canvas{width:100%;aspect-ratio:4/3;display:block}
.gcard b{font-size:clamp(17px,2.3vw,30px)}
.gcard[aria-pressed="true"]{outline:7px solid var(--amber);outline-offset:3px}
.gcard .pk{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--amber);border:3px solid var(--ink);border-radius:10px;padding:1px 12px;font-weight:900;font-size:clamp(13px,1.4vw,17px);white-space:nowrap}
.gcard.no{opacity:.55}
.ghost{min-height:56px;padding:6px 20px;border-radius:14px;border:3px solid var(--paper);background:rgba(0,0,0,.25);color:var(--paper);font-weight:900;font-size:clamp(15px,1.6vw,19px)}
.hatrow{display:flex;gap:4%;justify-content:center;width:100%}
.hatb{flex:0 1 22%;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:1%;display:flex;flex-direction:column;align-items:center;gap:4px}
.hatb canvas{width:100%;aspect-ratio:1;display:block}
.hatb b{font-size:clamp(15px,1.8vw,22px)}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:2.2% 3%;width:min(78%,860px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-height:96%;overflow:auto}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,44px);margin:0}
.panel p{margin:0;font-size:clamp(15px,1.7vw,21px);font-weight:700;line-height:1.5}
.thumbs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.thumbs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(70px,10vw,130px);font-size:clamp(12px,1.25vw,15px);font-weight:700}
.thumbs canvas{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--brass);display:block;background:#fff}
.teaser{background:#fff8e2;border:2px dashed var(--ink2);border-radius:12px;padding:6px 14px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn2{min-height:64px;padding:8px 20px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:clamp(16px,1.7vw,21px)}
.btn2.main{background:var(--amber);box-shadow:0 5px 0 var(--ink)}
.bag{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:16px;padding:12px 16px;background:#7a5536;border:3px solid var(--ink);border-radius:18px;z-index:3;align-items:stretch}
.bag>span{writing-mode:vertical-rl;color:var(--paper);font-weight:900;letter-spacing:.2em;font-size:15px;align-self:center}
.tool{width:clamp(100px,11vw,150px);background:var(--paper);border:4px solid var(--ink);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tool canvas{width:100%;aspect-ratio:1;display:block}
.tool b{font-size:clamp(15px,1.6vw,20px)}
.tool.no{opacity:.6}.tool.no::after{content:"不適合";position:absolute;top:8px;right:-10px;transform:rotate(12deg);background:#fff;border:3px solid var(--ink);border-radius:8px;padding:0 6px;font-weight:900;font-size:14px}
#tags{position:absolute;inset:0;pointer-events:none;z-index:2}
.etag{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 4px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(13px,1.5vw,19px);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.etag canvas{width:clamp(40px,4.4vw,62px);aspect-ratio:1;border-radius:50%;border:3px solid var(--brass)}
.pop{position:absolute;right:12px;top:72px;z-index:20;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px;width:min(380px,calc(100vw - 24px));display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pop .row b{font-size:16px}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{min-height:52px;min-width:72px;padding:4px 10px;border:0;background:#fff;font-weight:900;font-size:15px}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--amber)}
.pop .row2{display:flex;gap:8px}
.pop .row2 button{flex:1;min-height:56px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:900;font-size:15px}
.pop small{color:var(--ink2);font-weight:700;line-height:1.4}
@media (max-width:1180px){.brand .full{display:none}.brand .short{display:inline}}
@media (max-width:960px){.brand{font-size:18px}.lv{min-width:60px;font-size:14px}.tb>span:not(.dots){display:none}.tb{min-width:56px}#face{width:64px;height:64px}#instr{font-size:23px}#line{font-size:15px}.slot{width:54px;height:54px}.prim{min-width:120px;font-size:19px;padding:8px 14px}#instrIc{width:38px;height:38px}}
@media (max-width:720px){.brand{display:none}.lvs{margin-left:0}.bookw>span{display:none}}
</style>

<div id="app">
<header>
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="20" r="13" fill="#dfeef2" stroke="#f6efdf" stroke-width="4"/><path d="M30 30 L43 43" stroke="#e2a43b" stroke-width="7" stroke-linecap="round"/></svg><span class="full">竹東校園・微小世界探險隊</span><span class="short">微小世界探險隊</span></div>
  <nav class="lvs" aria-label="關卡">
    <button class="lv" data-lv="1">第一關<small>怪腳印</small></button>
    <button class="lv" data-lv="2">第二關<small>配一配</small></button>
    <button class="lv" data-lv="3">第三關<small>選工具</small></button>
  </nav>
  <div class="tl">
    <button class="tb" id="hintBtn" aria-label="提示"><svg viewBox="0 0 48 48"><path d="M24 6a13 13 0 0 0-8 23v5h16v-5a13 13 0 0 0-8-23z" fill="#f6d77a" stroke="currentColor" stroke-width="3"/><path d="M18 39h12M20 44h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>提示</span><span class="dots"><i></i><i></i><i></i></span></button>
    <button class="tb" id="setBtn" aria-label="老師設定" aria-expanded="false"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M24 5v7M24 36v7M5 24h7M36 24h7M10.6 10.6l5 5M32.4 32.4l5 5M10.6 37.4l5-5M32.4 15.6l5-5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg><span>設定</span></button>
    <a class="tb site" href="./" aria-label="返回"><svg viewBox="0 0 48 48"><path d="M28 10L14 24l14 14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>返回</span></a>
    <a class="tb site" href="/light/" aria-label="主選單"><svg viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3.5"><rect x="8" y="8" width="13" height="13" rx="2"/><rect x="27" y="8" width="13" height="13" rx="2"/><rect x="8" y="27" width="13" height="13" rx="2"/><rect x="27" y="27" width="13" height="13" rx="2"/></g></svg><span>主選單</span></a>
  </div>
</header>
<div id="pop" class="pop" hidden role="dialog" aria-label="老師設定">
  <div class="row"><b>第一關猜一猜</b><div class="seg" data-k="mode"><button data-v="class">全班共玩</button><button data-v="solo">個人探索</button></div></div>
  <small>全班共玩：學生先指圖片，老師按「揭曉」才公布。</small>
  <div class="row"><b>第二關選項</b><div class="seg" data-k="opts"><button data-v="2">2 個</button><button data-v="3">3 個</button></div></div>
  <div class="row"><b>音效</b><div class="seg" data-k="sound"><button data-v="1">開</button><button data-v="0">關</button></div></div>
  <div class="row"><b>語音</b><div class="seg" data-k="voice"><button data-v="1">開</button><button data-v="0">關</button></div></div>
  <div class="row"><b>減少動畫</b><div class="seg" data-k="reduce"><button data-v="0">關</button><button data-v="1">開</button></div></div>
  <div class="row2"><button id="restart">重新開始這一關</button><button id="newClues">換一組線索</button></div>
</div>
<div id="wrap"><div id="stage">
  <canvas id="cv" aria-label="手繪的竹東國中場景。拖曳放大鏡，或點一下想看的地方，放大鏡就會移過去。"></canvas>
  <div id="tags"></div>
  <div id="obs" class="obs R" hidden><div class="tag" id="obsTag">放大鏡看到的</div><canvas id="obsCv"></canvas><p id="obsCap"></p><div class="ok" id="obsOk" hidden>一樣！</div></div>
  <div id="guess" class="ov" hidden>
    <div class="gq">是誰留下大腳印？</div>
    <div class="cards" id="cards"></div>
    <button class="ghost" id="gBack">再觀察一下</button>
  </div>
  <div id="hats" class="ov" hidden>
    <div class="gq">幫阿竹選一頂帽子</div>
    <div class="hatrow" id="hatrow"></div>
    <button class="ghost" id="hatSkip">不用了</button>
  </div>
  <div id="end" class="ov" hidden><div class="panel" id="endPanel"></div></div>
  <div id="bag" class="bag" hidden></div>
</div></div>
<footer>
  <canvas id="face" width="168" height="168" aria-hidden="true"></canvas>
  <div class="talk"><div id="line"></div><div class="instr"><span id="instrIc"></span><b id="instr"></b></div></div>
  <button class="sq" id="replay" aria-label="重播指令"><svg viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#f6d77a" stroke="#3b2a1e" stroke-width="3" stroke-linejoin="round"/><path d="M33 17a10 10 0 0 1 0 14M37 12a16 16 0 0 1 0 24" fill="none" stroke="#3b2a1e" stroke-width="3" stroke-linecap="round"/></svg></button>
  <div class="bookw"><span>線索手冊</span><div id="book"></div></div>
  <button class="prim" id="primary" hidden></button>
</footer>
</div>

<script>
/*SITE*/
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
if(!SITE)$$('.site').forEach(e=>e.hidden=true);
const TAU=Math.PI*2,LW=1600,LH=900,INK='#3b2a1e';
const FONT="Huninn,'Noto Sans TC','PingFang TC',sans-serif",FONT2="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const shuffle=(a,R)=>a.map(v=>[R(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
let SEED=(Date.now()%9973)+1;
const COLS={blue:{name:'藍',m:'#3f6fb0',d:'#2b4f86'},red:{name:'紅',m:'#c0473a',d:'#8c2f25'},green:{name:'綠',m:'#4f8a4a',d:'#356532'}};

/* ===== 設定（每台電腦各自記住） ===== */
const G={lv:1,mode:'class',opts:2,sound:true,voice:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches,hat:null};
try{const s=JSON.parse(localStorage.getItem('ct_micro_v1')||'{}');['mode','opts','sound','voice','reduce','hat'].forEach(k=>{if(k in s)G[k]=s[k];});}catch(e){}
{const h=location.hash.slice(1);if(h==='solo'||h==='class')G.mode=h;}
function saveG(){try{localStorage.setItem('ct_micro_v1',JSON.stringify({mode:G.mode,opts:G.opts,sound:G.sound,voice:G.voice,reduce:G.reduce,hat:G.hat}));}catch(e){}}

/* ===== 圖示 ===== */
const ICON={
 leaf:'<svg viewBox="0 0 48 48"><path d="M24 4C36 10 42 22 24 44 6 22 12 10 24 4z" fill="#6e9e4a" stroke="#3b2a1e" stroke-width="3"/><path d="M24 8v34M24 18l-8 6M24 18l8 6M24 28l-7 5M24 28l7 5" stroke="#d6e8b0" stroke-width="2"/></svg>',
 mag:'<svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="13" fill="#dfeef2" stroke="#3b2a1e" stroke-width="3"/><path d="M30 30L43 43" stroke="#7a4e2d" stroke-width="7" stroke-linecap="round"/><circle cx="20" cy="20" r="13" fill="none" stroke="#b48a3c" stroke-width="3"/></svg>',
 tap:'<svg viewBox="0 0 48 48"><path d="M19 26V9a3.5 3.5 0 0 1 7 0v13l9 2c3 .6 4.6 3.3 4 6.2L37 42H19l-7-10c-1.5-2.2 1.2-4.8 3.5-3.2z" fill="#f4e3c8" stroke="#3b2a1e" stroke-width="3" stroke-linejoin="round"/></svg>',
 cloth:'<svg viewBox="0 0 48 48"><path d="M8 12l9-3 8 4 9-3 6 6-3 9 4 8-8 6-9-2-8 3-6-8 3-9z" fill="#5d86c4" stroke="#3b2a1e" stroke-width="3" stroke-linejoin="round"/><path d="M14 14v24M20 12v28M26 14v24M32 13v25M10 20h30M9 26h31M10 32h29" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5"/></svg>',
 paper:'<svg viewBox="0 0 48 48"><rect x="10" y="6" width="28" height="36" rx="2" fill="#fbf6e8" stroke="#3b2a1e" stroke-width="3"/><path d="M16 15h16M16 22h16M16 28h12M16 34h14" stroke="#6e5a45" stroke-width="2"/><circle cx="24" cy="7" r="3" fill="#c0473a" stroke="#3b2a1e" stroke-width="1.5"/></svg>',
 book:'<svg viewBox="0 0 48 48"><path d="M8 10h14a4 4 0 0 1 4 4v26a4 4 0 0 0-4-4H8zM40 10H26a0 0 0 0 1 0 0v30a4 4 0 0 1 4-4h10z" fill="#f2e2b8" stroke="#3b2a1e" stroke-width="3" stroke-linejoin="round"/></svg>',
 think:'<svg viewBox="0 0 48 48"><path d="M8 20c0-8 7-13 16-13s16 5 16 13-7 13-16 13l-8 7v-9C11 29 8 25 8 20z" fill="#fff" stroke="#3b2a1e" stroke-width="3" stroke-linejoin="round"/><path d="M20 16a4 4 0 1 1 6 3.5c-1.5.8-2 1.6-2 3" fill="none" stroke="#3b2a1e" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="27" r="1.8" fill="#3b2a1e"/></svg>',

/* ===== 小工具 ===== */
function wob(pts,amp,R){const q=pts.map(([x,y])=>[x+(R()-.5)*amp,y+(R()-.5)*amp]),p=new Path2D(),n=q.length;
  p.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);for(let i=0;i<n;i++){const a=q[i],b=q[(i+1)%n];p.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}p.closePath();return p;}
function rectPts(x,y,w,h,st=60){const p=[],nx=Math.max(1,Math.round(w/st)),ny=Math.max(1,Math.round(h/st));for(let i=0;i<nx;i++)p.push([x+w*i/nx,y]);for(let i=0;i<ny;i++)p.push([x+w,y+h*i/ny]);for(let i=nx;i>0;i--)p.push([x+w*i/nx,y+h]);for(let i=ny;i>0;i--)p.push([x,y+h*i/ny]);return p;}
function ellPts(cx,cy,rx,ry,n=18){return Array.from({length:n},(_,i)=>[cx+Math.cos(i/n*TAU)*rx,cy+Math.sin(i/n*TAU)*ry]);}
function fs(c,p,f,s,w){if(f){c.fillStyle=f;c.fill(p);}if(s){c.strokeStyle=s;c.lineWidth=w||3;c.lineJoin='round';c.lineCap='round';c.stroke(p);}}
function rrect(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function blob(c,x,y,r,f){c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function txt(c,s,x,y,size,col,w,font,al){c.fillStyle=col;c.font=`${w||700} ${size}px ${font||FONT}`;c.textAlign=al||'center';c.textBaseline='middle';c.fillText(s,x,y);}
function shadow(c,x,y,rx,ry){c.fillStyle='rgba(60,40,20,.16)';c.beginPath();c.ellipse(x,y,rx,ry||rx*.18,0,0,TAU);c.fill();}
function blades(R,x0,x1,y,hg,n){const p=new Path2D();for(let i=0;i<n;i++){const x=x0+R()*(x1-x0),hh=hg*(.5+R()*.6),ln=(R()-.5)*hg*.6;p.moveTo(x,y);p.quadraticCurveTo(x+ln*.3,y-hh*.6,x+ln,y-hh);}return p;}
const HIT=document.createElement('canvas').getContext('2d');
const lerp=(a,b,u)=>a+(b-a)*u,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;

/* ===== 葉子（姑婆芋）：葉脈與細網脈是真的畫在同一位置，放大才看清楚 ===== */
function makeLeaf(x,y,w,h,a,R,col){const shape=new Path2D();shape.moveTo(0,-h*.42);shape.bezierCurveTo(w*.30,-h*.64,w*.60,-h*.16,w*.02,h*.52);shape.bezierCurveTo(-w*.60,-h*.16,-w*.30,-h*.64,0,-h*.42);shape.closePath();
  const main=new Path2D(),lat=new Path2D(),fine=new Path2D();main.moveTo(0,-h*.40);main.quadraticCurveTo(w*.03,0,w*.02,h*.50);
  for(let i=0;i<6;i++){const yy=-h*.30+i*h*.13,len=w*.44*(1-Math.pow(i/6.4,1.7));for(const s of[-1,1]){lat.moveTo(w*.01,yy);lat.quadraticCurveTo(s*len*.55,yy+h*.015,s*len,yy+h*.13);}}
  for(let k=0;k<Math.round(w*h/160);k++){let px=(R()-.5)*w*.9,py=(R()-.5)*h*.95;fine.moveTo(px,py);for(let j=0;j<3;j++){px+=(R()-.5)*15;py+=(R()-.5)*15;fine.lineTo(px,py);}}
  const half=new Path2D();half.rect(-w,-h,w,2*h);
  return {x,y,w,h,a,shape,main,lat,fine,half,col:col||['#6a9a47','#7cab57'],shake:0,hairs:null};}
function drawLeaf(c,L,t){c.save();c.translate(L.x,L.y);const sh=L.shake>0.01&&!G.reduce?Math.sin(t/55)*0.07*L.shake:0;c.rotate(L.a+sh);
  c.fillStyle=L.col[0];c.fill(L.shape);c.save();c.clip(L.shape);c.fillStyle=L.col[1];c.fill(L.half);
  c.strokeStyle='rgba(214,234,168,.6)';c.lineWidth=.7;c.stroke(L.fine);c.strokeStyle='#cfe2a4';c.lineCap='round';c.lineWidth=2.2;c.stroke(L.lat);c.lineWidth=4.5;c.stroke(L.main);
  if(L.hairs){c.strokeStyle='#9a4626';c.lineWidth=1.3;c.stroke(L.hairs);}c.restore();
  c.strokeStyle='#33502a';c.lineWidth=3;c.lineJoin='round';c.stroke(L.shape);c.restore();}
function leafLocal(L,x,y){const dx=x-L.x,dy=y-L.y,ca=Math.cos(-L.a),sa=Math.sin(-L.a);return[dx*ca-dy*sa,dx*sa+dy*ca];}
function leafWorld(L,lx,ly){const ca=Math.cos(L.a),sa=Math.sin(L.a);return[L.x+lx*ca-ly*sa,L.y+lx*sa+ly*ca];}
function inLeaf(L,x,y){const[lx,ly]=leafLocal(L,x,y);return HIT.isPointInPath(L.shape,lx,ly);}
function hairPath(cx,cy,R){const p=new Path2D();for(let i=0;i<7;i++){const a=R()*TAU,len=9+R()*6,x=cx+(R()-.5)*16,y=cy+(R()-.5)*14;p.moveTo(x,y);p.quadraticCurveTo(x+Math.cos(a+.45)*len*.5,y+Math.sin(a+.45)*len*.5,x+Math.cos(a)*len,y+Math.sin(a)*len);}return p;}

/* ===== 布、紙、鞋、腳印 ===== */
function weave(c,x,y,w,h,sp,warp,weft){c.strokeStyle=warp;c.lineWidth=sp*.38;c.beginPath();for(let xx=x;xx<=x+w;xx+=sp){c.moveTo(xx,y);c.lineTo(xx,y+h);}c.stroke();
  c.strokeStyle=weft;c.lineWidth=sp*.55;c.setLineDash([sp,sp]);for(let i=0,yy=y;yy<=y+h;yy+=sp,i++){c.lineDashOffset=i%2?sp:0;c.beginPath();c.moveTo(x,yy);c.lineTo(x+w,yy);c.stroke();}c.setLineDash([]);}
function makeCloth(x,y,col,R){const pts=[];for(let i=0;i<14;i++){const a=i/14*TAU,j=.74+R()*.36;pts.push([Math.cos(a)*38*j,Math.sin(a)*27*j]);}
  const shape=new Path2D();shape.moveTo(...pts[0]);pts.forEach(p=>shape.lineTo(...p));shape.closePath();
  const fray=new Path2D();pts.forEach(([px,py])=>{if(R()<.75){const a=Math.atan2(py,px)+(R()-.5)*.7,l=4+R()*6;fray.moveTo(px,py);fray.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);}});
  return {x,y,col,shape,fray,rot:(R()-.5)*.5};}
function drawCloth(c,o){c.save();c.translate(o.x,o.y);c.rotate(o.rot);c.fillStyle=o.col.m;c.fill(o.shape);c.save();c.clip(o.shape);
  c.fillStyle='#f3efe6';c.fillRect(-44,-6,88,9);weave(c,-44,-32,88,64,2.4,'rgba(15,15,35,.38)','rgba(255,255,255,.32)');c.restore();
  c.strokeStyle=o.col.d;c.lineWidth=1.1;c.stroke(o.fray);c.strokeStyle=INK;c.lineWidth=1.8;c.stroke(o.shape);c.restore();}
function drawSneaker(c,len,col,hole){const H=len*.40,lw=Math.max(1,len*.022);
  c.beginPath();c.moveTo(-len*.5,-len*.02);c.quadraticCurveTo(-len*.52,-len*.11,-len*.46,-len*.11);c.lineTo(len*.40,-len*.11);c.quadraticCurveTo(len*.53,-len*.10,len*.52,-len*.02);c.quadraticCurveTo(len*.5,0,len*.44,0);c.lineTo(-len*.44,0);c.closePath();
  c.fillStyle='#f4f1ea';c.fill();c.strokeStyle=INK;c.lineWidth=lw;c.stroke();
  c.strokeStyle='rgba(59,42,30,.45)';c.lineWidth=Math.max(.6,len*.01);c.beginPath();for(let x=-len*.44,i=0;x<len*.44;x+=len*.04,i++){const y=-len*(i%2?.035:.075);i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
  const up=new Path2D();up.moveTo(-len*.47,-len*.11);up.bezierCurveTo(-len*.50,-H*.6,-len*.46,-H,-len*.36,-H);up.quadraticCurveTo(-len*.24,-H*.86,-len*.12,-H*.98);up.quadraticCurveTo(-len*.02,-H*1.06,len*.02,-H*.9);up.bezierCurveTo(len*.2,-H*.62,len*.42,-H*.5,len*.48,-len*.11);up.closePath();
  c.fillStyle=col.m;c.fill(up);c.save();c.clip(up);c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(len*.38,-len*.13,len*.16,len*.1,0,0,TAU);c.fill();
  c.strokeStyle='#f3efe6';c.lineWidth=len*.06;c.beginPath();c.moveTo(-len*.28,-len*.13);c.quadraticCurveTo(-len*.05,-H*.45,len*.12,-H*.78);c.stroke();
  if(hole){c.fillStyle='#2a1f18';c.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU,j=.75+((i*37)%10)/28;const px=-len*.06+Math.cos(a)*len*.085*j,py=-H*.42+Math.sin(a)*len*.06*j;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.fill();
    c.strokeStyle=col.m;c.lineWidth=Math.max(.6,len*.008);for(let i=0;i<10;i++){const a=i/10*TAU;c.beginPath();c.moveTo(-len*.06+Math.cos(a)*len*.08,-H*.42+Math.sin(a)*len*.055);c.lineTo(-len*.06+Math.cos(a)*len*.1,-H*.42+Math.sin(a)*len*.07);c.stroke();}}
  c.restore();c.strokeStyle=INK;c.lineWidth=lw;c.stroke(up);
  c.fillStyle='#2a1f18';c.beginPath();c.ellipse(-len*.26,-H*.93,len*.1,len*.025,-.05,0,TAU);c.fill();
  c.strokeStyle='#f3efe6';c.lineWidth=Math.max(.8,len*.02);for(let i=0;i<4;i++){const x=-len*.08+i*len*.07,y=-H*.86+i*H*.1;c.beginPath();c.moveTo(x-len*.03,y-len*.015);c.lineTo(x+len*.03,y+len*.015);c.moveTo(x-len*.03,y+len*.015);c.lineTo(x+len*.03,y-len*.015);c.stroke();}}
function solePath(len,wid){const p=new Path2D(),n=44;for(let i=0;i<=n;i++){const th=i/n*TAU,x=Math.cos(th)*len/2,u=x/len+.5;let w=wid/2*(.72+.38*u);w*=1-.22*Math.exp(-Math.pow((u-.38)/.12,2));const y=Math.sin(th)*w;i?p.lineTo(x,y):p.moveTo(x,y);}p.closePath();return p;}
function treadPath(len,wid){const p=new Path2D();for(let x=-len*.40;x<=len*.38;x+=11){const u=x/len+.5,w=wid/2*(.72+.38*u)*.78;p.moveTo(x,-w);p.lineTo(x+4,-w*.5);p.lineTo(x,0);p.lineTo(x+4,w*.5);p.lineTo(x,w);}return p;}
const SOLE=solePath(170,70),TREAD=treadPath(170,70),HEEL=(()=>{const p=new Path2D();p.moveTo(-170*.2,-20);p.lineTo(-170*.2,20);return p;})();
function drawPrint(c,x,y,a,alpha,col){c.save();c.translate(x,y);c.scale(1,.6);c.rotate(a);c.globalAlpha=alpha;c.fillStyle=col;c.fill(SOLE);c.globalAlpha=Math.min(1,alpha*1.1);c.strokeStyle='rgba(40,24,12,.75)';c.lineWidth=2.2;c.stroke(TREAD);c.strokeStyle='rgba(240,225,195,.6)';c.lineWidth=5;c.stroke(HEEL);c.strokeStyle='#4a2e1a';c.lineWidth=3;c.stroke(SOLE);c.restore();}
function drawSoleUp(c,x,y,a,col){c.save();c.translate(x,y);c.scale(1,.62);c.rotate(a);c.fillStyle=col.m;c.save();c.scale(1.06,1.14);c.fill(SOLE);c.restore();c.fillStyle='#ece8de';c.fill(SOLE);c.strokeStyle='#6b5a48';c.lineWidth=1.8;c.stroke(TREAD);c.strokeStyle=INK;c.lineWidth=3;c.stroke(SOLE);c.restore();}

/* ===== 阿竹（竹東的竹筍）：等待、發現、困惑、完成 ===== */
function drawHat(c,k){if(!k)return;c.lineJoin='round';
  if(k==='explorer'){c.fillStyle='#d8c08a';c.beginPath();c.moveTo(-36,-158);c.bezierCurveTo(-34,-204,34,-204,36,-158);c.closePath();c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke();c.fillStyle='#6b4a30';c.fillRect(-35,-168,70,9);c.fillStyle='#c9ad73';c.beginPath();c.ellipse(0,-158,52,10,0,0,TAU);c.fill();c.stroke();}
  if(k==='straw'){c.fillStyle='#e8cf7a';c.beginPath();c.ellipse(0,-160,66,14,0,0,TAU);c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke();c.beginPath();c.moveTo(-30,-162);c.bezierCurveTo(-30,-198,30,-198,30,-162);c.closePath();c.fill();c.stroke();c.fillStyle='#a4492c';c.fillRect(-30,-174,60,9);c.strokeStyle='rgba(120,90,30,.5)';c.lineWidth=1.2;for(let i=-56;i<=56;i+=8){c.beginPath();c.moveTo(i,-166);c.lineTo(i*1.08,-154);c.stroke();}}
  if(k==='beanie'){c.fillStyle='#c0473a';c.beginPath();c.moveTo(-36,-150);c.bezierCurveTo(-38,-206,38,-206,36,-150);c.closePath();c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke();c.strokeStyle='rgba(60,10,10,.35)';c.lineWidth=2;for(let i=-24;i<=24;i+=8){c.beginPath();c.moveTo(i,-158);c.lineTo(i*.7,-194);c.stroke();}c.fillStyle='#e9dccb';rrect(c,-40,-162,80,16,6);c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke();blob(c,0,-204,11,'#f3e9da');c.beginPath();c.arc(0,-204,11,0,TAU);c.stroke();}}
function drawAzhu(c,x,y,s,mood,t,hat){c.save();c.translate(x,y);c.scale(s,s);c.rotate(G.reduce?0:Math.sin(t/700)*.025);c.lineJoin='round';c.lineCap='round';
  c.fillStyle='rgba(40,30,20,.2)';c.beginPath();c.ellipse(0,2,56,10,0,0,TAU);c.fill();
  c.fillStyle='#d8c08a';c.strokeStyle=INK;c.lineWidth=2.5;[-22,22].forEach(fx=>{c.beginPath();c.ellipse(fx,-6,17,9,0,0,TAU);c.fill();c.stroke();});
  const body=new Path2D('M-52 -22C-60 -95 -32 -150 0 -188C32 -150 60 -95 52 -22Q0 -4 -52 -22Z');fs(c,body,'#efe0b0',INK,3);
  fs(c,new Path2D('M-52 -22C-58 -58 -42 -78 -8 -76C-20 -58 -8 -30 14 -12Q-20 -6 -52 -22Z'),'#b7c26c',INK,2.5);
  fs(c,new Path2D('M52 -22C56 -62 40 -84 10 -82C22 -58 10 -32 -12 -12Q22 -6 52 -22Z'),'#97b158',INK,2.5);
  fs(c,new Path2D('M-18 -150Q-4 -170 0 -190Q6 -170 18 -150Q0 -142 -18 -150Z'),'#7aa448',INK,2.5);
  if(hat!=='beanie'&&hat!=='explorer'&&hat!=='straw')fs(c,new Path2D('M2 -186Q22 -204 30 -196Q20 -184 2 -186Z'),'#8cbf55',INK,2);
  // 手
  c.strokeStyle=INK;c.lineWidth=5;const arm=(x0,y0,x1,y1)=>{c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo((x0+x1)/2+(x1>0?6:-6),(y0+y1)/2,x1,y1);c.stroke();blob(c,x1,y1,7,'#efe0b0');c.lineWidth=2;c.beginPath();c.arc(x1,y1,7,0,TAU);c.stroke();c.lineWidth=5;};
  if(mood==='find'){arm(-48,-70,-66,-62);arm(48,-72,72,-128);}
  else if(mood==='done'){arm(-48,-72,-74,-126);arm(48,-72,74,-126);}

  else{arm(-48,-68,-62,-44);arm(48,-68,62,-44);}
  // 臉
  const blink=!G.reduce&&mood==='wait'&&(t%3600)<130;

  else{[-15,15].forEach((ex,i)=>{if(mood==='puzzle'&&i===0){c.strokeStyle=INK;c.lineWidth=3.5;c.beginPath();c.moveTo(ex-7,-116);c.lineTo(ex+7,-114);c.stroke();return;}
    const r=mood==='find'?1.25:1;c.fillStyle='#2b1d14';c.beginPath();c.ellipse(ex,-115,6*r,(blink?1:8)*r,0,0,TAU);c.fill();if(!blink){blob(c,ex+2,-118,2.2*r,'#fff');if(mood==='find')blob(c,ex-2,-111,1.2,'#fff');}});}
  if(mood==='puzzle'){c.strokeStyle=INK;c.lineWidth=2.5;c.beginPath();c.moveTo(8,-130);c.lineTo(22,-134);c.stroke();}
  c.fillStyle='rgba(230,120,110,.45)';[-28,28].forEach(bx=>{c.beginPath();c.ellipse(bx,-100,8,5,0,0,TAU);c.fill();});
  c.strokeStyle=INK;c.lineWidth=3;
  if(mood==='find'){c.fillStyle='#8a3a2a';c.beginPath();c.ellipse(0,-97,5,6.5,0,0,TAU);c.fill();}
  else if(mood==='done'){c.fillStyle='#8a3a2a';c.beginPath();c.moveTo(-10,-101);c.quadraticCurveTo(0,-88,10,-101);c.closePath();c.fill();c.stroke();}
  else if(mood==='puzzle'){c.beginPath();c.moveTo(-8,-98);c.quadraticCurveTo(-4,-102,0,-98);c.quadraticCurveTo(4,-94,8,-98);c.stroke();}
  else{c.beginPath();c.arc(0,-103,6,Math.PI*.15,Math.PI*.85);c.stroke();}
  drawHat(c,hat);
  if(mood==='find'){c.fillStyle='#e2a43b';c.strokeStyle=INK;c.lineWidth=2.5;rrect(c,46,-214,14,30,5);c.fill();c.stroke();blob(c,53,-174,6,'#e2a43b');c.beginPath();c.arc(53,-174,6,0,TAU);c.stroke();}

  c.restore();}

const TAIL=new Path2D('M0 0C-70 10 -95 -70 -60 -110C-30 -140 10 -120 -8 -96C-35 -70 -30 -30 8 -14Z');
const FUR=(()=>{const p=new Path2D(),R=mulberry(77);for(let i=0;i<46;i++){const u=i/46,a=u*Math.PI*1.6+2.2,rx=-44+Math.cos(a)*44,ry=-60+Math.sin(a)*52;p.moveTo(rx,ry);p.lineTo(rx+Math.cos(a)*(6+R()*5),ry+Math.sin(a)*(6+R()*5));}return p;})();

  C.cur={items:[...C.l2room,...objs.map(o=>o.item)],bg:'#cdbd9b',dyn(c,t){objs.forEach(o=>{if(o.done){c.save();c.translate(o.x+80,o.y-80);c.rotate(-.2);c.fillStyle='#fff';c.strokeStyle=INK;c.lineWidth=4;rrect(c,-56,-22,112,44,10);c.fill();c.stroke();txt(c,'一樣',0,0,28,INK,400);c.restore();}});drawAzhu(c,130,862,.95,C.mood,t,G.hat);}};
  base=null;Object.assign(C.lens,{x:1440,y:520,r:130,m:2.8,kind:'mag',show:true,tx:null});
  const ref=snap(ans.x,ans.y,26);C.ref=ref;obsShow(ref,'這是哪一個東西的放大？','L','要找的花紋',true);
  say(C.round===0?'桌上的東西被放大了。':`第 ${C.round+1} 題。`,'把放大鏡移到東西上，找一樣的花紋','mag','wait');
  setTask({type:'match',objs,at:{x:ans.x,y:ans.y},ring:130,hint2:`觀察窗裡是${ans.feat}。`,hint3:`看，是${ans.name}。`,
    onOver:o=>{if(o){say(`這是${o.name}，放大看看。`,'一樣嗎？一樣就按「就是這個」','mag','wait');prim('就是這個',()=>pick2(o));}else{prim(null);say('','把放大鏡移到東西上，找一樣的花紋','mag','wait');}}});}
function closeAllSoft(){$('#obs').hidden=true;prim(null);}
function pick2(o){const ans=C.ans;if(o===ans){setTask(null);C.found=true;o.done=true;sfx('chime');C.mood='find';const sn=snap(o.x,o.y,26);bookAdd(C.round,sn,`${o.name}：${o.feat}`);
    obsShow(sn,`一樣！都是${o.feat}。`,'L','你找到的',true);$('#obsOk').hidden=false;say(`對了，是${o.name}！`,'看清楚了，按「下一題」','check','done');
    prim(C.round<2?'下一題':'完成',()=>{C.round++;if(C.round<3)round2();else endL2();});}
  else{sfx('soft');C.mood='puzzle';say(`不一樣。觀察窗是${ans.feat}，這個是${o.feat}。`,'再找找看','mag');obsShow(C.ref,'這是哪一個東西的放大？','L','要找的花紋',true);}}
function endL2(){C.mood='done';prim(null);const caps=C.rounds.map((rd,i)=>C.book[i]?C.book[i].cap.split('：')[0]:'');say('配對完成！','下一關：選工具','check','done');
  endPanel('配一配：完成！',caps,'下一個事件：阿竹遇到麻煩了，要選對工具才能解決。',[['第三關：選工具',startL3,1],['再玩一次（換東西）',()=>{SEED++;startL2();}]]);}

/* ================= 第三關：選工具 ================= */
function toolIcon(c,k){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,240,240);c.setTransform(2,0,0,2,0,0);c.lineJoin='round';c.lineCap='round';c.strokeStyle=INK;c.lineWidth=4;
  if(k==='mag'){c.save();c.translate(52,52);c.rotate(Math.PI/4);rrect(c,30,-9,40,18,8);c.fillStyle='#7a4e2d';c.fill();c.stroke();c.restore();blob(c,52,52,30,'#dff0f4');c.lineWidth=10;c.strokeStyle='#b48a3c';c.beginPath();c.arc(52,52,30,0,TAU);c.stroke();c.lineWidth=3;c.strokeStyle=INK;c.beginPath();c.arc(52,52,25,0,TAU);c.stroke();c.beginPath();c.arc(52,52,35,0,TAU);c.stroke();}
  if(k==='light'){c.fillStyle='rgba(255,236,150,.8)';c.beginPath();c.moveTo(74,30);c.lineTo(112,8);c.lineTo(112,62);c.closePath();c.fill();c.save();c.translate(50,64);c.rotate(-.55);rrect(c,-40,-14,64,28,8);c.fillStyle='#d9a23a';c.fill();c.stroke();rrect(c,22,-20,20,40,5);c.fillStyle='#7d7d7d';c.fill();c.stroke();c.restore();}
  if(k==='ruler'){c.save();c.translate(60,60);c.rotate(-.6);rrect(c,-54,-14,108,28,4);c.fillStyle='#e9d58a';c.fill();c.stroke();c.lineWidth=2;for(let i=-46;i<=46;i+=8){c.beginPath();c.moveTo(i,-14);c.lineTo(i,i%16===0?-2:-7);c.stroke();}c.restore();}}
const SITS=[
 {id:'med',prob:'藥袋上的字好小，看不清楚。',need:'mag',instr:'把放大鏡移到小字上',why:{light:'手電筒讓東西變亮，可是字還是好小。',ruler:'尺可以量長短，字不會變大。'},hint2:'要讓字變大。',done:n=>`小字寫著：一天 ${n} 次，飯後吃。`,book:'藥袋：一天幾次'},
 {id:'dark',prob:'桌子底下好暗，鑰匙掉了。',need:'light',instr:'用手電筒照一照，找到鑰匙',why:{mag:'放大鏡讓東西變大，可是這裡太暗，放大也看不到。',ruler:'尺可以量長短，可是好暗看不到。'},hint2:'要先讓它變亮。',done:()=>'找到鑰匙了！手電筒讓暗的地方變亮。',book:'鑰匙：用手電筒'},
 {id:'thorn',prob:'手指被木頭刺到了，小刺在哪裡？',need:'mag',instr:'把放大鏡移到手指上，找小刺',why:{light:'這裡夠亮，可是小刺太小了，要把它變大。',ruler:'尺量不到小刺在哪裡，要把它變大。'},hint2:'小刺太小了，要把它變大。',done:()=>'找到小刺了！請大人用夾子幫忙拿出來。',book:'小刺：用放大鏡'}];
function startL3(){G.lv=3;markLv();closeAll();bookReset();C.sit=0;sit3();}
function sit3(){closeAllSoft();const R=mulberry(SEED*17+C.sit*13),sp=SITS[C.sit];let items,target,lensAt;
  if(sp.id==='med'){const n=[2,3][Math.floor(R()*2)];sp.n=n;items=staticRoom(R);items.push({b:[600,400,1000,860],d:c=>{const bx=650,by=430,bw=300,bh=380;shadow(c,800,816,170,16);c.beginPath();c.moveTo(bx,by+12);for(let i=0;i<=10;i++)c.lineTo(bx+i*bw/10,by+(i%2?0:12));c.lineTo(bx+bw,by+bh);c.lineTo(bx,by+bh);c.closePath();c.fillStyle='#f4efe2';c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke();
      c.fillStyle='#fff';c.fillRect(bx+30,by+42,bw-60,110);c.strokeStyle='#a4492c';c.lineWidth=3;c.strokeRect(bx+30,by+42,bw-60,110);blob(c,bx+82,by+97,30,'#a4492c');c.fillStyle='#fff';c.fillRect(bx+72,by+77,20,40);c.fillRect(bx+62,by+87,40,20);txt(c,'藥袋',bx+190,by+97,46,'#a4492c',900,FONT2);
      txt(c,'姓名：',bx+70,by+190,18,INK,700,FONT2,'left');c.strokeStyle=INK;c.lineWidth=1.5;c.beginPath();c.moveTo(bx+128,by+200);c.lineTo(bx+260,by+200);c.stroke();
      c.font=`700 7px ${FONT2}`;c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';c.fillText(`用法：一天 ${n} 次`,800,by+250);c.fillText('飯後吃，每次 1 包',800,by+261);c.fillText('請放在陰涼的地方',800,by+272);
      [[bx+70,by+320],[bx+110,by+330],[bx+150,by+318]].forEach(([px,py])=>{c.fillStyle='#fff';c.beginPath();c.ellipse(px,py,14,9,.3,0,TAU);c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke();});}});target={x:800,y:691};lensAt={x:1320,y:560};}
  if(sp.id==='dark'){const kp=[[520,700],[1000,780],[1240,640]][Math.floor(R()*3)];items=[{b:[0,0,1600,900],d:c=>{c.fillStyle='#c9b48f';c.fillRect(0,0,1600,900);c.strokeStyle='#b59f78';c.lineWidth=2;for(let x=0;x<=1600;x+=160){c.beginPath();c.moveTo(x,120);c.lineTo(x,900);c.stroke();}for(let y=200;y<=900;y+=140){c.beginPath();c.moveTo(0,y);c.lineTo(1600,y);c.stroke();}
      c.fillStyle='#6b5a48';c.fillRect(0,0,1600,120);c.strokeStyle=INK;c.lineWidth=3;c.strokeRect(-2,-2,1604,122);[[200,30],[1380,30]].forEach(([x,w])=>{c.fillStyle='#8a8f96';c.fillRect(x,120,w,780);c.strokeRect(x,120,w,780);});[[560,24],[1040,24]].forEach(([x,w])=>{c.fillStyle='#a0715a';c.fillRect(x,300,w,600);c.strokeRect(x,300,w,600);});
      c.fillStyle='#f2efe6';c.beginPath();c.arc(380,760,34,0,TAU);c.fill();c.stroke();c.fillStyle='#f0a5b4';rrect(c,1120,600,80,40,6);c.fill();c.stroke();c.save();c.translate(760,820);c.rotate(-.2);c.fillStyle='#e9c540';c.fillRect(-90,-9,180,18);c.strokeRect(-90,-9,180,18);c.restore();
      c.save();c.translate(kp[0],kp[1]);c.rotate(.4);c.strokeStyle=INK;c.lineWidth=2;c.fillStyle='#d6a93b';c.beginPath();c.arc(-24,0,14,0,TAU);c.fill();c.stroke();blob(c,-24,0,6,'#c9b48f');c.fillRect(-10,-5,44,10);c.strokeRect(-10,-5,44,10);c.fillRect(20,5,6,8);c.fillRect(28,5,5,6);c.restore();}}];target={x:kp[0],y:kp[1]};lensAt={x:300,y:300};}
  if(sp.id==='thorn'){const fi=Math.floor(R()*3);items=staticRoom(R);const fy=[600,668,736,800],fl=[230,250,232,190];const sx=1040-fl[fi]+64,sy=fy[fi]+9;
    items.push({b:[700,500,1600,900],d:c=>{shadow(c,1150,860,360,20);c.fillStyle='#f1d0b0';c.strokeStyle=INK;c.lineWidth=3;c.beginPath();c.ellipse(1220,700,200,140,0,0,TAU);c.fill();c.stroke();fy.forEach((y,i)=>{rrect(c,1040-fl[i],y-27,fl[i]+60,54,27);c.fill();c.stroke();c.fillStyle='#f7e2d0';rrect(c,1040-fl[i]+6,y-18,26,36,10);c.fill();c.strokeStyle='rgba(59,42,30,.5)';c.stroke();c.fillStyle='#f1d0b0';c.strokeStyle=INK;});
      c.beginPath();c.ellipse(1150,560,90,34,-.5,0,TAU);c.fill();c.stroke();c.strokeStyle='rgba(120,70,50,.35)';c.lineWidth=1.5;fy.forEach(y=>{c.beginPath();c.moveTo(960,y-10);c.quadraticCurveTo(966,y,960,y+10);c.stroke();});
      c.fillStyle='rgba(220,110,110,.28)';c.beginPath();c.arc(sx,sy,6,0,TAU);c.fill();c.strokeStyle='#5a3a22';c.lineWidth=1.5;c.lineCap='round';c.beginPath();c.moveTo(sx-4,sy-2.5);c.lineTo(sx+5,sy+2.5);c.stroke();}});target={x:sx,y:sy};lensAt={x:400,y:640};}
  const dark=sp.id==='dark';C.cur={items,bg:dark?'#c9b48f':'#cdbd9b',dyn(c,t){if(!dark)drawAzhu(c,130,862,.95,C.mood,t,G.hat);},
    post(c){if(!dark)return;const l=C.lens,p=new Path2D();p.rect(0,0,LW,LH);if(l.show&&l.kind==='light')p.arc(l.x,l.y,l.r,0,TAU);c.fillStyle='rgba(10,12,18,.9)';c.fill(p,'evenodd');}};
  base=null;C.lens.show=false;C.sitTarget=target;C.sitLens=lensAt;
  const R2=mulberry(SEED+C.sit),ks=shuffle(['mag','light','ruler'],R2),names={mag:'放大鏡',light:'手電筒',ruler:'尺'};
  $('#bag').innerHTML='<span>道具袋</span>'+ks.map(k=>`<button class="tool" data-k="${k}"><canvas width="240" height="240"></canvas><b>${names[k]}</b></button>`).join('');
  $$('.tool').forEach(b=>{toolIcon(b.querySelector('canvas').getContext('2d'),b.dataset.k);b.onclick=()=>pickTool(b);});$('#bag').hidden=false;
  C.mood='puzzle';say(sp.prob,'要用哪一個工具？','tool');
  setTask({type:'choose',hint2:sp.hint2,hint3:`用${names[sp.need]}。`,demo:()=>{const b=$(`.tool[data-k="${sp.need}"]`);if(b){b.focus();b.style.outline='6px solid #e2a43b';}}});}
function pickTool(b){const sp=SITS[C.sit],k=b.dataset.k;if(k!==sp.need){sfx('soft');b.classList.add('no');C.mood='puzzle';say(sp.why[k],'再選一次','tool');return;}
  sfx('chime');$('#bag').hidden=true;C.mood='find';const t=C.sitTarget,L0=C.sitLens,lt=sp.need==='light';
  Object.assign(C.lens,{x:L0.x,y:L0.y,r:lt?170:130,m:lt?1:2.8,kind:lt?'light':'mag',show:true,tx:null});
  say(lt?'對，先讓它變亮！':'對，用放大鏡！',sp.instr,lt?'light':'mag');
  setTask({type:'lens',at:t,ring:90,cap:(x,y)=>Math.hypot(x-t.x,y-t.y)<(lt?110:80),hint2:sp.id==='dark'?'鑰匙在地上，慢慢照。':sp.id==='med'?'小字在藥袋中間。':'看看手指的指尖。',onFound:()=>{
    const sn=snap(t.x,t.y,lt?70:sp.id==='med'?54:26);setTask(null);C.found=true;sfx('chime');C.mood='done';obsShow(sn,sp.done(sp.n),t.x>800?'L':'R');bookAdd(C.sit,sn,sp.book);
    say(lt?'變亮就看到了！':'放大就看清楚了！','看清楚了，按「'+(C.sit<2?'下一個':'完成')+'」','check');
    prim(C.sit<2?'下一個':'完成',()=>{C.sit++;if(C.sit<3)sit3();else endL3();});}});}
function endL3(){C.lens.show=false;C.mood='done';prim(null);say('工具都選對了！','要看清楚小小的細節，就用放大鏡','mag','done');
  endPanel('選工具：完成！',['小字','鑰匙','小刺'],'要看清楚小小的細節，用放大鏡；太暗了，先用手電筒。<br>下一次：用放大鏡觀察自己的指紋。',[['回到第一關',()=>{SEED++;startL1(true);},1],['再玩一次',()=>{SEED++;startL3();}]]);}

/* ================= 頂列、設定 ================= */
$$('.lv').forEach(b=>b.onclick=()=>{unlock();sfx('pop');const v=+b.dataset.lv;[startL1,startL2,startL3][v-1]();});
$('#hintBtn').onclick=hint;$('#replay').onclick=()=>{unlock();speak(C.lastSpeech);if(!G.voice){$('#instr').animate?.([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:400});}};
function syncSeg(){$$('.seg').forEach(s=>{const k=s.dataset.k,v=G[k];s.querySelectorAll('button').forEach(b=>{const bv=b.dataset.v,cur=typeof v==='boolean'?(v?'1':'0'):String(v);b.setAttribute('aria-pressed',bv===cur?'true':'false');});});}
$$('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k,v=b.dataset.v;G[k]=k==='mode'?v:k==='opts'?+v:v==='1';saveG();syncSeg();sfx('pop');
  if(k==='voice'&&!G.voice)try{speechSynthesis.cancel();}catch(e){}
  if(k==='mode'&&!$('#guess').hidden){C.picked=null;$$('.gcard').forEach(x=>{x.setAttribute('aria-pressed','false');x.classList.remove('no');const p=x.querySelector('.pk');if(p)p.remove();});guessPrim();}
  if(k==='opts'&&G.lv===2)startL2();});
$('#setBtn').onclick=e=>{e.stopPropagation();const p=$('#pop');p.hidden=!p.hidden;$('#setBtn').setAttribute('aria-expanded',String(!p.hidden));syncSeg();};
document.addEventListener('pointerdown',e=>{const p=$('#pop');if(!p.hidden&&!e.target.closest('#pop')&&!e.target.closest('#setBtn')){p.hidden=true;$('#setBtn').setAttribute('aria-expanded','false');}});
$('#restart').onclick=()=>{$('#pop').hidden=true;[startL1,startL2,startL3][G.lv-1]();};
$('#newClues').onclick=()=>{$('#pop').hidden=true;SEED++;[startL1,startL2,startL3][G.lv-1](true);};
fit();startL1();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{base=null;});
window.__micro={G,C,start:[()=>startL1(),()=>startL2(),()=>startL3()],tapAt,L1:()=>L1,lensTo:(x,y)=>{C.lens.x=x;C.lens.y=y;C.moved=true;},LW,LH};
</script>
