<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>嗶一聲就知道 MV｜溫度特勤隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--page:#0b0f14;--ink:#eef3f8;--btn:#18202a;--btn-ink:#eef3f8;--line:#2c3a4a;--g:#36e27a;--r:#ff4a5c;--y:#ffd94a;--c:#3fd8ff;--muted:#9fb1c3}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:90px}
.app{max-width:1180px;margin:0 auto;padding:12px 16px 20px}
.back{position:fixed;left:14px;top:12px;z-index:30;font:900 17px "Noto Sans TC",sans-serif;text-decoration:none;color:#fff;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:7px 14px}
h1{font-weight:900;font-size:clamp(20px,4vw,30px);margin:4px 4px 10px 120px;letter-spacing:.04em}
h1 em{font-family:"Bungee",sans-serif;font-style:normal;color:var(--g);font-size:.66em;margin-left:.5em;letter-spacing:.06em}
.wrap{position:relative;width:100%;max-width:max(320px,calc((100vh - 300px)*16/9));margin:0 auto;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#05080c;box-shadow:0 0 0 2px #1d2a38,0 14px 40px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.wrap:fullscreen{max-width:none;border-radius:0;background:#000}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;font-weight:900}
.L{position:absolute;inset:0}
#fx{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 0%,#17324a,#06090d 72%)}
.floorw{position:absolute;left:-400px;right:-400px;top:440px;bottom:0;perspective:420px;overflow:hidden}
.floor{position:absolute;left:0;right:0;bottom:0;height:1600px;transform-origin:50% 100%;transform:rotateX(72deg);
  background-image:linear-gradient(rgba(63,216,255,.55) 3px,transparent 3px),linear-gradient(90deg,rgba(54,226,122,.45) 3px,transparent 3px);background-size:120px 120px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);mask-image:linear-gradient(180deg,transparent,#000 40%)}
.sun{position:absolute;left:50%;top:300px;width:520px;height:260px;margin-left:-260px;border-radius:260px 260px 0 0;background:linear-gradient(180deg,#ffd94a,#ff4a5c 70%);opacity:.22;filter:blur(2px)}
.eq{position:absolute;left:90px;right:90px;bottom:0;height:170px;display:flex;align-items:flex-end;gap:12px;opacity:.38}
.eq i{flex:1;border-radius:10px 10px 0 0;background:linear-gradient(0deg,#36e27a,#3fd8ff 60%,#ff6fb5)}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #3fd8ff}
#fxbg{position:absolute;inset:0;overflow:hidden}#fxbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;filter:saturate(1.15) contrast(1.05)}
#fxbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,13,.55),rgba(6,9,13,.82) 75%)}
#wipe{position:absolute;top:-200px;bottom:-200px;width:1100px;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,#36e27a 18%,#3fd8ff 50%,#ffd94a 82%,transparent);opacity:0;pointer-events:none;z-index:4}
#dancer{position:absolute;left:1390px;top:560px;width:170px;z-index:3;opacity:0;transform-origin:50% 100%}#dancer svg{width:100%;height:auto;display:block}
.bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 30% 20%,#132538,#06090d 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(63,216,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(63,216,255,.07) 2px,transparent 2px);background-size:80px 80px}
.ph{position:absolute;left:40px;top:118px;width:1000px;height:563px;border-radius:26px;overflow:hidden;box-shadow:0 0 0 5px #fff,0 26px 60px rgba(0,0,0,.6)}
.ph .in{position:absolute;inset:0;transform-origin:50% 50%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.full{position:absolute;inset:0;overflow:hidden}.full .in{position:absolute;inset:0}.full img{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.7))}
.sec{position:absolute;left:28px;top:24px;background:rgba(0,0,0,.6);color:#fff;font-size:34px;padding:6px 26px;border-radius:999px;box-shadow:0 0 0 3px var(--g),0 0 22px rgba(54,226,122,.5);letter-spacing:.06em}
.side{position:absolute;left:1070px;top:118px;width:500px;height:563px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.num{width:250px;height:250px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Bungee",sans-serif;font-size:180px;line-height:1;color:#06090d;background:var(--y);box-shadow:0 0 0 10px rgba(255,217,74,.25),0 0 60px rgba(255,217,74,.6)}
.word{font-size:78px;line-height:1.15;color:#fff;text-shadow:0 0 18px rgba(63,216,255,.7);letter-spacing:.06em}

.neon{color:#fff;-webkit-text-stroke:0;text-shadow:0 0 10px var(--nc,#3fd8ff),0 0 30px var(--nc,#3fd8ff),0 0 60px var(--nc,#3fd8ff)}
.eng{font-family:"Bungee",sans-serif;letter-spacing:.06em}
.tag{position:absolute;background:#fff;color:#111;border-radius:999px;padding:6px 22px;font-size:40px;box-shadow:0 8px 20px rgba(0,0,0,.4);white-space:nowrap;transform-origin:50% 50%}
.cross{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:8px solid var(--r);box-shadow:0 0 18px var(--r)}
.cross::before,.cross::after{content:"";position:absolute;background:var(--r)}
.cross::before{left:50%;top:-30px;bottom:-30px;width:8px;margin-left:-4px}.cross::after{top:50%;left:-30px;right:-30px;height:8px;margin-top:-4px}
.ring{position:absolute;border-radius:50%;border:10px solid var(--g);transform:translate(-50%,-50%);pointer-events:none}
.lcd{display:inline-flex;align-items:center;justify-content:center;background:#a8f09a;color:#0b1a0b;border:12px solid #dfe6ea;border-radius:34px;font-family:"Consolas","Courier New",monospace;font-weight:900;box-shadow:inset 0 0 30px rgba(0,60,0,.35),0 24px 50px rgba(0,0,0,.6)}
.gunlcd{position:absolute;font-family:"Consolas","Courier New",monospace;font-weight:900;color:#062b0a;text-align:center;transform:skewY(-4deg)}
.big{font-size:150px;letter-spacing:.04em}
.chars{display:flex;gap:6px;justify-content:center}
.chars span{display:inline-block;font-size:120px;color:#fff;opacity:.18;transform-origin:50% 80%}
.chars span.on{opacity:1;color:var(--y);text-shadow:0 0 24px rgba(255,217,74,.7)}
.ruler{position:absolute;left:160px;width:1280px;height:120px;border-radius:60px;overflow:hidden;display:flex;box-shadow:0 0 0 6px #fff,0 20px 50px rgba(0,0,0,.6)}
.ruler .gz{background:linear-gradient(90deg,#1f9d55,#36e27a);display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff}
.ruler .rz{background:linear-gradient(90deg,#ff4a5c,#c8172b);display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff}
.ticks{position:absolute;left:160px;width:1280px;height:60px;font-size:44px;color:#fff}
.ticks b{position:absolute;transform:translateX(-50%)}
.arrow{position:absolute;width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-top:66px solid #fff;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));transform:translateX(-50%)}
.reading{position:absolute;transform:translateX(-50%);font-family:"Consolas",monospace;font-size:72px;background:#fff;color:#111;border-radius:18px;padding:0 22px;white-space:nowrap}
.stamp{position:absolute;font-size:96px;padding:6px 40px;border:10px solid currentColor;border-radius:24px;transform-origin:50% 50%;background:rgba(0,0,0,.45);white-space:nowrap}
.boxes{display:flex;gap:18px;align-items:flex-end}
.boxes i{font-style:normal;width:150px;height:190px;border:8px solid #fff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-family:"Consolas",monospace;font-size:150px;color:var(--y);background:rgba(255,255,255,.06)}
.boxes i.dot{width:auto;border:0;background:none;font-size:150px;color:#fff}
.steps6{position:absolute;left:90px;right:90px;top:150px;bottom:190px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px 30px}
.st{border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 0 0 4px rgba(255,255,255,.18);display:flex;align-items:center;gap:22px;padding:0 28px;font-size:56px;white-space:nowrap;color:#fff;transform-origin:50% 50%}
.st b{font-family:"Bungee",sans-serif;font-size:90px;color:var(--y);width:92px;text-align:center}
.st.now{background:var(--y);color:#111;box-shadow:0 0 0 6px #fff,0 0 60px rgba(255,217,74,.7)}.st.now b{color:#111}
.mascot{position:absolute;width:230px}
.kara{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;pointer-events:none}
.kara div{background:rgba(5,9,14,.85);border-radius:26px;padding:8px 38px;font-size:70px;line-height:1.3;letter-spacing:.05em;white-space:nowrap;box-shadow:0 0 0 4px var(--g),0 0 30px rgba(54,226,122,.5)}
.kara span{display:inline-block;color:#fff}
.kara span.sung{color:#9ff7c0}
.kara span.now{color:var(--y);transform:translateY(-8px) scale(1.18);text-shadow:0 0 18px #ffb800}
.kara span.gap{width:28px}
.kara div.cue{font-size:46px;color:#cfe;box-shadow:0 0 0 3px var(--c)}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
.conf{position:absolute;left:0;top:0;width:22px;height:34px;border-radius:4px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(3,6,10,.72);z-index:5}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:min(9vw,84px);color:#fff;text-shadow:0 0 14px var(--g),0 0 40px var(--g);letter-spacing:.08em}
.overlay p{margin:0;font-family:"Bungee",sans-serif;color:var(--y);font-size:min(4vw,28px);letter-spacing:.2em}
.go{font-family:inherit;font-weight:900;font-size:min(5vw,40px);padding:.45em 1.4em;border-radius:999px;border:0;background:linear-gradient(90deg,#1fbf63,#3fd8ff);color:#06090d;cursor:pointer;box-shadow:0 0 26px rgba(54,226,122,.8)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--btn);color:var(--btn-ink);font-family:inherit;font-weight:900;font-size:16px;cursor:pointer;opacity:.7}
.chips button.now{opacity:1;border-color:transparent;background:linear-gradient(90deg,#1fbf63,#3fd8ff);color:#06090d}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ctl button{flex:1 1 auto;min-width:96px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--btn);color:var(--btn-ink);font-family:inherit;font-weight:900;font-size:18px;cursor:pointer}
.ctl button.main{flex:2 1 auto;background:linear-gradient(90deg,#1fbf63,#3fd8ff);color:#06090d;border-color:transparent}
.ctl button.on{box-shadow:0 0 0 3px var(--y)}
.ctl button:focus-visible,.chips button:focus-visible,.go:focus-visible{outline:3px solid var(--y);outline-offset:3px}
details{margin:14px 0 0;background:var(--btn);border:2px solid var(--line);border-radius:14px;padding:10px 16px}
summary{font-weight:900;cursor:pointer;font-size:18px}
.lyr{font-size:19px;line-height:1.9;margin:6px 0 0}
.lyr b{font-size:15px;color:var(--muted);display:block;margin-top:8px}
body.rec{padding:0;overflow:hidden}body.rec .app{max-width:none;padding:0}body.rec h1,body.rec .chips,body.rec .ctl,body.rec details,body.rec .back{display:none}
body.rec>*:not(.app):not(script):not(audio){display:none!important}
body.rec .wrap{max-width:none;width:100vw;height:100vh;border-radius:0;box-shadow:none}
@media (max-width:600px){h1{margin-left:4px;margin-top:52px}.ctl button{font-size:16px;min-width:80px}}
</style>
</head>
<body>
<a class="back" id="back" href="t2.html">⬅ 返回</a>
<div class="app">
  <h1>嗶一聲就知道<em>BEEP! MV</em></h1>
  <div class="wrap" id="wrap">
    <div id="stage">
      <div class="L" id="fx"><div id="fxbg"><img id="fxbgi" alt=""></div><div class="sun" id="sun"></div><div class="floorw"><div class="floor" id="floor"></div></div><div id="pts"></div><div class="eq" id="eq"></div></div>
      <div class="L" id="scene"></div>
      <div id="dancer"></div>
      <div id="wipe"></div>
      <div class="flash" id="flash"></div>
      <div class="sec" id="sec">🎵 前奏</div>
      <div class="kara" id="kara"></div>
    </div>
    <video id="vbox" src="files/T2-mv.mp4" controls playsinline preload="none" style="position:absolute;inset:0;width:100%;height:100%;background:#000;z-index:8;display:none"></video>
    <div class="overlay" id="ov">
      <h2>溫度特勤隊</h2>
      <p>BEEP! 嗶一聲就知道</p>
      <button class="go" id="go">▶ 開始播放</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="ctl">
    <button class="main" id="play">▶ 播放</button>
    <button id="restart">⏮ 從頭</button>
    <button id="slow">🐢 慢一點</button>
    <button id="fs">⛶ 全螢幕</button>
    <button id="vid">🎬 影片版</button>
  </div>
  <details>
    <summary>📜 看完整歌詞</summary>
    <div class="lyr" id="lyr"></div>
  </details>
  <p style="margin:12px 2px 0;font-size:16px"><a href="files/T2-mv.mp4" download style="color:var(--c);font-weight:900">⬇ 下載影片檔（沒有網路時用）</a></p>
</div>
<audio id="audio" preload="auto" src="mv/song.mp3"></audio>
<script src="../games/fx.js"></script>
<script>
(function(){
const LINES=/*DATA*/;
const MASCOT=`/*MASCOT*/`;
const EQ=/*EQ*/;
const BEAT=60/125,B0=0.13,END=174.6;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=k=>1-Math.pow(1-k,3);
const back=k=>{if(k<=0)return 0;if(k>=1)return 1;const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const lerp=(a,b,k)=>a+(b-a)*k;
const beatK=t=>{const b=(t-B0)/BEAT;return Math.pow(1-(((b%1)+1)%1),3);};
const P=new URLSearchParams(location.search);
const REC=P.get('rec')==='1';
if(P.get('back'))$('back').href=P.get('back');
if(REC)document.body.classList.add('rec');

/* ---------- 縮放 ---------- */
function fit(){const w=$('wrap').clientWidth;$('stage').style.transform=`scale(${w/1600})`;}
addEventListener('resize',fit);fit();

/* ---------- 段落（有空檔的地方插間奏） ---------- */
const SEGS=[];
LINES.forEach((ln,i)=>{SEGS.push(Object.assign({kind:'line',i},ln));
  if(ln.n-ln.e>3)SEGS.push({kind:'inter',s:ln.e,e:ln.n,n:ln.n,sec:'🎶 間奏',vis:'INTER',prev:ln.vis,next:LINES[i+1]});});
SEGS.unshift({kind:'intro',s:0,e:LINES[0].s,n:LINES[0].s,sec:'🎵 前奏',vis:'INTRO'});
function segAt(t){let k=0;for(let i=0;i<SEGS.length;i++)if(t>=SEGS[i].s-.12)k=i;return k;}

/* ---------- 卡拉 OK ---------- */
function karaHTML(ln){let h='',ci=0;const toks=ln.ch;
  for(const s of ln.ly.split(/(\s+)/)){if(!s)continue;if(/^\s+$/.test(s)){h+='<span class="gap"></span>';continue;}
    let rest=s;while(rest.length&&ci<toks.length){const tk=toks[ci][0];if(rest.startsWith(tk)){h+=`<span data-k="${ci}">${tk}</span>`;rest=rest.slice(tk.length);ci++;}else{h+=`<span>${rest[0]}</span>`;rest=rest.slice(1);}}
    if(rest)h+=`<span>${rest}</span>`;}
  return `<div>${h}</div>`;}
let karaKey=null;
function drawKara(sg,t){const box=$('kara');
  if(sg.kind==='line'){if(karaKey!==sg.i){karaKey=sg.i;box.innerHTML=karaHTML(sg);}
    const ch=sg.ch;box.querySelectorAll('span[data-k]').forEach(sp=>{const k=+sp.dataset.k,t0=ch[k][1],t1=k+1<ch.length?ch[k+1][1]:t0+.45;
      sp.className=t>=t1?'sung':t>=t0?'now':'';});}
  else{const nx=sg.kind==='intro'?LINES[0]:sg.next;const key='c'+sg.s;
    if(karaKey!==key){karaKey=key;box.innerHTML=nx?`<div class="cue">下一句：${nx.ly}</div>`:'';}
    box.style.opacity=t>sg.n-3.2||sg.kind==='intro'&&t>2?1:0;return;}
  box.style.opacity=1;}

/* ---------- 共用元件 ---------- */
const STEPS=[['撥開瀏海','💇'],['對準額頭中間','🎯'],['距離一根手指','☝️'],['按一下 聽嗶','🔊'],['整個數字讀出來','🗣️'],['記下來','✏️']];
const PH={S1:['bangs',.5,.4],S2:['forehead',.65,.22],S3:['forehead',.61,.22],S4:['gun',.41,.5]};
function photoHTML(name){return `<div class="ph"><div class="in"><img src="img/${name}.jpg" alt=""><div class="ov" style="position:absolute;inset:0"></div></div></div>`;}
function kb(el,lt,dur,z0,z1,fx,fy){const k=eo(clamp(lt/dur));const z=lerp(z0,z1,k);el.style.transformOrigin=`${fx*100}% ${fy*100}%`;el.style.transform=`scale(${z})`;}
function popEl(el,k,base){base=base||'';el.style.opacity=clamp(k*1.6);el.style.transform=`${base} scale(${Math.max(.001,back(k))})`;}
function chT(sg,i){const c=sg.ch;return c[Math.min(i,c.length-1)][1];}
function findT(sg,str){const c=sg.ch;let acc='';for(let i=0;i<c.length;i++){if(c[i][0].startsWith(str[0])&&c.slice(i).map(x=>x[0]).join('').startsWith(str))return c[i][1];}return sg.s;}
const RX=v=>160+(v-35)/4*1280; /* 溫度尺 35～39 */
function rulerHTML(top){return `<div class="ruler" style="top:${top}px"><div class="gz" style="width:${(37.5-35)/4*100}%">✅ 正常</div><div class="rz" style="flex:1">🙋 告訴老師</div></div>
  <div class="ticks" style="top:${top+132}px">${[35,36,37,38,39].map(v=>`<b style="left:${RX(v)-160}px">${v}</b>`).join('')}<b style="left:${RX(37.5)-160}px;color:var(--y)">37.5</b></div>
  <div class="arrow" id="arw" style="top:${top-78}px;left:${RX(36.8)}px"></div><div class="reading" id="rd" style="top:${top-170}px;left:${RX(36.8)}px">36.8</div>`;}
function confetti(n){let h='';let s=7;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const x=s/233280*1600;s=(s*9301+49297)%233280;const d=s/233280;
  h+=`<div class="conf" data-x="${x.toFixed(0)}" data-d="${d.toFixed(3)}" style="background:${['#36e27a','#ffd94a','#3fd8ff','#ff4a5c','#fff'][i%5]}"></div>`;}return h;}
function drawConf(root,lt){root.querySelectorAll('.conf').forEach(c=>{const d=+c.dataset.d,x=+c.dataset.x;const y=-60+(lt*(260+d*240)+d*400)%1000;c.style.transform=`translate(${x+Math.sin(lt*3+d*9)*40}px,${y}px) rotate(${lt*200*(d-.5)}deg)`;});}

/* ---------- 場景 ---------- */
const SC={};
SC.INTRO={html:()=>`<div class="full"><div class="in" id="kbI"><img src="img/team.jpg" alt=""></div><div class="shade"></div></div>
  <div style="position:absolute;left:0;right:0;top:250px;text-align:center"><div class="neon eng" id="i1" style="--nc:#36e27a;font-size:120px">BEEP!</div>
  <div class="neon" id="i2" style="--nc:#3fd8ff;font-size:96px;margin-top:10px">嗶一聲就知道</div></div>`,
  draw(sg,t,root){kb($('kbI'),t,12,1.15,1,.5,.4);popEl($('i1'),seg(t,1,1.6));popEl($('i2'),seg(t,2.2,2.8));}};

SC.S2=stepScene(2,(sg,t,root)=>{const ov=root.querySelector('.ph .ov');if(!ov.innerHTML)ov.innerHTML=`<div class="cross" id="x2" style="left:650px;top:122px"></div><div class="tag" id="x3" style="left:700px;top:200px">額頭中間</div>`;

SC.S3=stepScene(3,(sg,t,root)=>{const ov=root.querySelector('.ph .ov');if(!ov.innerHTML)ov.innerHTML=`<div style="position:absolute;left:596px;top:96px;width:36px;height:52px;border:6px solid var(--y);border-top:0;border-bottom:0" id="x4"></div><div class="tag" id="x5" style="left:420px;top:190px">☝️ 一根手指</div>`;
  const tz=findT(sg,'一根');popEl($('x4'),seg(t,tz-.2,tz+.2));popEl($('x5'),seg(t,tz,tz+.35));});
SC.S4=stepScene(4,(sg,t,root)=>{const ov=root.querySelector('.ph .ov');if(!ov.innerHTML)ov.innerHTML=`<div class="gunlcd" id="g1" style="left:356px;top:262px;width:118px;font-size:52px;line-height:60px">36.8</div><div id="rgs"></div>`;
  const tb=findT(sg,'按'),td=findT(sg,'數');$('g1').style.opacity=t>=td?1:0;popEl($('g1'),seg(t,td,td+.3),'skewY(-4deg)');
  $('rgs').innerHTML=[0,1,2].map(i=>{const k=seg(t,tb+i*.18,tb+i*.18+.9);return k>0&&k<1?`<div class="ring" style="left:415px;top:282px;width:${80+k*420}px;height:${80+k*420}px;opacity:${1-k}"></div>`:'';}).join('');});
SC.S5={html:()=>`<div class="side" style="left:0;width:1600px;top:120px;height:600px">
  <div class="num" id="nm" style="width:170px;height:170px;font-size:120px">5</div><div class="lcd big" id="lc" style="padding:0 60px">36.9</div><div class="chars" id="cs"><span>三</span><span>十</span><span>六</span><span>點</span><span>九</span><span>度</span></div></div>`,
  draw(sg,t,root){const lt=t-sg.s;popEl($('nm'),seg(lt,-.1,.3));popEl($('lc'),seg(lt,.3,.7));const a=findT(sg,'從'),b=sg.e;root.querySelectorAll('#cs span').forEach((s,i)=>{const on=t>=a+(b-a)*i/6;s.className=on?'on':'';s.style.transform=on?`scale(${1+.15*(1-seg(t,a+(b-a)*i/6,a+(b-a)*i/6+.3))})`:'';});}};
SC.S5b={html:()=>`<div class="side" style="left:0;width:1600px;top:110px;height:600px">

  draw(sg,t,root){const cs=$('cs');if(!cs.innerHTML)cs.innerHTML=sg.ch.slice(0,5).map(c=>`<span>${c[0]}</span>`).join('');
    cs.querySelectorAll('span').forEach((s,i)=>{const t0=sg.ch[i][1];const k=seg(t,t0-.05,t0+.25);s.className=t>=t0?'on':'';s.style.transform=`translateY(${(1-eo(k))*-140}px) rotate(${(1-k)*-20}deg)`;});

  <div class="num" id="nm" style="width:170px;height:170px;font-size:120px">6</div><div class="boxes" id="bx"><i></i><i></i><i class="dot">.</i><i></i><span style="font-size:90px;color:#fff;margin-left:8px">度</span></div><div class="hint" id="hn" style="font-size:44px">✏️ 寫進表格裡</div></div>`,
  draw(sg,t,root){const lt=t-sg.s;popEl($('nm'),seg(lt,-.1,.3));const a=findT(sg,'記'),b=sg.e-.4;const v=['3','6',null,'8'];

function rulerScene(kind){return{html:()=>`${rulerHTML(430)}<div class="stamp" id="sp" style="left:560px;top:64px;font-size:84px"></div>`,
  draw(sg,t,root){const lt=t-sg.s;let v=36.8,lab='',col='',tL=0;
    if(kind==='OK'){v=lerp(35.4,36.8,eo(seg(lt,0,1.2)));const tz=findT(sg,'正常');if(t>=tz){lab='✅ 正常';col='var(--g)';tL=tz;}}
    else if(kind==='TELL'){const t0=sg.s,tY=findT(sg,'以上');v=t<tY?lerp(36.8,37.5,eo(seg(t,t0,tY))):lerp(37.5,37.9,eo(seg(t,tY,tY+.6)));const tz=findT(sg,'告訴');if(t>=tz-.2){lab='🙋 告訴老師';col='var(--r)';tL=tz-.2;}}
    else{const tg=findT(sg,kind==='RULER'?'綠色':'綠'),tr=findT(sg,kind==='RULER'?'紅色':'紅');v=t<tr-.2?lerp(36.0,36.6,eo(seg(t,tg-.4,tg+.4))):lerp(36.6,38.2,eo(seg(t,tr-.2,tr+.6)));
      if(t>=tr-.1){lab=kind==='RULER'?'🙋 舉手':'🙋 告訴老師';col='var(--r)';tL=tr-.1;}else if(t>=tg-.1){lab=kind==='RULER'?'✅ OK':'✅ 正常';col='var(--g)';tL=tg-.1;}}
    const x=RX(v);$('arw').style.left=x+'px';$('rd').style.left=x+'px';$('rd').textContent=v.toFixed(1);$('rd').style.background=v>=37.5?'#ffd0d5':'#d5ffe2';
    const sp=$('sp');if(sp.dataset.l!==lab){sp.dataset.l=lab;sp.textContent=lab;sp.style.color=col;}
    if(lab){popEl(sp,seg(t,tL,tL+.35),'rotate(-6deg)');sp.style.left=(800-sp.offsetWidth/2)+'px';}else sp.style.opacity=0;}};}
SC.OK=rulerScene('OK');SC.TELL=rulerScene('TELL');SC.RULER=rulerScene('RULER');SC.RULER2=rulerScene('RULER2');
SC.DOT={html:()=>`<div class="side" style="left:0;width:1600px;top:100px;height:620px">

SC.BEEP={html:()=>`<div id="rgs"></div><div class="side" style="left:0;width:1600px;top:100px;height:620px">

  draw(sg,t,root){const tb=sg.s;popEl($('bp'),seg(t,tb-.05,tb+.3),`scale(${1+.08*beatK(t)})`);popEl($('lc'),seg(t,findT(sg,'知')-.1,findT(sg,'知')+.3));
    $('flash').style.opacity=.55*(1-seg(t,tb,tb+.25))*(t>=tb?1:0);
    $('rgs').innerHTML=[0,1,2,3].map(i=>{const k=seg(t,tb+i*.22,tb+i*.22+1.1);return k>0&&k<1?`<div class="ring" style="left:800px;top:330px;width:${200+k*1300}px;height:${200+k*1300}px;opacity:${1-k}"></div>`:'';}).join('');}};
SC.READ={html:()=>`<div class="side" style="left:0;width:1600px;top:90px;height:640px">
  <div class="lcd big" id="lc" style="padding:0 60px">36.8</div><div style="display:flex;align-items:center;gap:20px"><span id="mg" style="font-size:120px">📢</span><div class="chars" id="cs"><span>三</span><span>十</span><span>六</span><span>點</span><span>八</span><span>度</span></div></div></div>`,
  draw(sg,t,root){const a=findT(sg,'大聲'),b=sg.e;$('mg').style.transform=`scale(${1+.2*beatK(t)}) rotate(-10deg)`;root.querySelectorAll('#cs span').forEach((s,i)=>{const ti=a+(b-a)*i/6;s.className=t>=ti?'on':'';});}};
function quick(n){return{html:()=>`<div class="steps6" style="top:110px">${STEPS.map((s,i)=>`<div class="st${i===n-1?' now':''}" data-i="${i}"><b>${i+1}</b>${s[1]} ${s[0]}</div>`).join('')}</div>`,
  draw(sg,t,root){const lt=t-sg.s;root.querySelectorAll('.st').forEach((e,i)=>{if(i<n-1){e.style.opacity=.55;e.style.transform='';}else if(i===n-1){e.style.opacity=1;e.style.transform=`scale(${1+.18*(1-eo(seg(lt,0,.35)))+.04*beatK(t)})`;}else{e.style.opacity=.25;e.style.transform='';}});}};}
for(let n=1;n<=6;n++)SC['Q'+n]=quick(n);
SC.INTER={html:sg=>`<div style="position:absolute;left:0;right:0;top:40px;text-align:center"><span class="neon" style="--nc:#ffd94a;font-size:66px">🎶 跟著音樂，複習六步驟</span></div>
  <div class="steps6" style="top:150px">${STEPS.map((s,i)=>`<div class="st" data-i="${i}"><b>${i+1}</b>${s[1]} ${s[0]}</div>`).join('')}</div>`,
  draw(sg,t,root){const lt=t-sg.s;const k=Math.floor((lt/BEAT)/4)%6;root.querySelectorAll('.st').forEach((e,i)=>{e.classList.toggle('now',i===k);e.style.transform=i===k?`scale(${1.04+.03*beatK(t)})`:'';});}};
SC.END={html:()=>`<div class="full"><div class="in" id="kbE"><img src="img/mv-win.jpg" alt=""></div><div class="shade"></div></div>
  <div class="stamp" id="sp" style="left:400px;top:220px;color:var(--y);font-size:130px">任務完成！</div>
  <div class="mascot" id="msc" style="left:1300px;top:420px">${MASCOT}</div><div id="cf">${confetti(60)}</div>`,
  draw(sg,t,root){const lt=t-sg.s;kb($('kbE'),lt,6,1,1.12,.5,.4);const tz=findT(sg,'任務');popEl($('sp'),seg(t,tz-.1,tz+.4),'rotate(-6deg)');
    $('msc').style.transform=`translateY(${-40*beatK(t)}px) rotate(${Math.sin(t*5)*8}deg)`;$('cf').style.opacity=t>=tz?1:0;drawConf($('cf'),t-tz);}};

/* ---------- 動態背景：霓虹地板、等化器（真實音樂）、粒子、節拍鏡頭、轉場、吉祥物跳舞 ---------- */
$('eq').innerHTML='<i></i>'.repeat(EQ.n);$('dancer').innerHTML=MASCOT;
let pts='';for(let i=0;i<34;i++)pts+='<div class="pt"></div>';$('pts').innerHTML=pts;
function eqAt(t){const f=t*EQ.fps,i=Math.max(0,Math.min(Math.floor(f),EQ.d.length/EQ.n-2)),r=clamp(f-i);const o=[];
  for(let b=0;b<EQ.n;b++){const a=+EQ.d[i*EQ.n+b],c=+EQ.d[(i+1)*EQ.n+b];o.push((a+(c-a)*r)/9);}return o;}
const BG={title2:'mv-walk',S5:'mv-read',S5b:'mv-read',S6:'mv-write',DOT:'mv-beep',DOT2:'mv-beep',BEEP:'mv-beep',READ:'mv-read',OK:'mv-ok',TELL:'mv-hand',RULER:'mv-ok',RULER2:'mv-hand',INTER:'mv-dance',Q1:'mv-dance',Q2:'mv-dance',Q3:'mv-dance',Q4:'mv-dance',Q5:'mv-dance',Q6:'mv-dance'};
[...new Set(Object.values(BG).concat(['mv-walk','mv-win']))].forEach(n=>{const im=new Image();im.src='img/'+n+'.jpg';});
function drawFX(sg,t){
  const bn=BG[sg.vis],bi=$('fxbgi');if(bn){const src='img/'+bn+'.jpg';if(bi.dataset.s!==src){bi.dataset.s=src;bi.src=src;}bi.style.opacity=1;const kz=1.04+.1*eo(seg(t,sg.s-.2,(sg.n||sg.e)+.2));bi.style.transform=`scale(${kz}) translateX(${(seg(t,sg.s,sg.n||sg.e)-.5)*-30}px)`;}else bi.style.opacity=0;
  const B=(t-B0)/BEAT,bk=beatK(t),hot=/副歌|快問快答/.test(sg.sec||'');
  $('floor').style.backgroundPosition=`0 ${(B*60)%120}px`;
  const e=eqAt(t);$('eq').querySelectorAll('i').forEach((el,i)=>{const v=e[i];el.style.height=(6+v*160)+'px';});
  const avg=e.reduce((a,b)=>a+b,0)/e.length;$('sun').style.opacity=.14+.22*avg;$('sun').style.transform=`scale(${1+.08*bk})`;
  $('pts').querySelectorAll('.pt').forEach((p,i)=>{const sp=40+(i*37)%70,x=(i*173)%1600,y=900-((t*sp+i*97)%1000);p.style.transform=`translate(${x+Math.sin(t+i)*30}px,${y}px) scale(${.5+((i*7)%10)/10})`;p.style.opacity=.25+.5*avg;});
  // 節拍鏡頭：每拍輕推、副歌加一點晃動
  const sh=hot?Math.sin(B*7.3)*5*bk:0;$('scene').style.transform=`translate(${sh}px,${hot?Math.cos(B*5.1)*3*bk:0}px) scale(${1+(hot?.022:.01)*bk})`;
  // 轉場：彩色斜切掃過
  const w=seg(t,sg.s-.32,sg.s+.08);const wp=$('wipe');if(w>0&&w<1&&sg.kind!=='intro'){wp.style.opacity=1;wp.style.left=lerp(-1500,1900,eo(w))+'px';}else wp.style.opacity=0;
  // 吉祥物跳舞（副歌、快問快答）
  const dn=sg.vis==='BEEP'||sg.vis==='READ';const d=$('dancer');d.style.opacity=dn?1:0;
  if(dn)d.style.transform=`translateY(${-46*bk}px) rotate(${Math.sin(B*Math.PI)*12}deg) scale(${1+.1*bk},${1-.06*bk})`;
}

/* ---------- 主繪製 ---------- */
let curSeg=-1;
function render(t){
  const k=segAt(t),sg=SEGS[k];
  if(k!==curSeg){curSeg=k;const sc=SC[sg.vis]||SC.INTER;$('scene').innerHTML=sc.html(sg);$('sec').textContent=sg.sec;$('flash').style.opacity=0;karaKey=null;
    if(sg.kind==='line'){const sk=secKey(sg);document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('now',b.dataset.k===sk));}}
  (SC[sg.vis]||SC.INTER).draw(sg,t,$('scene'));
  drawKara(sg,t);drawFX(sg,t);
}
window.__mv={render,SEGS,END};

/* ---------- 控制 ---------- */
const au=$('audio');
const SECS=[];let lastSec=null;
LINES.forEach(ln=>{if(ln.sec!==lastSec){SECS.push({sec:ln.sec,s:ln.s});lastSec=ln.sec;}});
function secKey(sg){let k='';SECS.forEach((x,i)=>{if(sg.s>=x.s-.01)k=String(i);});return k;}
$('chips').innerHTML=SECS.map((x,i)=>`<button data-k="${i}" data-s="${x.s}">${x.sec}</button>`).join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;au.currentTime=Math.max(0,+b.dataset.s-1.2);start();});
let vmode=false;
function videoMode(on){vmode=on;const v=$('vbox');v.style.display=on?'block':'none';$('vid').textContent=on?'🎵 回網頁版':'🎬 影片版';
  if(on){au.pause();$('ov').hidden=true;v.play().catch(()=>{});}else v.pause();}
function start(){if(vmode){$('vbox').play().catch(()=>{});return;}$('ov').hidden=true;
  const pr=au.play();if(pr&&pr.catch)pr.catch(()=>{videoMode(true);});}
au.addEventListener('error',()=>{if(!$('ov').hidden)return;videoMode(true);});
$('go').onclick=start;
$('play').onclick=()=>{if(vmode){const v=$('vbox');v.paused?v.play():v.pause();return;}if(au.paused)start();else au.pause();};
$('vid').onclick=()=>videoMode(!vmode);
$('restart').onclick=()=>{if(vmode){$('vbox').currentTime=0;$('vbox').play();return;}au.currentTime=0;start();};
$('slow').onclick=()=>{const s=au.playbackRate===1;au.playbackRate=s?.85:1;au.preservesPitch=true;$('slow').classList.toggle('on',s);$('slow').textContent=s?'🐇 正常速度':'🐢 慢一點';};
$('fs').onclick=()=>{const w=$('wrap');if(document.fullscreenElement)document.exitFullscreen();else(w.requestFullscreen||w.webkitRequestFullscreen).call(w);};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,60));
au.addEventListener('play',()=>$('play').textContent='⏸ 暫停');
au.addEventListener('pause',()=>$('play').textContent='▶ 播放');
au.addEventListener('ended',()=>{$('play').textContent='▶ 再播一次';try{FX.confetti(80);}catch(e){}});
$('wrap').addEventListener('click',e=>{if(e.target.closest('.overlay')||vmode)return;if(au.paused)start();else au.pause();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click();}});
/* 完整歌詞 */
let h='',ls=null;LINES.forEach(ln=>{if(ln.sec!==ls){h+=`<b>${ln.sec}</b>`;ls=ln.sec;}h+=ln.ly+'<br>';});$('lyr').innerHTML=h;

if(!REC){render(0);(function loop(){render(au.currentTime);requestAnimationFrame(loop);})();}
else{$('ov').hidden=true;render(0);}
})();
</script>
