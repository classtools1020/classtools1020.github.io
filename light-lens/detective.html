<style>
/* 竹東國中手繪地圖 + 一支可拖曳的放大鏡（鏡片內即時放大／縮小／倒過來）；偵探深棕＋金色面板 */
:root{
  --ink:#241b14; --panel:#33261b; --line:#6b5440; --paper:#fbf6ea; --mute:#c7b49a;
  --gold:#f2c14e; --amber:#e58a00; --red:#c8372d; --wood:#8b5e3c; --teal:#2f8a8a;
  --display:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{background:linear-gradient(#3d2d20,var(--panel));padding:8px 16px;display:flex;flex-direction:column;gap:7px;border-bottom:4px solid var(--wood)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ttl{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1;display:flex;align-items:center;gap:8px}
.ttl small{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:700}
.nav{font-size:13px;font-weight:900;color:var(--paper);text-decoration:none;border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.hud-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--display);font-size:16px;padding:5px 10px;border-radius:12px;background:#1d150f;border:1.5px solid var(--line);color:var(--paper);white-space:nowrap;font-variant-numeric:tabular-nums}
.tg{background:transparent;border:1.5px solid var(--line);color:var(--paper);border-radius:10px;padding:5px 8px;font-size:13px;font-weight:700}
.tg[aria-pressed="false"]{color:var(--mute);border-style:dashed}
.acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:none;font-size:14px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute);font-weight:900;background:transparent}
.act.on{background:var(--gold);color:#2a1c05;border-color:var(--gold)}
.act.done{color:var(--paper);border-color:#7ccf7f}
#mapwrap{flex:1;min-height:0;position:relative;background:#6e9a57;overflow:hidden}
canvas#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
footer{background:linear-gradient(var(--panel),#2a1f16);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--wood);display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:64px}
.task{flex:1;min-width:220px;display:flex;align-items:center;gap:10px}
.task .ic{font-size:30px;width:50px;height:50px;display:grid;place-items:center;background:#1d150f;border-radius:14px;border:2px solid var(--gold);flex:none}
.task b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--gold);display:block;line-height:1.25}
.task small{display:block;font-size:13px;color:var(--mute);font-weight:700}
.btn{border:none;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:900;background:var(--gold);color:#2a1c05;box-shadow:0 4px 0 #a37f22}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a37f22}
.btn.ghost{background:#1d150f;color:var(--paper);box-shadow:0 4px 0 #0d0906;border:2px solid var(--line)}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans button{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:3px solid #d8c9ad;border-radius:16px;padding:6px 14px;font-weight:900;font-size:18px}
.ans button svg{width:46px;height:46px}
.ans button.no{opacity:.45;border-color:var(--red)}
.slider{flex:1;min-width:260px;display:flex;flex-direction:column;gap:4px}
.slider input{width:100%;height:36px;accent-color:var(--gold)}
.slider .lb{display:flex;justify-content:space-between;font-size:14px;font-weight:900;color:var(--mute)}
#sheet{position:fixed;inset:0;background:rgba(15,10,6,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.card{background:var(--paper);color:var(--ink);width:100%;max-width:760px;border-radius:24px;border:6px solid var(--wood);padding:18px;max-height:96%;overflow-y:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:12px}
@keyframes pop{from{transform:scale(.85);opacity:.3}}
.card .kick{font-size:14px;font-weight:900;color:var(--amber);letter-spacing:.08em}
.card h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1.2;text-wrap:balance}
.card p{margin:0;font-size:20px;font-weight:700;line-height:1.55}
.split{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.split .ph{flex:1;min-width:220px}
.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;border:5px solid #fff;box-shadow:0 8px 20px rgba(40,25,10,.3);transform:rotate(-1.2deg)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:900;font-size:18px;text-align:center}
.koko{position:relative;display:inline-block;flex:none}.koko .kb{display:none!important}
.big{font-size:90px;line-height:1;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{background:#fff;border:3px solid #d8c9ad;border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:900;font-size:19px}
.opt .e{font-size:46px;line-height:1.1}
.opt.ok{border-color:#58b85c;background:#e4f6e4}.opt.no{border-color:var(--red);background:#fde8e0;opacity:.6}
.fb{font-size:19px;font-weight:900;min-height:1.4em;margin:0;text-align:center}
.fb.good{color:#2f8a34}.fb.bad{color:#c4471d}
.sum{display:grid;gap:8px}
.sum div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:8px 14px;font-size:21px;font-weight:900}
.sum div svg{width:52px;height:52px;flex:none}
.sum b{color:var(--red)}
#popup{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;background:var(--paper);color:var(--ink);border:4px solid var(--gold);border-radius:20px;padding:10px 16px 10px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px rgba(0,0,0,.4);max-width:calc(100% - 32px);animation:pop .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#popup>div{flex:1;min-width:0}
#popup{width:min(620px,calc(100% - 32px));box-sizing:border-box}
#popup img{width:120px;flex:none;aspect-ratio:16/10;object-fit:cover;border-radius:10px}
#popup .pe{font-size:52px;width:72px;text-align:center}
#popup b{display:block;font-family:var(--display);font-weight:400;font-size:22px}
#popup span{font-size:16px;font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx i{position:absolute;width:10px;height:14px;border-radius:2px}
.cover{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% -10%,#7a5a36,#3a2a1c 55%,var(--ink));display:flex;justify-content:center;padding:24px 16px;overflow-y:auto}
.cover-in{max-width:620px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;margin:auto 0}
.cover h1{font-family:var(--display);font-weight:400;font-size:48px;margin:0;color:var(--gold);text-shadow:0 3px 0 #2a1a08;text-wrap:balance}
.cover p{margin:0;font-size:19px;line-height:1.6}
.cover .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.cover .three div{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:16px;padding:10px 6px;font-weight:900;font-size:16px}
.cover .three span{display:block;font-size:30px}
.cert{background:var(--paper);color:var(--ink);border-radius:24px;padding:18px;border:6px double var(--gold);display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.cert h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0}
.found{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:34px}
@media (max-width:560px){#popup img{width:80px}#popup .pe{width:56px;font-size:40px}#popup b{font-size:18px}#popup span{font-size:14px}.ttl{font-size:21px}.card h2{font-size:26px}.card p{font-size:17px}.cover h1{font-size:36px}}
@media (prefers-reduced-motion:reduce){.card,#popup{animation:none}}
</style>

  <h1>放大鏡偵探</h1>
  <p>竹東國中出現了好多「眼睛看不到」的小線索！<br>光光偵探借你一支放大鏡，一起來搜查。</p>
  <div class="three"><div><span>🐞</span>① 找小東西</div><div><span>❓</span>② 神秘鏡片</div><div><span>🙃</span>③ 倒過來魔術</div></div>

<script>
const SITE=true;
const IMG={"ladybug": "img/sm/ladybug.jpg", "magnifier": "img/sm/magnifier.jpg", "peepview": "img/sm/peepview.jpg", "projflip": "img/sm/projflip.jpg"};
const $=s=>document.querySelector(s);
if(!SITE)document.querySelectorAll('.site').forEach(e=>e.hidden=true);
const W=30,H=49,T=40;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const hash=(x,y)=>(((x*73856093)^(y*19349663))>>>0)%100003;
const inR=(x,y,r)=>x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3];
const ROADS=[[3,22,26,1],[3,30,26,1],[3,35,26,2],[7,10,1,6],[7,19,1,11],[18,35,1,13],[24,22,2,26],[3,47,26,1],[3,33,2,2]];
const BLD=[
 {id:'gym',name:'活動中心',r:[4,2,6,8],roof:'#7f9a62',doors:[{d:[7,9],s:[7,10]}]},
 {id:'stage',name:'司令台',r:[10,5,2,4],roof:'#a48b72',doors:[],small:1},
 {id:'qinxue',name:'勤學樓',r:[3,12,4,15],roof:'#5f87b5',doors:[{d:[6,19],s:[7,19],sign:'美術教室',fun:'這是勤學樓的美術教室，畫畫的地方 🎨'}]},
 {id:'tkd',name:'跆拳教室',r:[7,16,5,3],roof:'#b55f4f',doors:[{d:[9,18],s:[9,19],fun:'跆拳教室，嘿！哈！🥋'}]},
 {id:'wc',name:'洗手台',r:[13,16,2,2],roof:'#7a9fae',doors:[{d:[13,17],s:[13,18]}],small:1,sinks:1},
 {id:'yangcai',name:'揚才樓',r:[18,23,6,6],roof:'#4f8f7a',doors:[{d:[18,26],s:[17,26],sign:'自然教室'}]},
 {id:'qilin',name:'杞林樓',r:[8,31,15,4],roof:'#8a73b0',doors:[{d:[15,31],s:[15,30],sign:'圖書館',fun:'圖書館要安靜唷 🤫'},{d:[12,34],s:[12,35],sign:'校長室',fun:'校長室！跟校長問聲好 👋'}]},
 {id:'guard',name:'警衛室',r:[3,31,3,2],roof:'#6d7f8f',doors:[{d:[4,32],s:[4,33]}],small:1},
 {id:'g9',name:'九年級教室',r:[3,38,4,9],roof:'#c79a4a',doors:[{d:[6,41],s:[7,41],fun:'九年級學長姐的教室唷 📖'}]},
 {id:'yingxi',name:'迎曦樓',r:[8,43,10,4],roof:'#c06f63',doors:[{d:[11,43],s:[11,42],sign:'健康中心'}]},
 {id:'zhishan',name:'至善樓',r:[19,37,5,10],roof:'#c77d55',doors:[{d:[19,40],s:[18,40],sign:'特教教室'},{d:[19,44],s:[18,44],sign:'餐廳'},{d:[23,45],s:[24,45],sign:'家政教室'}]}];
const ZONE={field:[12,1,17,15],court:[15,16,13,6],plaza2:[8,23,9,6],plaza1:[8,37,10,5]};
const SOLID=[[9,24,2,1],[14,24,2,1],[12,38,2,1]];
const TREES=[[3,1],[3,6],[10,1],[11,11],[9,12],[11,14],[25,24],[27,26],[26,29],[28,32],[27,38],[28,41],[27,46],[8,28],[16,23],[8,41],[17,37],[6,28],[28,19],[3,28],[13,21],[6,36],[11,27],[13,27]];
const isTree=(x,y)=>TREES.some(t=>t[0]===x&&t[1]===y);
const bAt=(x,y)=>BLD.find(b=>inR(x,y,b.r));
function walk(x,y){if(x<3||y<1||x>28||y>47)return false;if(bAt(x,y)||isTree(x,y))return false;if(SOLID.some(r=>inR(x,y,r)))return false;return true;}
function bfs(s,t,maxLen=999){
  const key=(x,y)=>y*W+x,prev=new Map([[key(...s),null]]),q=[s];let found=false,qi=0;
  while(qi<q.length){const [x,y]=q[qi++];if(x===t[0]&&y===t[1]){found=true;break;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(walk(nx,ny)&&!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny]);}}}
  if(!found)return null;const p=[];let c=t;while(c&&!(c[0]===s[0]&&c[1]===s[1])){p.unshift(c);c=prev.get(key(...c));}
  return p.length>maxLen?null:p;}
function rr(c,x,y,w,h,r,f){c.fillStyle=f;c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill();}
function blob(c,x,y,r,f){c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return `rgb(${f(r)},${f(g)},${f(b)})`;}
function sign(c,text,x,y,size,icon){
  c.font=`${size}px Huninn,'Noto Sans TC',sans-serif`;const w=c.measureText(text).width+size*1.1,h=size*1.55;
  c.save();c.shadowColor='rgba(40,25,10,.35)';c.shadowBlur=6;c.shadowOffsetY=3;rr(c,x-w/2,y-h/2,w,h,h*.3,'#8b5e3c');c.restore();
  rr(c,x-w/2+3,y-h/2+3,w-6,h-6,h*.25,'#fbf3df');c.fillStyle='#3b2a14';c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y+1);
  if(icon){c.font=`${size*1.3}px sans-serif`;c.fillText(icon,x,y-h);}
}
function tree(c,x,y,big){const X=x*T+T/2,Y=y*T+T/2,s=big?1.25:1;
  c.save();c.fillStyle='rgba(30,50,25,.28)';c.beginPath();c.ellipse(X+8,Y+14,24*s,11*s,0,0,7);c.fill();c.restore();
  rr(c,X-4,Y+2,8,14,3,'#6b4a2f');
  const h=hash(x,y),greens=['#2f5e34','#3b7140','#4a8549','#5f9a55','#7fb465'];
  [[0,-4,20],[-11,0,13],[11,0,13],[-6,-12,13],[7,-12,12]].forEach(([dx,dy,r],i)=>blob(c,X+dx*s,Y+dy*s,r*s,greens[i%2]));
  [[-5,-10,10],[5,-8,9],[0,-15,8]].forEach(([dx,dy,r])=>blob(c,X+dx*s,Y+dy*s,r*s,greens[2]));
  [[-7,-14,6],[2,-17,5]].forEach(([dx,dy,r])=>blob(c,X+dx*s,Y+dy*s,r*s,greens[3]));
  blob(c,X-9*s,Y-17*s,3*s,greens[4]);
  for(let i=0;i<5;i++){const a=(h>>i)%20;blob(c,X+(a-10)*s,Y-((h>>(i+3))%22)*s,1.6,'rgba(220,240,180,.7)');}
}
function bush(c,X,Y){[[0,0,9],[-8,3,7],[8,3,7]].forEach(([dx,dy,r])=>blob(c,X+dx,Y+dy,r,'#3f7a45'));blob(c,X-2,Y-3,4,'#6aa35a');}
function building(c,b){
  const [x,y,w,h]=b.r,X=x*T,Y=y*T,Wd=w*T,Hd=h*T,roofH=Math.min(Hd*.5,T*1.6);
  c.save();c.shadowColor='rgba(25,40,30,.45)';c.shadowBlur=14;c.shadowOffsetX=8;c.shadowOffsetY=10;rr(c,X+2,Y+2,Wd-4,Hd-4,8,'#f4ead3');c.restore();
  const g=c.createLinearGradient(X,Y,X,Y+Hd);g.addColorStop(0,'#fbf4e2');g.addColorStop(1,'#e6d6b5');rr(c,X+2,Y+2,Wd-4,Hd-4,8,g);
  const rg=c.createLinearGradient(X,Y,X,Y+roofH);rg.addColorStop(0,shade(b.roof,.25));rg.addColorStop(1,shade(b.roof,-.18));
  rr(c,X,Y,Wd,roofH,8,rg);c.strokeStyle=shade(b.roof,-.3);c.lineWidth=1.5;
  for(let i=8;i<Wd-4;i+=10){c.beginPath();c.moveTo(X+i,Y+3);c.lineTo(X+i,Y+roofH-3);c.stroke();}
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(X+4,Y+3,Wd-8,3);rr(c,X,Y+roofH-5,Wd,6,3,shade(b.roof,-.35));
  const vertical=h>w;
  if(!b.small){
    if(vertical){for(let j=1;j*T<Hd-roofH-T*.4;j++){const wy=Y+roofH+j*T-T*.75;[X+8,X+Wd-26].forEach(wx=>{const wg=c.createLinearGradient(wx,wy,wx+18,wy+22);wg.addColorStop(0,'#bfe3f2');wg.addColorStop(1,'#6fa9c9');rr(c,wx,wy,18,22,3,wg);c.fillStyle='rgba(255,255,255,.7)';c.fillRect(wx+3,wy+3,4,10);});}}
    else{for(let i=0;i<w;i++){const wx=X+i*T+9,wy=Y+roofH+(Hd-roofH)*.25;if(b.doors.some(d=>d.d[0]===x+i&&d.d[1]===y+h-1))continue;const wg=c.createLinearGradient(wx,wy,wx+22,wy+20);wg.addColorStop(0,'#bfe3f2');wg.addColorStop(1,'#6fa9c9');rr(c,wx,wy,T-18,Math.min(22,(Hd-roofH)*.5),3,wg);c.fillStyle='rgba(255,255,255,.7)';c.fillRect(wx+3,wy+3,5,8);}}
  }

  const [nx,ny]=o.path[0],sp=dt*.0022,dx=nx-o.fx,dy=ny-o.fy,d=Math.hypot(dx,dy);if(Math.abs(dx)>.01)o.face=Math.sign(dx);
  if(d<=sp){o.fx=o.x=nx;o.fy=o.y=ny;o.path.shift();}else{o.fx+=dx/d*sp;o.fy+=dy/d*sp;}}

/* ================= 畫面 ================= */
function worldLayer(c,t){ // 地圖＋人＋小線索（目前 transform 已設定好）
  c.drawImage(off,0,0,W*T,H*T);
  for(let i=0;i<5;i++){const ph=(t/1700+i/5)%1;blob(c,22.6*T+Math.sin(t/500+i)*6,37*T+8-ph*70,6+ph*12,`rgba(255,255,255,${.55*(1-ph)})`);}
  ITEMS.forEach(it=>{drawItem(c,it,t);if(S.found.has(it.id)){c.strokeStyle='#7ccf7f';c.lineWidth=1.2;c.beginPath();c.arc(it.x,it.y,7,0,7);c.stroke();}});
  NPCS.slice().sort((a,b)=>a.fy-b.fy).forEach(n=>person(c,n.fx*T+T/2,n.fy*T+T/2-4,{outfit:'uniform',shirt:n.shirt,hair:n.hair,moving:n.path.length>0,face:n.face},t));
}
function lensWorldCenter(){return {x:L.x/zoom+cam.x,y:L.y/zoom+cam.y};}
function draw(t){
  const c=cx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,vw,vh);if(!off)return;
  c.setTransform(dpr*zoom,0,0,dpr*zoom,-cam.x*dpr*zoom,-cam.y*dpr*zoom);worldLayer(c,t);
  // 提示光暈（只標大概的區域）
  if(HINT&&S.act===0){const it=ITEMS.find(i=>!S.found.has(i.id));if(it){const a=.35+.25*Math.sin(t/300);c.strokeStyle=`rgba(255,214,90,${a})`;c.lineWidth=5;c.setLineDash([10,10]);c.beginPath();c.arc(it.x+18,it.y-12,2.2*T,0,7);c.stroke();c.setLineDash([]);}}
  c.setTransform(dpr,0,0,dpr,0,0);
  const v=c.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.45,vw/2,vh/2,Math.max(vw,vh)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(30,20,10,.3)');c.fillStyle=v;c.fillRect(0,0,vw,vh);
  // ===== 放大鏡 =====
  const R=L.R,m=S.mag,wc=lensWorldCenter();
  // 握把（鏡片外）
  c.save();c.translate(L.x,L.y);c.rotate(Math.PI/4);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();if(c.roundRect)c.roundRect(R+6,-12+8,R*1.05,26,13);c.fill();
  const hg=c.createLinearGradient(0,-12,0,12);hg.addColorStop(0,'#8a5a32');hg.addColorStop(.5,'#5a361c');hg.addColorStop(1,'#3a2210');c.fillStyle=hg;c.beginPath();if(c.roundRect)c.roundRect(R+2,-12,R*1.05,24,12);c.fill();
  c.fillStyle='#c9a24a';c.fillRect(R-2,-14,14,28);c.restore();
  // 鏡片內：重新畫一次世界（放大／縮小／倒過來）
  c.save();c.beginPath();c.arc(L.x,L.y,R,0,7);c.clip();c.fillStyle='#6e9a57';c.fillRect(L.x-R,L.y-R,R*2,R*2);
  const s=zoom*m;c.setTransform(dpr*s,0,0,dpr*s,dpr*(L.x-wc.x*s),dpr*(L.y-wc.y*s));
  if(S.blur>0&&'filter' in c)c.filter=`blur(${S.blur*10}px)`;
  worldLayer(c,t);c.filter='none';
  c.setTransform(dpr,0,0,dpr,0,0);
  if(S.blur>0){c.fillStyle=`rgba(255,255,255,${S.blur*.55})`;c.fillRect(L.x-R,L.y-R,R*2,R*2);}
  const gl=c.createRadialGradient(L.x-R*.35,L.y-R*.4,R*.05,L.x,L.y,R);gl.addColorStop(0,'rgba(255,255,255,.35)');gl.addColorStop(.35,'rgba(255,255,255,.06)');gl.addColorStop(1,'rgba(120,200,230,.18)');c.fillStyle=gl;c.fillRect(L.x-R,L.y-R,R*2,R*2);
  c.restore();
  // 鏡框
  c.save();c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=14;c.shadowOffsetY=6;c.strokeStyle='#c9a24a';c.lineWidth=12;c.beginPath();c.arc(L.x,L.y,R+4,0,7);c.stroke();c.restore();
  c.strokeStyle='#8a6a22';c.lineWidth=2;c.beginPath();c.arc(L.x,L.y,R+10,0,7);c.stroke();c.strokeStyle='#f5dc8a';c.beginPath();c.arc(L.x,L.y,R-1,0,7);c.stroke();
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=5;c.lineCap='round';c.beginPath();c.arc(L.x,L.y,R*.82,Math.PI*1.1,Math.PI*1.38);c.stroke();
  if(S.act===1&&!S.act2.answered){blob(c,L.x+R*.72,L.y+R*.72,22,'#241b14');c.fillStyle='#f2c14e';c.font="900 26px Huninn,sans-serif";c.textAlign='center';c.textBaseline='middle';c.fillText('?',L.x+R*.72,L.y+R*.74);}
  if(S.drag==='lens'||(!S.busy&&Math.sin(t/400)>.6&&S.act===0&&S.found.size===0)){c.strokeStyle='rgba(255,214,90,.6)';c.lineWidth=3;c.beginPath();c.arc(L.x,L.y,R+20,0,7);c.stroke();}
  minimap(c,t);
}
function minimap(c,t){
  const s=Math.max(2,Math.min(3,Math.min(vw,vh)/200)),mw=W*s,mh=H*s,ox=vw-mw-10,oy=10;minimap.box=[ox,oy,mw,mh,s];
  c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=8;rr(c,ox-5,oy-5,mw+10,mh+10,8,'#8b5e3c');c.restore();c.fillStyle='#86b867';c.fillRect(ox,oy,mw,mh);
  c.fillStyle='#c66b4c';c.fillRect(ox+ZONE.field[0]*s,oy+ZONE.field[1]*s,ZONE.field[2]*s,ZONE.field[3]*s);c.fillStyle='#79ad5c';c.fillRect(ox+(ZONE.field[0]+2)*s,oy+(ZONE.field[1]+2)*s,(ZONE.field[2]-4)*s,(ZONE.field[3]-4)*s);
  c.fillStyle='#e9dcc3';[ZONE.plaza1,ZONE.plaza2,...ROADS].forEach(r=>c.fillRect(ox+r[0]*s,oy+r[1]*s,r[2]*s,r[3]*s));
  BLD.forEach(b=>{c.fillStyle=b.roof;c.fillRect(ox+b.r[0]*s,oy+b.r[1]*s,b.r[2]*s,b.r[3]*s);});
  ITEMS.forEach(it=>{const f=S.found.has(it.id);if(f){c.fillStyle='#2f8a34';c.fillRect(ox+it.x/T*s-2,oy+it.y/T*s-2,5,5);}else if(HINT&&S.act===0&&Math.sin(t/250)>-.2){c.strokeStyle='#ffd65a';c.lineWidth=1.5;c.beginPath();c.arc(ox+it.x/T*s,oy+it.y/T*s,6,0,7);c.stroke();}});
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=1.2;c.strokeRect(ox+cam.x/T*s,oy+cam.y/T*s,vw/zoom/T*s,vh/zoom/T*s);
  const wc=lensWorldCenter();blob(c,ox+wc.x/T*s,oy+wc.y/T*s,4,'#f2c14e');
}

/* ================= 拖曳：放大鏡／地圖 ================= */
function clampCam(){cam.x=Math.max(0,Math.min(W*T-vw/zoom,cam.x));cam.y=Math.max(0,Math.min(H*T-vh/zoom,cam.y));}
let last={x:0,y:0};
cv.addEventListener('pointerdown',e=>{if(S.busy)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const b=minimap.box;if(b&&x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]){cam.x=(x-b[0])/b[4]*T-L.x/zoom;cam.y=(y-b[1])/b[4]*T-L.y/zoom;clampCam();return;}
  const hx=L.x+Math.cos(Math.PI/4)*L.R*1.5,hy=L.y+Math.sin(Math.PI/4)*L.R*1.5;
  S.drag=(Math.hypot(x-L.x,y-L.y)<L.R+18||Math.hypot(x-hx,y-hy)<L.R*.6)?'lens':'map';last={x,y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!S.drag)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-last.x,dy=y-last.y;last={x,y};
  if(S.drag==='lens'){L.x=Math.min(vw-L.R*.6,Math.max(L.R*.6,L.x+dx));L.y=Math.min(vh-L.R*.6,Math.max(L.R*.6,L.y+dy));}
  else{cam.x-=dx/zoom;cam.y-=dy/zoom;clampCam();}});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{S.drag=null;cv.style.cursor='grab';}));
window.addEventListener('keydown',e=>{if(S.busy)return;const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k){L.x=Math.min(vw-L.R*.6,Math.max(L.R*.6,L.x+k[0]*24));L.y=Math.min(vh-L.R*.6,Math.max(L.R*.6,L.y+k[1]*24));e.preventDefault();}});

/* ================= 主迴圈 ================= */
let lt=0;
function loop(t){const dt=Math.min(50,t-(lt||t));lt=t;NPCS.forEach(n=>stepN(n,dt));
  // 放大鏡靠邊時，地圖自動跟著捲
  if(S.drag==='lens'){const mg=Math.min(vw,vh)*.16,sp=dt*.5/zoom;if(L.x<mg+L.R*.3)cam.x-=sp;if(L.x>vw-mg-L.R*.3)cam.x+=sp;if(L.y<mg+L.R*.3)cam.y-=sp;if(L.y>vh-mg-L.R*.3)cam.y+=sp;clampCam();}
  if(S.act===0&&!S.busy)detect(dt);
  draw(t);requestAnimationFrame(loop);}
function detect(dt){const wc=lensWorldCenter(),wr=L.R/(zoom*S.mag);
  ITEMS.forEach(it=>{if(S.found.has(it.id))return;if(Math.hypot(it.x-wc.x,it.y-wc.y)<Math.max(14,wr*.55)){it.hold=(it.hold||0)+dt;if(it.hold>450)found(it);}else it.hold=0;});}
function found(it){S.found.add(it.id);ding();confetti(36);renderActs();
  const p=$('#popup');p.innerHTML=`${it.photo?`<img src="${IMG[it.photo]}" alt="">`:`<div class="pe">${it.e}</div>`}<div><b>找到了！${it.name}</b><span>${it.line}</span></div>`;p.hidden=false;
  say('找到了！'+it.line);clearTimeout(found.t);found.t=setTimeout(()=>p.hidden=true,3600);
  if(S.found.size===ITEMS.length)setTimeout(()=>endAct(0),2600);else foot0();}
