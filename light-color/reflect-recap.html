<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<title>30秒反射複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{--bg1:#05101f;--bg2:#0a2036;--bg3:#0e3350;--panel:#0f2841;--line:rgba(120,170,210,.28);
    --amber:#ffc93c;--teal:#42e0c8;--ink:#eaf6ff;--dim:#9db8cf;
    --disp:'Fredoka','Noto Sans TC',system-ui,sans-serif;--body:'Noto Sans TC',system-ui,sans-serif;}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%,rgba(255,201,60,.10),transparent 55%),
      linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh;-webkit-tap-highlight-color:transparent}
  .fixbtn{position:fixed;top:12px;z-index:99999;background:#0f2841;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
  .home{left:12px;border:2px solid var(--amber);color:var(--amber)} .menu{right:12px;border:2px solid var(--teal);color:var(--teal)}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 40px;text-align:center}
  header{padding:8px 0 2px}
  .emblem{font-size:40px}
  h1{font-family:var(--disp);font-size:26px;margin:2px 0}
  .tip{color:var(--dim);font-weight:800;font-size:14px}
  .dots{margin:8px 0}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#26425f;margin:0 4px}
  .dot.now{background:var(--amber);transform:scale(1.3)}.dot.done{background:var(--teal)}

  /* photo stage */
  .stage{position:relative;border-radius:24px;overflow:hidden;border:3px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.55);aspect-ratio:16/9;background:#08131f}
  .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:kb 12s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
  .split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
  .split img{width:100%;height:100%;object-fit:cover;display:block}
  .split .lb{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);font-family:var(--disp);font-weight:700;font-size:min(4vw,22px);
    background:rgba(0,0,0,.62);padding:6px 14px;border-radius:12px;white-space:nowrap}
  .split .half{position:relative}
  .split .half+.half::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#fff;opacity:.85;z-index:1}
  .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,10,20,.92) 0%,rgba(4,10,20,.45) 42%,rgba(4,10,20,.05) 100%)}
  .txt{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 20px}
  .say{font-size:min(5.2vw,30px);font-weight:900;line-height:1.35;text-shadow:0 3px 12px rgba(0,0,0,.9)}
  .term{display:inline-block;background:var(--teal);color:#063;border-radius:999px;padding:3px 16px;font-weight:900;font-size:min(3.6vw,18px);margin-top:8px}
  .rays{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .tapmark{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-weight:900;font-size:13px;padding:5px 12px;border-radius:999px;z-index:2}

  .row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .btn{font-family:var(--disp);font-weight:700;font-size:20px;border:none;border-radius:16px;padding:14px 28px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.next{background:linear-gradient(180deg,var(--teal),#1fbfa8);color:#063}
  .btn.go{background:linear-gradient(180deg,var(--amber),#ff9f1c);color:#08131f}
  .btn.ghost{background:var(--panel);border:2px solid var(--line);color:var(--ink)}
  footer{margin-top:18px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<a class="fixbtn home" href="./">🏠 回到首頁</a>
<a class="fixbtn menu" href="/light/">🗂️ 主選單</a>
<div class="wrap">
  <header>
    <div class="emblem">🪞</div>
    <h1>先暖身・30 秒反射複習</h1>
    <div class="tip">👆 點「下一步」，看真實照片、聽它唸一次</div>
  </header>
  <div class="dots" id="dots"></div>
  <div class="stage" id="stage"></div>
  <div class="row" id="row"></div>
  <footer>🪞 30秒反射複習　｜　接下來：白光藏著七彩・光與顏色</footer>
</div>

<script>
const $=id=>document.getElementById(id);
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC;}
function ding(){const a=ac();if(!a)return;const t=a.currentTime;[784,1047,1319].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(f,t+i*.08);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,t+i*.08);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.16);o.start(t+i*.08);o.stop(t+i*.08+.16);});}
function speak(zh,en){try{if(localStorage.getItem('voice')!=='on')return;}catch(e){return;}if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(zh);u.lang="zh-TW";u.rate=.85;
  u.onend=()=>{if(en){const e=new SpeechSynthesisUtterance(en);e.lang="en-US";e.rate=.82;speechSynthesis.speak(e);}};
  speechSynthesis.speak(u);}catch(e){}}

const R="../light-reflection/img/";
const raysSVG=`<svg class="rays" viewBox="0 0 640 360" preserveAspectRatio="none">
  <line x1="320" y1="250" x2="320" y2="90" stroke="#fff" stroke-dasharray="8 8" stroke-width="2" opacity=".8"/>
  <line x1="120" y1="80" x2="320" y2="250" stroke="#ffd43b" stroke-width="7" stroke-linecap="round"/>
  <line x1="320" y1="250" x2="520" y2="80" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="300,236 320,250 306,228" fill="#ffd43b"/><polygon points="340,236 320,250 334,228" fill="#ff6b6b"/>
  <path d="M320 190 A 60 60 0 0 0 275 212" fill="none" stroke="#ffd43b" stroke-width="3"/>
  <path d="M320 190 A 60 60 0 0 1 365 212" fill="none" stroke="#ff6b6b" stroke-width="3"/>
  <text x="150" y="66" fill="#ffd43b" font-size="26" font-weight="900">入射光</text>
  <text x="430" y="66" fill="#ff6b6b" font-size="26" font-weight="900">反射光</text>
  <text x="252" y="300" fill="#fff" font-size="22" font-weight="900" opacity=".95">入射角 ＝ 反射角</text>
</svg>`;

const STEPS=[
 {img:R+"mirror.png",say:"光碰到鏡子，會<span style='color:#ffd43b'>彈回來</span>！<br>所以鏡子裡看得到房間和自己。",term:"反射 · Reflection",zh:"光碰到鏡子會彈回來，這叫反射",en:"Reflection"},
 {img:R+"lake.png",rays:true,say:"彈回來很公平：<span style='color:#ffd43b'>入射角</span> ＝ <span style='color:#ff6b6b'>反射角</span><br>平靜的湖面就是一面大鏡子。",term:"反射定律",zh:"入射角等於反射角，這叫反射定律",en:"Law of reflection"},
 {split:[[R+"mirror.png","🪞 平滑 → 整齊反射"],["img/wall.jpg","🧱 粗糙 → 光四散"]],say:"<span style='color:#42e0c8'>平滑</span>的面照得出影像；<span style='color:#ff9f1c'>粗糙</span>的面看得到、但沒有影像。",term:"鏡面反射 · 漫反射",zh:"平滑的面是鏡面反射，粗糙的面是漫反射",en:"Specular and diffuse reflection"},
 {img:"img/fruits.jpg",say:"我們看到<span style='color:#ff6b6b'>顏色</span>，<br>也是光從物體<span style='color:#ffd43b'>反射</span>進眼睛！",term:"今天：物體的顏色",zh:"我們看到顏色，是光從物體反射進眼睛",en:"We see color from reflected light",last:true},
];
let i=0;
function dots(){$("dots").innerHTML=STEPS.map((_,k)=>'<span class="dot'+(k<i?' done':k===i?' now':'')+'"></span>').join("");}
function render(){
  dots();const st=STEPS[i];let h='<span class="tapmark">'+(i+1)+' / '+STEPS.length+'</span>';
  if(st.split){h+='<div class="split">'+st.split.map(s=>'<div class="half"><img src="'+s[0]+'" alt=""><div class="lb">'+s[1]+'</div></div>').join("")+'</div>';}
  else{h+='<img class="ph" src="'+st.img+'" alt="">';if(st.rays)h+=raysSVG;}
  h+='<div class="ov"></div><div class="txt"><div class="say">'+st.say+'</div><div class="term">'+st.term+'</div></div>';
  $("stage").innerHTML=h;
  $("row").innerHTML=st.last
    ? '<a class="btn go" href="https://gamma.app/docs/cvet1x6jr7eyeh7" target="_blank" rel="noopener">▶ 開始顏色任務</a><a class="btn ghost" href="./">🏠 回首頁</a>'
    : '<button class="btn next" onclick="nextS()">下一步 ➡</button>';
  ding();speak(st.zh,st.en);
}
function nextS(){if(i<STEPS.length-1){i++;render();}}
render();
</script>
</body>
</html>
