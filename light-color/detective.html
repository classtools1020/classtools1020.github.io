<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<a href="/light/" class="mainmenu-btn" style="position:fixed;right:12px;top:12px;z-index:99999;background:#0f2841;border:2px solid #42e0c8;color:#42e0c8;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45);font-family:Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif">🗂️ 主選單</a>
<a href="./" style="position:fixed;left:12px;top:12px;z-index:99999;background:#0f2841;border:2px solid #ffc93c;color:#ffc93c;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45);font-family:Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif">🏠 回到首頁</a>
<title>顏色偵探大挑戰</title>
<style>
  :root{
    --bg1:#05101f; --bg2:#0a2036; --bg3:#0e3350;
    --amber:#ffc93c; --amber2:#ff9f1c; --teal:#42e0c8; --rose:#ff5d8f;
    --ink:#eaf6ff; --dim:#9db8cf; --card:#0f2841; --line:rgba(120,170,210,.28);
    --shadow:rgba(0,0,0,.5);
    --kR:#e94b4b; --kB:#2e7be0; --kY:#f4c020; --kG:#38b26b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, rgba(255,201,60,.10), transparent 55%),
      linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    height:100vh;
  }
  /* 背景漂浮光球，增加氛圍 */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #bg .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 16s ease-in-out infinite}
  #bg .o1{width:40vmax;height:40vmax;left:-10vmax;top:-8vmax;background:radial-gradient(circle,#ff5d8f,transparent 70%)}
  #bg .o2{width:44vmax;height:44vmax;right:-12vmax;top:6vmax;background:radial-gradient(circle,#2e9bff,transparent 70%);animation-delay:-5s}
  #bg .o3{width:38vmax;height:38vmax;left:20vmax;bottom:-16vmax;background:radial-gradient(circle,#42e0c8,transparent 70%);animation-delay:-9s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3vmax,-3vmax) scale(1.08)}}
  .screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:2vh 3vw;overflow:auto}
  .screen.on{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* HOME */
  .emblem{font-size:clamp(60px,11vh,110px);filter:drop-shadow(0 8px 18px rgba(255,201,60,.4))}
  h1.title{font-size:clamp(38px,8vh,84px);font-weight:900;margin:.05em 0;text-align:center;line-height:1}
  .title .rb{background:linear-gradient(90deg,#ff5d5d,#ff9f1c,#ffd426,#38d967,#2e9bff,#8a5cf6,#ff5d5d);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 6s linear infinite}
  @keyframes shimmer{to{background-position:200% 0}}
  .tag{font-size:clamp(16px,2.6vh,24px);color:var(--teal);font-weight:900;margin-bottom:2.5vh;text-align:center}
  .panel{background:rgba(15,40,65,.7);border:2px solid var(--line);border-radius:24px;padding:20px 24px;
    max-width:640px;width:100%;box-shadow:0 12px 30px var(--shadow);backdrop-filter:blur(4px)}
  .panel label{display:block;font-size:15px;font-weight:800;color:var(--dim);margin:2px 0 8px}
  .panel textarea{width:100%;min-height:64px;border-radius:14px;border:2px solid var(--line);background:#08182b;
    color:var(--ink);font-family:inherit;font-size:17px;font-weight:700;padding:12px;resize:vertical}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;justify-content:center}
  .chk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--dim);
    background:#08182b;border:2px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;user-select:none}
  .chk.on{color:#08131f;background:var(--amber);border-color:var(--amber)}
  .btn{font-size:clamp(20px,3vh,30px);font-weight:900;color:#2a1c00;
    background:linear-gradient(150deg,var(--amber),var(--amber2));padding:16px 40px;border-radius:999px;
    box-shadow:0 10px 26px rgba(255,159,28,.4);transition:transform .1s;display:inline-flex;align-items:center;gap:10px}
  .btn:active{transform:scale(.94)}
  .btn.ghost{background:#12324f;color:var(--ink);box-shadow:0 8px 20px var(--shadow)}
  .btn.big{font-size:clamp(24px,4.2vh,44px);padding:20px 56px}

  /* QUIZ */
  .qtop{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1180px;gap:12px;margin-bottom:1vh}
  .pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:900;font-size:clamp(15px,2.4vh,22px)}
  .pill .lbl{color:var(--dim);font-size:.8em;margin-right:6px}
  .pill.score{color:var(--amber)} .pill.combo{color:var(--rose)}
  .qhead{display:flex;align-items:center;gap:14px;width:100%;max-width:1180px;margin-bottom:1vh}
  .qnum{flex:none;display:grid;place-items:center;min-width:52px;height:52px;padding:0 12px;border-radius:14px;
    background:var(--amber);color:#08131f;font-weight:900;font-size:clamp(20px,3vh,30px)}
  .qtext{font-size:clamp(20px,3.4vh,36px);font-weight:900;line-height:1.35}
  .qmid{display:flex;gap:2vw;width:100%;max-width:1180px;align-items:center;flex:1;min-height:0}
  .qimg{flex:1 1 46%;max-width:620px;border-radius:18px;border:2px solid var(--line);box-shadow:0 10px 26px var(--shadow);
    background:#05101f;object-fit:contain;max-height:52vh;min-width:0}
  .timerwrap{flex:1 1 54%;display:flex;flex-direction:column;gap:1.4vh;min-width:0}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:1vh;flex-wrap:wrap;width:100%;max-width:1180px}
  .dot{width:24px;height:9px;border-radius:999px;background:#0d2338;border:1px solid var(--line);transition:background .3s,transform .3s}
  .dot.done{background:var(--kG);border-color:transparent}
  .dot.cur{background:var(--amber);border-color:transparent;transform:scaleY(1.5)}
  .trow{display:flex;align-items:center;gap:12px}
  .tnum{flex:none;font-weight:900;font-size:clamp(18px,2.8vh,26px);color:var(--teal);min-width:2.6em;text-align:right}
  .tbar{flex:1;height:18px;border-radius:999px;background:#08182b;overflow:hidden;border:1px solid var(--line)}
  .tbar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),#7dffe0);
    transition:width 1s linear,background .4s}
  .tbar > i.warn{background:linear-gradient(90deg,var(--amber),var(--amber2))}
  .tbar > i.danger{background:linear-gradient(90deg,#ff8a8a,#e94b4b)}
  @keyframes slidein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .anim{animation:slidein .4s ease both}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.4vw}
  .opt{position:relative;display:flex;align-items:center;gap:12px;border-radius:18px;padding:2vh 20px;color:#fff;font-weight:900;
    font-size:clamp(17px,2.7vh,26px);line-height:1.25;text-align:left;box-shadow:0 8px 20px var(--shadow),inset 0 2px 0 rgba(255,255,255,.25);
    transition:transform .12s,filter .15s,box-shadow .15s;min-height:9vh;overflow:hidden}
  .opt::before{content:"";position:absolute;inset:0 0 auto 0;height:45%;background:linear-gradient(rgba(255,255,255,.28),transparent);pointer-events:none}
  .opt:hover{transform:translateY(-3px);box-shadow:0 14px 28px var(--shadow),inset 0 2px 0 rgba(255,255,255,.3)}
  .opt:active{transform:scale(.97)}
  .opt .sh{font-size:1.25em;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .opt.r{background:linear-gradient(160deg,#ff6a6a,#d93636)} .opt.b{background:linear-gradient(160deg,#4a95ff,#2160d6)}
  .opt.y{background:linear-gradient(160deg,#ffe066,#e8ad00);color:#3a2a00} .opt.g{background:linear-gradient(160deg,#54d98a,#2a9455)}
  .opt.dim{filter:grayscale(.7) brightness(.5);transform:scale(.97)}
  .opt.win{outline:6px solid #fff;box-shadow:0 0 0 6px var(--amber),0 0 40px var(--amber);animation:pop .5s;filter:none !important;transform:none}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .opt.lose{opacity:.6}
  .opt .mark{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.5em;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .qfoot{display:flex;gap:12px;align-items:center;width:100%;max-width:1180px;margin-top:1.2vh;justify-content:space-between;flex-wrap:wrap}
  .hintbox{flex:1;min-width:240px;font-size:clamp(15px,2.2vh,22px);color:var(--teal);font-weight:800;
    background:rgba(66,224,200,.1);border-left:5px solid var(--teal);border-radius:0 12px 12px 0;padding:10px 16px;line-height:1.5}
  .hintbox[hidden]{display:none}
  .minibtn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:900;
    font-size:clamp(14px,2.2vh,20px);color:var(--amber)}

  /* RESULT */
  .bigscore{font-size:clamp(60px,16vh,160px);font-weight:900;color:var(--amber);line-height:1;filter:drop-shadow(0 6px 16px rgba(255,201,60,.4))}
  .stars{font-size:clamp(30px,6vh,60px);letter-spacing:.1em;margin:1vh 0}
  .msg{font-size:clamp(20px,3.4vh,34px);font-weight:900;text-align:center;margin-bottom:2vh}

  /* WHEEL / 抽獎 */
  .overlay{position:absolute;inset:0;background:rgba(3,8,16,.82);display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:40;padding:3vh 3vw;backdrop-filter:blur(3px)}
  .overlay.on{display:flex;animation:fade .3s ease}
  .overlay h2{font-size:clamp(26px,5vh,52px);font-weight:900;margin:.2em 0 2vh;color:var(--amber);text-align:center}
  .wheelbox{position:relative;width:min(62vh,86vw);aspect-ratio:1/1}
  .wheel{width:100%;height:100%;border-radius:50%;border:10px solid #0f2841;box-shadow:0 0 0 8px var(--amber),0 20px 50px var(--shadow);
    transition:transform 5s cubic-bezier(.12,.66,.06,1)}
  .pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:clamp(40px,7vh,64px);z-index:2;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16%;height:16%;border-radius:50%;
    background:var(--amber);border:6px solid #0f2841;display:grid;place-items:center;font-size:clamp(22px,4vh,40px)}
  .winner{font-size:clamp(40px,9vh,96px);font-weight:900;color:#fff;text-align:center;
    text-shadow:0 0 30px var(--amber),0 4px 10px #000;animation:pop .6s;min-height:1.2em}
  .ovbtns{display:flex;gap:14px;margin-top:2.5vh;flex-wrap:wrap;justify-content:center}

  #fx{position:absolute;inset:0;pointer-events:none;z-index:60}
  .shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @media(max-width:760px){.qmid{flex-direction:column}.qimg{max-height:34vh;flex-basis:auto;width:100%}.opts{grid-template-columns:1fr}}
  /* 自閉症／感覺敏感友善：系統開「減少動態」時，關掉搖晃與快閃 */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-iteration-count:1 !important}
    .shake{animation:none !important}
    .opt.win{animation:none}
    .wheel{transition:transform 3s ease-out}
  }
</style>
<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="emblem">🕵️🎨</div>
  <h1 class="title"><span class="rb">顏色偵探</span> 大挑戰</h1>
  <div class="tag">光與顏色 ・ 12 關 ・ 看圖搶答 ・ 音效 ＋ 抽獎，全班嗨翻！</div>
  <div class="panel">
    <label>🎡 抽人名單（老師自己輸入座號或姓名，用逗號／空白／換行分開；留空就自動用 1～8 號）</label>
    <textarea id="names" placeholder="例如：1, 2, 3, 4, 5, 6　或直接留空用座號"></textarea>
    <div class="row">
      <div class="chk on" id="chkTimer">⏱️ 計時模式</div>
      <div class="chk on" id="chkSound">🔊 音效</div>
      <div class="chk" id="chkShuffle">🔀 隨機出題</div>
    </div>
    <div class="row">
      <button class="btn big" id="startBtn">▶ 開始挑戰</button>
      <button class="btn ghost" id="wheelHomeBtn">🎡 先抽人</button>
    </div>
    <p style="text-align:center;color:var(--dim);font-size:14px;font-weight:700;margin:14px 0 0;line-height:1.6">
      玩法：看大圖 → 按 🎡 抽人回答 → 點答案，答對加分！<br>可用滑鼠、觸控或鍵盤 <b>1~4</b> 選答、<b>空白鍵</b> 下一題。</p>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen">
  <div class="qtop">
    <div class="pill"><span class="lbl">第</span><span id="curN">1</span><span class="lbl"> / 12 關</span></div>
    <div class="pill combo" id="comboPill" style="visibility:hidden">🔥 連對 <span id="comboN">2</span>！</div>
    <div class="pill score"><span class="lbl">分數</span><span id="scoreN">0</span></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="qhead">
    <div class="qnum" id="qnum">1</div>
    <div class="qtext" id="qtext">題目</div>
  </div>
  <div class="qmid">
    <img class="qimg" id="qimg" alt="對照圖">
    <div class="timerwrap">
      <div class="trow"><div class="tbar"><i id="tfill"></i></div><div class="tnum"><span id="tnum">30</span>秒</div></div>
      <div class="opts" id="opts"></div>
    </div>
  </div>
  <div class="qfoot">
    <div class="hintbox" id="hint" hidden></div>
    <div style="display:flex;gap:10px">
      <button class="minibtn" id="pickBtn">🎡 抽人回答</button>
      <button class="minibtn" id="nextBtn" hidden>下一題 ▶</button>
    </div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="emblem" id="resEmo">🎉</div>
  <div class="msg" id="resMsg">太厲害了，你們都是光的專家！</div>
  <div class="bigscore" id="resScore">0</div>
  <div class="stars" id="resStars">⭐⭐⭐</div>
  <div id="recapWrap" style="text-align:center;margin:1vh 0 2vh">
    <div style="font-size:clamp(16px,2.4vh,22px);font-weight:900;color:var(--teal);margin-bottom:1vh">
      答對 <span id="rightN">0</span> / <span id="totalN">12</span> 題</div>
    <div id="recap" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:640px"></div>
  </div>
  <div class="row">
    <button class="btn big" id="drawBtn">🎁 終極大抽獎</button>
    <button class="btn ghost" id="againBtn">🔄 再玩一次</button>
  </div>
</section>

<!-- WHEEL OVERLAY -->
<div class="overlay" id="ov">
  <h2 id="ovTitle">🎡 幸運轉盤</h2>
  <div class="wheelbox">
    <div class="pointer">🔻</div>
    <div class="wheel" id="wheel"></div>
    <div class="hub">🎯</div>
  </div>
  <div class="winner" id="winner">&nbsp;</div>
  <div class="ovbtns">
    <button class="btn" id="spinBtn">🎡 轉！</button>
    <button class="btn ghost" id="ovCloseBtn">關閉</button>
  </div>
</div>

<canvas id="fx"></canvas>

/* ================= 音效（Web Audio 合成，免外部檔） ================= */
const Snd=(()=>{
  let ctx=null, on=true, drum=null;
  const ac=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; };
  function tone(f,t,dur,type="sine",vol=.25){
    if(!on)return; const c=ac(); if(!c)return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(c.destination);
    const s=c.currentTime+t;
    g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+.01);
    g.gain.exponentialRampToValueAtTime(.0001,s+dur);
    o.start(s); o.stop(s+dur+.02);
  }
  function noise(t,dur,vol=.3){
    if(!on)return; const c=ac(); if(!c)return;
    const n=c.sampleRate*dur, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource(); src.buffer=b;
    const g=c.createGain(); g.gain.value=vol; src.connect(g); g.connect(c.destination);
    src.start(c.currentTime+t);
  }
  return {
    set(v){on=v;}, get(){return on;}, resume(){const c=ac(); if(c&&c.state==="suspended")c.resume();},
    click(){tone(520,0,.08,"triangle",.2);},
    tick(){tone(880,0,.03,"square",.06);},
    correct(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.28)); noise(.02,.15,.12);},
    wrong(){tone(200,0,.3,"sawtooth",.28); tone(150,.12,.3,"sawtooth",.28);},
    whoosh(){tone(300,0,.25,"sine",.18); tone(600,.05,.2,"sine",.12);},
    win(){[523,659,784,1047,1319,1047,1319,1568].forEach((f,i)=>tone(f,i*.11,.32,"triangle",.3)); noise(.4,.5,.15);},
    drumStart(){ if(!on)return; drum=setInterval(()=>{tone(160,0,.05,"square",.14);noise(0,.03,.08);},70); },
    drumStop(){ if(drum){clearInterval(drum);drum=null;} },
  };
})();

/* ================= 開始 ================= */
$("chkTimer").onclick=e=>{e.currentTarget.classList.toggle("on"); useTimer=e.currentTarget.classList.contains("on");};
$("chkSound").onclick=e=>{e.currentTarget.classList.toggle("on"); Snd.set(e.currentTarget.classList.contains("on"));};
$("chkShuffle").onclick=e=>{e.currentTarget.classList.toggle("on");};
function parseNames(){
  const raw=$("names").value.trim();
  let arr = raw? raw.split(/[\s,，、]+/).filter(Boolean) : [];
  if(arr.length<2) arr=["1號","2號","3號","4號","5號","6號","7號","8號"];
  return arr;
}
$("startBtn").onclick=()=>{ Snd.resume(); Snd.click(); names=parseNames(); score=0; combo=0; idx=0; results=[];
  useTimer=$("chkTimer").classList.contains("on");
  deck = $("chkShuffle").classList.contains("on") ? shuffle(Q.slice()) : Q.slice();
  $("scoreN").textContent=0; show("quiz"); render(); };
$("wheelHomeBtn").onclick=()=>{ Snd.resume(); names=parseNames(); openWheel("🎡 抽人回答", names, null); };
$("againBtn").onclick=()=>{ Snd.click(); show("home"); };

/* ================= 出題 ================= */
function render(){
  locked=false;
  const q=deck[idx];
  $("curN").textContent=idx+1; $("qnum").textContent=idx+1;
  $("qtext").textContent=q.q;
  $("qimg").src=IMGDATA[q.img]||""; $("qimg").alt=q.s;
  $("hint").hidden=true; $("nextBtn").hidden=true; $("pickBtn").hidden=false;
  $("comboPill").style.visibility = combo>=2? "visible":"hidden"; $("comboN").textContent=combo;
  // 進度圓點
  const dots=$("dots"); dots.innerHTML="";
  deck.forEach((_,i)=>{ const d=document.createElement("div");
    d.className="dot"+(i<idx?" done":"")+(i===idx?" cur":""); dots.appendChild(d); });
  const box=$("opts"); box.innerHTML="";
  q.o.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt "+OPTCLS[i];
    b.innerHTML=`<span class="sh">${OPTSH[i]}</span><span>${t}</span>`;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
  // 進場動畫
  ["qhead","qmid"].forEach(id=>{ const el=$(id); el.classList.remove("anim"); void el.offsetWidth; el.classList.add("anim"); });
  const fill=$("tfill"); fill.className=""; fill.style.transition="none"; fill.style.width="100%";
  $("tnum").textContent=QSEC;
  document.querySelector(".trow").style.visibility = useTimer? "visible":"hidden";
  if(useTimer) startTimer();
}
function startTimer(){
  clearInterval(timer); timeLeft=QSEC; const fill=$("tfill");
  requestAnimationFrame(()=>{ fill.style.transition=`width ${QSEC}s linear`; fill.style.width="0%"; });
  timer=setInterval(()=>{
    timeLeft--; $("tnum").textContent=Math.max(timeLeft,0);
    if(timeLeft===10) fill.classList.add("warn");
    if(timeLeft===5) fill.classList.replace("warn","danger");
    if(timeLeft<=5&&timeLeft>0)Snd.tick();
    if(timeLeft<=0){ clearInterval(timer); if(!locked) reveal(-1); }
  },1000);
}
function choose(i,btn){ if(locked)return; Snd.click(); reveal(i,btn); }
function reveal(picked,btn){
  if(locked)return; locked=true; clearInterval(timer);
  const q=deck[idx];
  const opts=[...document.querySelectorAll(".opt")];
  const correct = (picked===q.a); results[idx]=correct;
  opts.forEach((el,i)=>{
    if(i===q.a){ el.classList.add("win"); el.insertAdjacentHTML("beforeend",'<span class="mark">✅</span>'); }
    else { el.classList.add("dim"); }
  });
  if(correct){
    combo++; const gain = 100 + (combo>=2?(combo-1)*30:0);
    score+=gain; bumpScore();
    Snd.correct(); confetti(); flashMsg("答對啦！ +"+gain, "#38d967");
  }else{
    combo=0; if(btn){ btn.classList.add("lose"); btn.insertAdjacentHTML("beforeend",'<span class="mark">❌</span>'); }
    Snd.wrong(); document.body.classList.add("shake"); setTimeout(()=>document.body.classList.remove("shake"),400);
    flashMsg(picked<0? "時間到！看正解 👀":"再想一次也很棒 💪", "#ff5d8f");
  }
  $("comboPill").style.visibility = combo>=2? "visible":"hidden"; $("comboN").textContent=combo;
  $("hint").textContent="🔑 "+q.h; $("hint").hidden=false;
  $("pickBtn").hidden=true; $("nextBtn").hidden=false;
}
function bumpScore(){ const s=$("scoreN"); let cur=score-100; const step=Math.ceil((score-cur)/12);
  const t=setInterval(()=>{ cur+=step; if(cur>=score){cur=score;clearInterval(t);} s.textContent=cur; },20); }
$("nextBtn").onclick=()=>{ Snd.click(); idx++; if(idx>=deck.length) finish(); else render(); };
$("pickBtn").onclick=()=>{ Snd.resume(); openWheel("🎡 誰來回答第 "+(idx+1)+" 關？", names, null); };

/* ================= 結算 ================= */
function finish(){
  show("result");
  const total=deck.length, right=results.filter(Boolean).length, ratio=right/total;
  $("totalN").textContent=total; $("rightN").textContent=right;
  // 復習表：每題一格，綠=答對 紅=答錯
  const rc=$("recap"); rc.innerHTML="";
  deck.forEach((_,i)=>{ const c=document.createElement("div");
    const ok=results[i]; c.textContent=i+1;
    c.style.cssText=`width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;
      font-size:16px;color:#fff;background:${ok?"#38b26b":"#e94b4b"};box-shadow:0 4px 10px var(--shadow)`;
    rc.appendChild(c); });
  $("resScore").textContent="0"; let c=0; const step=Math.max(1,Math.ceil(score/40));
  const t=setInterval(()=>{ c+=step; if(c>=score){c=score;clearInterval(t);} $("resScore").textContent=c; },25);
  let stars="⭐⭐⭐", emo="🏆", msg="太厲害了，你們都是光的專家！";
  if(ratio<.4){stars="⭐";emo="💪";msg="很棒的開始！再玩一次會更神！";}
  else if(ratio<.75){stars="⭐⭐";emo="😎";msg="很強喔！顏色偵探出師啦！";}
  $("resStars").textContent=stars; $("resEmo").textContent=emo; $("resMsg").textContent=msg;
  Snd.win();
  // 盛大慶祝：連續多波彩帶
  confetti(2600); [500,1000,1600].forEach(d=>setTimeout(()=>confetti(1800),d));
}

/* ================= 轉盤 / 抽獎 ================= */
const WHEELCOLS=["#e94b4b","#ff9f1c","#f4c020","#38b26b","#2e9bff","#8a5cf6","#ff5d8f","#42e0c8"];
let curSpinList=[], spinning=false, afterSpin=null, wheelRot=0;
function buildWheel(list){
  const n=list.length, seg=360/n; const stops=[];
  list.forEach((_,i)=>{ const c=WHEELCOLS[i%WHEELCOLS.length]; stops.push(`${c} ${i*seg}deg ${(i+1)*seg}deg`); });
  const w=$("wheel"); w.style.background=`conic-gradient(${stops.join(",")})`;
  w.style.transition="none"; wheelRot=0; w.style.transform="rotate(0deg)"; void w.offsetWidth;
  w.style.transition="";
  // labels（沿半徑排在每一格中央）
  [...w.querySelectorAll(".lab")].forEach(e=>e.remove());
  list.forEach((name,i)=>{
    const el=document.createElement("div"); el.className="lab";
    const ang=(i+0.5)*seg;
    el.style.cssText=`position:absolute;left:0;top:0;width:100%;height:100%;
      display:flex;justify-content:center;align-items:flex-start;padding-top:5%;
      transform:rotate(${ang}deg);pointer-events:none;`;
    el.innerHTML=`<span style="font-weight:900;color:#08131f;max-width:38%;text-align:center;line-height:1.1;
      font-size:clamp(14px,2.3vh,22px);text-shadow:0 1px 2px rgba(255,255,255,.35)">${name}</span>`;
    w.appendChild(el);
  });
}
function openWheel(title, list, after){
  curSpinList=list.slice(); afterSpin=after; spinning=false;
  $("ovTitle").textContent=title; $("winner").innerHTML="&nbsp;";
  buildWheel(curSpinList); $("ov").classList.add("on"); $("spinBtn").disabled=false;
}
$("spinBtn").onclick=()=>{
  if(spinning)return; spinning=true; $("spinBtn").disabled=true; $("winner").innerHTML="&nbsp;";
  Snd.resume(); Snd.whoosh(); Snd.drumStart();
  const n=curSpinList.length, seg=360/n;
  const turns=5+Math.floor(Math.random()*3);
  wheelRot += turns*360 + Math.random()*360;
  const w=$("wheel");
  w.style.transform=`rotate(${wheelRot}deg)`;
  // 轉完後，頂端指針指到的原始角度 → 對應中獎格（指針＝贏家，永遠一致）
  const atTop=(360-(wheelRot%360)+360)%360;
  const win=Math.floor(atTop/seg)%n;
  setTimeout(()=>{
    Snd.drumStop(); Snd.win(); spinning=false; $("spinBtn").disabled=false;
    $("winner").textContent="🎉 "+curSpinList[win]+" 🎉";
    confetti(1600);
  },5200);
};
$("ovCloseBtn").onclick=()=>{ Snd.drumStop(); Snd.click(); $("ov").classList.remove("on"); if(afterSpin)afterSpin(); };
$("drawBtn").onclick=()=>{ Snd.resume(); openWheel("🎁 終極大抽獎！誰是幸運兒？", names, null); };

/* ================= 特效：彩帶 + 飄字 ================= */
const cv=$("fx"), cx=cv.getContext("2d"); let parts=[];
function resize(){ cv.width=innerWidth; cv.height=innerHeight; } resize(); addEventListener("resize",resize);
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(ms=1400){
  if(REDUCE) ms=Math.min(ms,700);
  const cols=["#ffc93c","#ff5d8f","#42e0c8","#38d967","#2e9bff","#ff9f1c","#8a5cf6"];
  const N = REDUCE? 24 : 70;
  for(let i=0;i<N;i++) parts.push({x:Math.random()*innerWidth, y:-20-Math.random()*120,
    vx:(Math.random()-.5)*3, vy:2+Math.random()*3.5, g:.06+Math.random()*.05,
    s:7+Math.random()*8, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*.35, life:ms});
  if(!raf) loop();
}
let raf=null;
function loop(){
  raf=requestAnimationFrame(loop); cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=16;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
  if(parts.length===0){ cancelAnimationFrame(raf); raf=null; cx.clearRect(0,0,cv.width,cv.height); }
}
function flashMsg(txt,color){
  const d=document.createElement("div"); d.textContent=txt;
  d.style.cssText=`position:absolute;top:16%;left:50%;transform:translateX(-50%);z-index:70;
    font-size:clamp(28px,5vh,52px);font-weight:900;color:${color};text-shadow:0 3px 10px #000;
    pointer-events:none;transition:all 1.1s ease;opacity:1`;
  document.body.appendChild(d);
  requestAnimationFrame(()=>{ d.style.top="8%"; d.style.opacity="0"; });
  setTimeout(()=>d.remove(),1200);
}

/* 鍵盤：空白/→ 下一題，1-4 選答（方便老師投影操作） */
addEventListener("keydown",e=>{
  if($("quiz").classList.contains("on")){
    if((e.key===" "||e.key==="ArrowRight")&&!$("nextBtn").hidden){e.preventDefault();$("nextBtn").click();}
    else if(["1","2","3","4"].includes(e.key)&&!locked){ const b=document.querySelectorAll(".opt")[+e.key-1]; if(b)b.click(); }
  }
});
</script>
