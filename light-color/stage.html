<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06070d">
<title>混光魔法・光的舞臺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --bg:#06070d; --bg2:#0b0e1a; --panel:#10131f; --panel2:#161a2b; --line:rgba(120,150,210,.20);
    --amber:#ffc93c; --teal:#42e0c8; --ink:#eef3ff; --dim:#9aa6c8;
    --r:#ff3b3b; --g:#28d24e; --b:#3a86ff;
    --disp:'Fredoka','Noto Sans TC',system-ui,sans-serif; --body:'Noto Sans TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-tap-highlight-color:transparent}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;
    background:linear-gradient(180deg,#0a0c16,#06070d);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .badge{width:42px;height:42px;border-radius:12px;background:radial-gradient(circle at 40% 35%,#ffe08a,var(--amber));
    display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 18px rgba(255,201,60,.5)}
  .brand .t1{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1}
  .brand .t2{font-size:12.5px;color:var(--dim);font-weight:700;margin-top:3px}
  .topbtns{display:flex;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer}
  .pill.on{border-color:var(--teal);color:var(--teal)}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
  .home{position:fixed;left:14px;bottom:14px;z-index:200;background:var(--panel);border:2px solid var(--amber);
    color:var(--amber);font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.5)}

  /* progress */
  .prog{display:flex;align-items:center;gap:14px;padding:12px 20px}
  .prog .lb{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:900;white-space:nowrap}
  .bar{flex:1;height:8px;border-radius:8px;background:#1a1f30;overflow:hidden}
  .bar>i{display:block;height:100%;width:66%;border-radius:8px;
    background:linear-gradient(90deg,var(--b),var(--teal),#c77dff);transition:width .4s}
  .prog .n{font-family:var(--disp);font-weight:700;color:var(--dim);font-size:15px}

  /* layout */
  .stagewrap{display:grid;grid-template-columns:1fr 340px;gap:18px;padding:6px 20px 30px;max-width:1320px;margin:0 auto}
  @media(max-width:900px){.stagewrap{grid-template-columns:1fr}}

  /* stage */
  .stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);
    background:radial-gradient(120% 90% at 50% 0%,#141a2e 0%,#080a12 60%);min-height:440px;isolation:isolate}
  .arc{position:absolute;left:14px;top:14px;bottom:14px;width:112px;z-index:6;
    background:rgba(10,12,22,.72);border:1px solid var(--line);border-radius:16px;padding:12px 8px;
    display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(6px)}
  .arc .h{font-size:11px;letter-spacing:.22em;color:var(--dim);font-weight:900;text-align:center;margin-bottom:6px}
  .node{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;color:var(--dim)}
  .node .num{width:24px;height:24px;border-radius:50%;border:2px solid #33405f;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-family:var(--disp);flex:0 0 auto}
  .node.done .num{background:var(--teal);border-color:var(--teal);color:#062a24}
  .node.cur{color:var(--ink)} .node.cur .num{background:#14243f;border-color:var(--teal);color:var(--teal);box-shadow:0 0 10px rgba(66,224,200,.6)}
  .node:hover{background:rgba(120,150,210,.08)}

  .badge2{position:absolute;right:16px;top:16px;z-index:6;background:rgba(10,12,22,.72);border:1px solid var(--line);
    border-radius:14px;padding:12px 16px;backdrop-filter:blur(6px);min-width:186px}
  .badge2 .k{font-size:10.5px;letter-spacing:.2em;color:var(--dim);font-weight:900}
  .badge2 .big{font-family:var(--disp);font-size:40px;font-weight:700;line-height:1;display:flex;align-items:baseline;gap:8px}
  .badge2 .big small{font-size:15px;color:var(--dim);font-weight:800}
  .badge2 .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-top:8px}
  .badge2 .row span:first-child{color:var(--dim)}
  .badge2 .row .amber{color:var(--amber)}

  /* spotlights */
  .cones{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .cone{position:absolute;top:-6%;width:34%;height:96%;mix-blend-mode:screen;transition:opacity .3s;filter:blur(3px)}
  .cone.r{left:20%;background:conic-gradient(from 180deg at 50% 0,transparent 78deg,rgba(255,59,59,.55) 90deg,transparent 102deg)}
  .cone.g{left:33%;background:conic-gradient(from 180deg at 50% 0,transparent 78deg,rgba(40,210,78,.5) 90deg,transparent 102deg)}
  .cone.b{left:46%;background:conic-gradient(from 180deg at 50% 0,transparent 78deg,rgba(58,134,255,.55) 90deg,transparent 102deg)}

  /* objects */
  .floor{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:2;
    background:linear-gradient(0deg,rgba(120,150,210,.10),transparent);
    border-top:1px solid rgba(120,150,210,.12)}
  .objs{position:absolute;left:120px;right:12px;bottom:10%;z-index:3;display:flex;justify-content:space-around;align-items:flex-end;gap:6px}
  @media(max-width:900px){.objs{left:12px}}
  .obj{width:16.5%;max-width:130px;text-align:center;position:relative}
  .obj img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
  .obj .nm{margin-top:4px;font-family:var(--disp);font-weight:700;font-size:15px;
    background:rgba(0,0,0,.5);border-radius:8px;padding:2px 8px;display:inline-block}
  .obj .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:12px;font-weight:900;border-radius:999px;padding:3px 9px;transition:.2s}
  .obj .tag.see{background:rgba(66,224,200,.9);color:#06231e}
  .obj .tag.dark{background:rgba(120,130,160,.55);color:#0a0e18}

  /* the relight overlay (multiply) */
  .light{position:absolute;left:120px;right:12px;bottom:10%;top:6%;z-index:4;mix-blend-mode:multiply;
    pointer-events:none;transition:background .25s;border-radius:12px}
  @media(max-width:900px){.light{left:12px}}

  .stagebtn{position:absolute;left:120px;bottom:14px;z-index:6;font-family:var(--disp);font-weight:700;font-size:15px;
    background:rgba(12,16,28,.8);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 16px;cursor:pointer}
  @media(max-width:900px){.stagebtn{left:12px}}

  /* mission control */
  .mc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;align-self:start}
  .mc .eye{font-size:11px;letter-spacing:.25em;color:var(--dim);font-weight:900}
  .teach{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0 4px}
  .teach .who{color:var(--teal);font-weight:900;font-size:14px}
  .teach .say{font-weight:800;font-size:17px;line-height:1.45;margin-top:6px}
  .teach a{color:var(--amber);font-weight:900;font-size:14px;text-decoration:none;display:inline-block;margin-top:10px;cursor:pointer}
  .mc h2{font-size:15px;color:var(--dim);font-weight:900;margin:18px 0 4px}
  .mc .title{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.15;margin:2px 0}
  .mc .desc{font-size:16px;font-weight:700;color:var(--dim);line-height:1.5;margin-top:8px}
  .lights{display:flex;gap:10px;margin-top:16px}
  .lbtn{flex:1;font-family:var(--disp);font-weight:700;font-size:19px;border:2px solid;border-radius:14px;padding:14px 4px;
    cursor:pointer;background:#0c1120;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
  .lbtn .d{width:14px;height:14px;border-radius:50%}
  .lbtn.r{border-color:var(--r)} .lbtn.g{border-color:var(--g)} .lbtn.b{border-color:var(--b)}
  .lbtn.r .d{background:var(--r)} .lbtn.g .d{background:var(--g)} .lbtn.b .d{background:var(--b)}
  .lbtn.on.r{background:rgba(255,59,59,.9);color:#2a0000} .lbtn.on.g{background:rgba(40,210,78,.9);color:#052a10} .lbtn.on.b{background:rgba(58,134,255,.9);color:#001233}
  .lbtn.off{opacity:.45}
  .two{display:flex;gap:8px;justify-content:center;margin-top:12px;font-size:13px;color:var(--dim);font-weight:800}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(4,6,14,.9);display:none;align-items:center;justify-content:center;z-index:300;padding:18px}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px}
  .sheet h3{font-family:var(--disp);font-size:26px;margin:0 0 4px}
  .sheet .step{border-left:3px solid var(--teal);padding:8px 0 8px 14px;margin:14px 0}
  .sheet .step .s{font-weight:900;color:var(--teal);font-size:14px}
  .sheet .step .l{font-weight:800;font-size:16px;margin-top:3px}
  .sheet .step .l b{color:var(--amber)}
  .sheet .x{float:right;cursor:pointer;font-size:22px;color:var(--dim);font-weight:900}
  canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;background:transparent;pointer-events:none;z-index:250}
</style>
</head>

<a href="/light/" class="mainmenu-btn" style="position:fixed;right:12px;top:12px;z-index:99999;background:#0f2841;border:2px solid #42e0c8;color:#42e0c8;font-weight:900;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.45);font-family:Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif">🗂️ 主選單</a>
<a class="home" href="./">🏠 回到首頁</a>
<canvas class="confetti" id="cf"></canvas>

<div class="top">
  <div class="brand">
    <div class="badge">✦</div>
    <div><div class="t1">光線特勤隊</div><div class="t2">任務三・混光魔法</div></div>
  </div>
  <div class="topbtns">
    <span class="pill on"><span class="dot"></span>操作層</span>
    <span class="pill" id="soundBtn">🔊 音效</span>
  </div>
</div>

<div class="prog">
  <span class="lb">任務進度</span>
  <div class="bar"><i id="progBar"></i></div>

</div>

<div class="stagewrap">
  <!-- STAGE -->
  <div class="stage">
    <div class="cones">
      <div class="cone r" id="coneR"></div>
      <div class="cone g" id="coneG"></div>
      <div class="cone b" id="coneB"></div>

    <div class="arc" id="arc">

    </div>

    <div class="badge2">

      <div class="row"><span>目前光源</span><span class="amber" id="lightName">白光（紅+綠+藍）</span></div>
      <div class="row"><span>學習模式</span><span>操作層</span></div>
    </div>

    <div class="objs" id="objs"></div>
    <div class="light" id="lightOverlay"></div>

    <button class="stagebtn" id="allBtn">✨ 全部打開／全暗</button>
  </div>

  <!-- MISSION CONTROL -->
  <div class="mc">
    <div class="eye">MISSION CONTROL</div>
    <div class="teach">
      <div class="who">🎙️ 老師這樣說</div>
      <div class="say" id="teachSay">兩盞色光疊在一起，會不會得到新的顏色？請你親手配看。</div>
    </div>
    <h2 id="mcTask">任務 4・混光實驗</h2>
    <div class="title" id="mcTitle">紅、綠、藍光<br>的混色魔法</div>
    <div class="desc" id="mcDesc">開啟兩盞或三盞燈，觀察重疊後出現的色光。紅+綠=黃、綠+藍=青、紅+藍=洋紅、三色全開=白光。</div>
    <div class="lights">
      <button class="lbtn r on" id="lr"><span class="d"></span>紅光</button>
      <button class="lbtn g on" id="lg"><span class="d"></span>綠光</button>
      <button class="lbtn b on" id="lb"><span class="d"></span>藍光</button>
    </div>
    <div class="two">🔵 指認亮的物體　｜　🟠 說出：反射什麼光 → 看得見</div>
  </div>
</div>

<!-- full script modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <span class="x" id="modalX">✕</span>
    <h3>🎬 混光魔法・完整帶課稿</h3>
    <div id="scriptBody"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
/* audio */
let AC,sound=true;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC;}
function tone(f,t,d,ty="triangle",v=.2){if(!sound)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);}
function blip(f){const a=ac();if(!a)return;tone(f||660,a.currentTime,.09,"square",.16);}
function chime(){const a=ac();if(!a)return;const t=a.currentTime;[659,988,1319].forEach((f,i)=>tone(f,t+i*.07,.16));}
$("soundBtn").onclick=()=>{sound=!sound;$("soundBtn").classList.toggle("on",sound);$("soundBtn").textContent=sound?"🔊 音效":"🔇 靜音";blip(700);};
function speak(zh){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(zh);u.lang="zh-TW";u.rate=.88;speechSynthesis.speak(u);}catch(e){}}

/* confetti */
const cv=$("cf"),cx=cv.getContext("2d");let parts=[];
function csize(){cv.width=innerWidth;cv.height=innerHeight;}csize();addEventListener("resize",csize);
const COL=["#ff4d4d","#3aa0ff","#ffc93c","#28c76f","#ff8a5b","#c77dff"];
function confetti(n=120){for(let i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:-20,vx:(Math.random()-.5)*8,vy:Math.random()*3+2,
  g:.26,s:6+Math.random()*8,c:COL[Math.floor(Math.random()*COL.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});crun();}
let craf=null;function crun(){if(!craf)craf=requestAnimationFrame(cl);}
function cl(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+30&&p.life<240);if(parts.length)craf=requestAnimationFrame(cl);else{craf=null;cx.clearRect(0,0,cv.width,cv.height);}}

/* objects */
const OBJS=[
  {k:"apple",nm:"蘋果",ref:["r"]},
  {k:"banana",nm:"香蕉",ref:["r","g"]},
  {k:"plant",nm:"植物",ref:["g"]},
  {k:"shirt",nm:"白衣",ref:["r","g","b"]},
  {k:"backpack",nm:"書包",ref:[]},
];
const objsBox=$("objs");
OBJS.forEach(o=>{
  const d=document.createElement("div");d.className="obj";d.dataset.k=o.k;
  d.innerHTML='<span class="tag see">看得見</span><img src="img/stage/'+o.k+'.png" alt="'+o.nm+'"><div class="nm">'+o.nm+'</div>';
  objsBox.appendChild(d);
});

/* light state */
const on={r:true,g:true,b:true};
function lightName(){
  const s=(on.r?"r":"")+(on.g?"g":"")+(on.b?"b":"");
  return {rgb:"白光（紅+綠+藍）",rg:"黃光（紅+綠）",gb:"青光（綠+藍）",rb:"洋紅（紅+藍）",
    r:"紅光",g:"綠光",b:"藍光","":"全暗（沒有光）"}[s]||"";
}
function refName(ch){return {r:"紅光",g:"綠光",b:"藍光"}[ch];}
let wasWhite=true;
function update(){
  const R=on.r?255:0,G=on.g?255:0,B=on.b?255:0;
  $("lightOverlay").style.background="rgb("+R+","+G+","+B+")";
  $("coneR").style.opacity=on.r?1:0;$("coneG").style.opacity=on.g?1:0;$("coneB").style.opacity=on.b?1:0;
  ["r","g","b"].forEach(k=>$("l"+k).classList.toggle("on",on[k]));
  ["r","g","b"].forEach(k=>$("l"+k).classList.toggle("off",!on[k]));
  $("lightName").textContent=lightName();
  // object tags
  document.querySelectorAll(".obj").forEach(el=>{
    const o=OBJS.find(x=>x.k===el.dataset.k);
    const active=["r","g","b"].filter(c=>on[c]);
    const seen=o.ref.filter(c=>active.includes(c));
    const tag=el.querySelector(".tag");
    if(active.length===0){tag.className="tag dark";tag.textContent="沒有光→全暗";}
    else if(seen.length>0){tag.className="tag see";
      tag.textContent="反射"+(seen.length===1?refName(seen[0]):"光")+"→看得見";}
    else{tag.className="tag dark";tag.textContent=(o.ref.length===0?"吸收全部":"沒反射")+"→變暗";}
  });
  const s=(on.r?"r":"")+(on.g?"g":"")+(on.b?"b":"");
  if(s==="rgb"&&!wasWhite){wasWhite=true;chime();confetti(120);}
  if(s!=="rgb")wasWhite=false;
}
$("lr").onclick=()=>{on.r=!on.r;blip(720);update();speak(on.r?"紅光開":"紅光關");};
$("lg").onclick=()=>{on.g=!on.g;blip(620);update();speak(on.g?"綠光開":"綠光關");};
$("lb").onclick=()=>{on.b=!on.b;blip(520);update();speak(on.b?"藍光開":"藍光關");};
$("allBtn").onclick=()=>{const anyOn=on.r||on.g||on.b;on.r=on.g=on.b=!anyOn;blip(660);update();};
update();

/* story arc */
const ARC=[
  {n:"01",t:"事件",say:"關燈！舞臺一片黑——為什麼什麼都看不到？",task:"任務 1・懸念",title:"黑漆漆的<br>舞臺之謎",desc:"沒有光，就看不到任何顏色。先記住這個謎，最後來破解。"},
  {n:"02",t:"猜想",say:"猜猜看：只開一種顏色的燈，蘋果還會是紅的嗎？",task:"任務 2・預測",title:"顏色<br>會變嗎？",desc:"先大膽猜，等一下用燈光驗證。"},
  {n:"03",t:"緝捕",say:"只開紅燈試試！蘋果亮、植物卻變暗，發生什麼事？",task:"任務 3・探索",title:"抓出<br>變色的兇手",desc:"物體只反射某些顏色的光——這就是選擇性反射。植物只反射綠光，紅燈下就變暗。"},
  {n:"04",t:"混光",say:"兩盞色光疊在一起，會不會得到新的顏色？請你親手配看。",task:"任務 4・混光實驗",title:"紅、綠、藍光<br>的混色魔法",desc:"開兩盞或三盞燈：紅+綠=黃、綠+藍=青、紅+藍=洋紅、三色全開=白光。"},

];
let cur=3;
const arc=$("arc");
ARC.forEach((a,i)=>{
  const d=document.createElement("div");d.className="node";d.dataset.i=i;
  d.innerHTML='<span class="num">'+a.n+'</span>'+a.t;
  d.onclick=()=>{cur=i;renderArc();blip(680);};
  arc.appendChild(d);
});
function renderArc(){
  const a=ARC[cur];
  document.querySelectorAll(".node").forEach((el,i)=>{
    el.classList.toggle("done",i<cur);el.classList.toggle("cur",i===cur);
  });
  $("teachSay").textContent=a.say;speak(a.say);
  $("mcTask").textContent=a.task;$("mcTitle").innerHTML=a.title;$("mcDesc").innerHTML=a.desc;
  $("labNum").innerHTML=a.n+' <small>'+a.t+'｜關卡</small>';
  $("progN").textContent=(cur+1)+" / 6";$("progBar").style.width=((cur+1)/6*100)+"%";
}
renderArc();

  {s:"畫面⑥・破解謎題",l:"回到開場：<b>「黑漆漆看不到，是因為沒有光反射進眼睛。顏色＝光被選擇性反射！」</b>🎉全開白光撒花收尾。"},

function openScript(){const b=$("scriptBody");b.innerHTML=SCRIPT.map(x=>'<div class="step"><div class="s">'+x.s+'</div><div class="l">'+x.l+'</div></div>').join("");$("modal").classList.add("show");}
const _sl=$("scriptLink");if(_sl)_sl.onclick=openScript;
$("modalX").onclick=()=>$("modal").classList.remove("show");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show");};
</script>
