<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<title>光線特勤隊・主選單</title>
<style>
  :root{--bg1:#05101f;--bg2:#0a2036;--bg3:#0e3350;--amber:#ffc93c;--amber2:#ff9f1c;--teal:#42e0c8;
    --ink:#eaf6ff;--dim:#9db8cf;--card:#0f2841;--line:rgba(120,170,210,.28);--shadow:rgba(0,0,0,.45)}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%,rgba(255,201,60,.10),transparent 55%),
      linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:30px 18px 60px}
  header{text-align:center;padding:10px 0 6px}
  .emblem{font-size:84px;line-height:1;filter:drop-shadow(0 8px 18px rgba(255,201,60,.35))}
  .eyebrow{font-size:16px;font-weight:900;letter-spacing:.3em;color:var(--amber);margin-top:6px}
  h1{font-size:44px;margin:4px 0}
  .sub{font-size:20px;color:var(--dim);font-weight:800}
  .tasks{display:grid;grid-template-columns:1fr;gap:18px;margin-top:28px}
  .task{display:flex;align-items:center;gap:22px;background:var(--card);border:3px solid var(--line);border-radius:26px;
    padding:26px 26px;text-decoration:none;color:var(--ink);box-shadow:0 10px 26px var(--shadow);transition:transform .1s,border-color .1s}
  .task:hover{transform:translateY(-4px);border-color:var(--amber)}
  .task .ico{font-size:70px;line-height:1;flex:0 0 auto}
  .task .t{font-size:34px;font-weight:900}
  .task .d{font-size:17px;color:var(--dim);font-weight:700;margin-top:4px}
  .task.one{border-color:rgba(255,201,60,.45)} .task.two{border-color:rgba(66,224,200,.45)} .task.three{border-color:rgba(199,125,255,.5)}
  .tag{display:inline-block;font-size:13px;font-weight:900;color:#08131f;background:linear-gradient(180deg,var(--amber),var(--amber2));
    border-radius:999px;padding:2px 10px;margin-left:10px;vertical-align:middle}
  footer{text-align:center;margin-top:40px;font-size:14px;color:var(--dim)}
  @media(max-width:600px){.task{padding:20px 18px;gap:14px}.task .ico{font-size:52px}.task .t{font-size:26px}h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="emblem">🔦</div>
    <div class="eyebrow">竹東國中自然科</div>
    <h1>光線特勤隊・主選單</h1>
    <div class="sub">點一個任務進去，每一頁右上角都能按「🗂️ 主選單」回來</div>
  </header>

  <div class="tasks">
    <a class="task one" href="../light-shadow/">
      <div class="ico">🔦</div>
      <div><div class="t">任務一・光與影子</div><div class="d">光源・光走直線・影子現形｜簡報・大富翁・搶答・影片</div></div>
    </a>
    <a class="task two" href="../light-reflection/">
      <div class="ico">🪞</div>
      <div><div class="t">任務二・光的反射</div><div class="d">反射定律・鏡面/漫反射｜大富翁・賽車・實驗室・照片館</div></div>
    </a>
    <a class="task three" href="../light-color/">
      <div class="ico">🌈</div>
      <div><div class="t">任務三・光與顏色<span class="tag">本週</span></div><div class="d">色散・選擇性反射・加色混合｜簡報・魔法相機・搶答・實驗室</div></div>
    </a>
  </div>

  <footer>🔦 光線特勤隊　｜　竹東國中自然科　｜　一頁直達所有教材</footer>
</div>
</body>
</html>
