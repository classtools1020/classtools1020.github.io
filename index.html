<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05101f">
<title>Stacey 老師的教室</title>
<style>
  :root{--bg1:#05101f;--bg2:#0a2036;--bg3:#0e3350;--amber:#ffc93c;--teal:#42e0c8;--ink:#eaf6ff;--dim:#9db8cf;--line:rgba(120,170,210,.28)}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(120% 80% at 50% -10%,rgba(255,201,60,.12),transparent 55%),linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
  .wrap{max-width:900px;margin:0 auto;padding:40px 16px 48px}
  header{text-align:center;margin-bottom:28px}
  .eyebrow{font-size:15px;font-weight:900;letter-spacing:.3em;color:var(--amber)}
  h1{font-size:40px;margin:6px 0 4px}
  .sub{font-size:18px;color:var(--dim);font-weight:800}
  .doors{display:grid;gap:18px}
  .door{position:relative;display:flex;align-items:center;gap:20px;min-height:150px;padding:24px 26px;border-radius:26px;overflow:hidden;
    text-decoration:none;color:#fff;border:3px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5);transition:transform .14s,border-color .14s}
  .door:hover,.door:focus-visible{transform:translateY(-4px);border-color:var(--amber);outline:none}
  .door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .door .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,20,.94),rgba(4,10,20,.7) 50%,rgba(4,10,20,.25))}
  .door .ic{position:relative;flex:none;width:88px;height:88px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 8px 18px rgba(0,0,0,.45)}
  .door .tx{position:relative;flex:1;min-width:0}
  .door .t{font-size:30px;font-weight:900;line-height:1.2}
  .door .d{font-size:16px;font-weight:800;color:#ffe08a;margin-top:6px}
  .door .go{position:relative;font-size:36px;color:var(--amber)}
  .main{min-height:190px;border-color:rgba(255,201,60,.6)}
  .main .t{font-size:36px}
  .badge{display:inline-block;font-size:13px;font-weight:900;color:#08131f;background:var(--amber);border-radius:999px;padding:3px 12px;margin-left:8px;vertical-align:middle}
  footer{text-align:center;margin-top:26px;font-size:13px;color:var(--dim)}
  @media(max-width:600px){h1{font-size:30px}.door{gap:14px;padding:18px}.door .ic{width:66px;height:66px;font-size:36px}.door .t{font-size:23px}.main .t{font-size:27px}.door .d{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">竹東國中・特教組</div>
    <h1>Stacey 老師的教室</h1>
    <div class="sub">要去哪裡？點一扇門</div>
  </header>
  <nav class="doors">
    <a class="door main" href="/light/">
      <img src="/light-color/img/rainbow.png" alt="">
      <div class="ov"></div>
      <div class="ic" style="background:linear-gradient(180deg,#ffd85a,#ffb01c)">🔦</div>
      <div class="tx"><div class="t">自然課・光線特勤隊<span class="badge">每天上課用</span></div><div class="d">點日期 → 按「開始這堂課」，一條龍上到底</div></div>
      <div class="go">▶</div>
    </a>
    <a class="door" href="https://hccadaptive.com/">
      <div class="ov" style="background:linear-gradient(90deg,#0f2841,#14304f)"></div>
      <div class="ic" style="background:linear-gradient(180deg,#7ff0e0,#2fc9b3)">🏃</div>
      <div class="tx"><div class="t">適應體育競賽</div><div class="d">成績公告網站（hccadaptive.com）</div></div>
      <div class="go">▶</div>
    </a>
    <a class="door" href="/archive.html">
      <div class="ov" style="background:linear-gradient(90deg,#0f2841,#14304f)"></div>
      <div class="ic" style="background:linear-gradient(180deg,#d6c7ff,#9b7bff)">📦</div>
      <div class="tx"><div class="t">舊教材區</div><div class="d">芎林時期教材・自然課舊版入口</div></div>
      <div class="go">▶</div>
    </a>
  </nav>
  <footer>曾瓊瑩老師 製作</footer>
</div>
</body>
</html>
